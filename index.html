    html += '<div class="hotrow" data-o="' + i + '">' +
      '<div class="rank">·</div><div style="flex:1">' +
      '<div class="htitle" style="font-weight:500;font-size:14.5px">' + esc(cleanLabel(h.label)) + '</div>' +
      '<div class="hmeta">' + h.sets.map(shortSet).join(" · ") + '</div>' +
      '<div class="hdetail">' + hotBody(h) + '</div></div></div>';
  });
  html += '</div></div>';
  html += '<div class="card"><div class="small muted">题库分布</div><div class="chips" style="margin:10px 0 0">' +
    DATA.chapStats.map(c => '<span class="chip">' + esc(c[0].replace("与细胞周期","·周期")) + '<small>' + c[1] + '</small></span>').join("") +
    '</div></div>';
  $("#v-hot").innerHTML = html;
  document.querySelectorAll(".hotrow").forEach(el => {
    el.onclick = () => el.classList.toggle("open");
  });
}

/* ---------- 全部知识点 ---------- */
let seg = "term", kw = "";
const HOTNAMES = new Set(HOT.map(h => (h.label || "").trim()));
function starFor(name){
  for (const h of HOT){
    if (h.kind === "term" && T[h.idx] && T[h.idx].term === name) return '<span class="star">真题</span>';
  }
  return "";
}
function termList(filter){
  const out = [];
  T.forEach((t, i) => {
    if (!filter || (t.term + t.def).includes(filter))
      out.push('<details><summary><b>' + esc(t.term) + '</b>' + starFor(t.term) + '</summary><div class="body">' + esc(t.def) + '</div></details>');
  });
  return out;
}
function qaList(filter){
  const out = [];
  QAD.forEach(q => {
    if (!filter || (q.q + q.a).includes(filter))
      out.push('<details><summary><b>' + esc(cleanLabel(q.q)) + '</b>' + (q.star ? '<span class="star">真题</span>' : '') + '</summary><div class="body">' + esc(q.a || ('（原始资料只给题目，未附答案）' + q.q)) + '</div></details>');
  });
  return out;
}
function saoList(filter){
  const out = [];
  SAO.forEach(s => {
    const text = s.items.map(it => it.type === "p" ? it.text : it.rows.map(r => r.join("｜")).join("\n")).join("\n");
    if (filter && !(s.title + text).includes(filter)) return;
    let body = s.items.map(it => {
      if (it.type === "p") return esc(it.text);
      const rows = it.rows.map(r => "<tr>" + r.map(c => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("");
      return '<table>' + rows + '</table>';
    }).join("\n");
    if (filter){
      body = s.items.filter(it => (it.type === "p" ? it.text : JSON.stringify(it.rows)).includes(filter))
        .map(it => it.type === "p" ? esc(it.text) : it.rows.map(r => esc(r.join(" ｜ "))).join("\n")).join("\n");
    }
    out.push('<details><summary><b>' + esc(s.title) + '</b><span class="tag">' + s.items.length + '</span></summary><div class="body">' + body + '</div></details>');
  });
  return out;
}
function renderAll(){
  const html = '<div class="seg">' +
    '<button data-s="term" class="' + (seg === "term" ? "on" : "") + '">名词解释 ' + T.length + '</button>' +
    '<button data-s="qa" class="' + (seg === "qa" ? "on" : "") + '">简答论述 ' + QAD.length + '</button>' +
    '<button data-s="sao" class="' + (seg === "sao" ? "on" : "") + '">扫盲提纲 ' + SAO.length + '</button>' +
    '</div>' +
    '<input type="search" id="kw" placeholder="搜索名词、题目、知识点" value="' + esc(kw) + '">' +
    '<div class="card" id="alllist" style="margin-top:12px"></div>';
  $("#v-all").innerHTML = html;
  drawList();
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { seg = b.dataset.s; renderAll(); });
  const inp = $("#kw");
  inp.oninput = () => { kw = inp.value.trim(); drawList(); };
}
function drawList(){
  const box = $("#alllist");
  if (!kw){
    const rows = seg === "term" ? termList("") : seg === "qa" ? qaList("") : saoList("");
    box.innerHTML = rows.join("") || '<div class="empty">暂无内容</div>';
    return;
  }
  const groups = [
    ["名词解释", termList(kw)],
    ["简答论述", qaList(kw)],
    ["扫盲提纲", saoList(kw)],
  ].filter(g => g[1].length);
  box.innerHTML = groups.length
    ? groups.map(g => '<div class="small muted" style="margin:4px 0 2px">' + g[0] + ' · ' + g[1].length + '</div>' + g[1].join("")).join("")
    : '<div class="empty">没找到「' + esc(kw) + '」</div>';
}

/* ---------- 做题 ---------- */
let sess = null, chap = "全部";
const doneCount = () => Object.keys(ST.res).length;
const okCount = () => Object.values(ST.res).filter(v => v === 1).length;
const wrongIds = () => Object.keys(ST.res).filter(k => ST.res[k] === 0).map(Number);

function renderQuiz(){
  const total = QS.length, done = doneCount(), ok = okCount();
  const rate = done ? Math.round(ok / done * 100) : 0;
  let html = '<div class="card"><div class="small muted">选择章节</div><div class="chips" id="chaps">' +
    '<span class="chip' + (chap === "全部" ? " on" : "") + '" data-c="全部">全部<small>' + total + '</small></span>' +
    DATA.chapStats.slice().sort((a, b) => CHAPS.indexOf(a[0]) - CHAPS.indexOf(b[0]))
      .map(c => '<span class="chip' + (chap === c[0] ? " on" : "") + '" data-c="' + esc(c[0]) + '">' + esc(c[0].replace("与细胞周期", "")) + '<small>' + c[1] + '</small></span>').join("") +
    '</div>' +
    '<div class="chips" style="margin-top:10px"><span class="chip' + (ST.shuffle ? " on" : "") + '" id="shuf">打乱题序</span></div>' +
    '<button class="btn" id="start">开始练习</button>' +
    (wrongIds().length ? '<button class="btn ghost" id="redo">错题重做 · ' + wrongIds().length + '</button>' : '') +
    '<div class="stat"><span>已做 <b>' + done + '</b>/' + total + '</span>' +
    (done ? '<span>正确率 <b>' + rate + '%</b></span>' : '') + '</div></div>';
  if (!done){
    html += '<div class="card small muted">单选直接点选项；多选可选多个再提交。提交后给答案和对应知识点，做错的题会记下来。</div>';
  }
  $("#v-quiz").innerHTML = html;
  document.querySelectorAll("#chaps .chip").forEach(c => c.onclick = () => { chap = c.dataset.c; renderQuiz(); });
  $("#start").onclick = () => {
    const pool = QS.map((q, i) => i).filter(i => chap === "全部" || QS[i].chapter === chap);
    startSession(pool);
  };
  $("#shuf").onclick = () => { ST.shuffle = !ST.shuffle; persist(); renderQuiz(); };
  const redo = $("#redo");
  if (redo) redo.onclick = () => startSession(wrongIds().slice());
}
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function startSession(ids){
  if (!ids.length) return;
  if (ST.shuffle && ids.length > 1) ids = shuffleArr(ids.slice());
  sess = { ids, pos: 0, sel: new Set(), locked: false, right: 0, wrongList: [] };
  renderQuestion();
}
function renderQuestion(){
  if (!sess) return renderQuiz();
  if (sess.pos >= sess.ids.length) return renderSummary();
  const i = sess.ids[sess.pos], q = QS[i];
  sess.sel = new Set(); sess.locked = false;
  const pct = Math.round(sess.pos / sess.ids.length * 100);
  let html = '<div class="qhead"><span>第 ' + (sess.pos + 1) + ' / ' + sess.ids.length + ' 题 · ' +
    (q.type === "multi" ? "多选" : "单选") + ' · ' + esc(q.chapter.replace("与细胞周期", "")) + '</span>' +
    '<span id="quit" style="color:var(--acc)">退出</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="stem">' + esc(q.stem) + '</div><div id="opts">';
  q.options.forEach((o, k) => {
    html += '<div class="opt" data-k="' + k + '"><span class="L">' + "ABCDE"[k] + '</span><span>' + esc(o) + '</span></div>';
  });
  html += '</div><div id="fb"></div>' +
    '<button class="btn" id="submit" disabled>提交答案</button>' +
    '<button class="btn ghost hide" id="next">' + (sess.pos + 1 >= sess.ids.length ? "看结果" : "下一题") + '</button>';
  $("#v-quiz").innerHTML = html;
  document.querySelectorAll("#opts .opt").forEach(el => el.onclick = () => pick(el));
  $("#submit").onclick = submitQ;
  $("#quit").onclick = () => { sess = null; renderQuiz(); };
  $("#next").onclick = () => { sess.pos++; renderQuestion(); };
  window.scrollTo(0, 0);
}
function pick(el){
  if (sess.locked) return;
  const k = Number(el.dataset.k);
  const multi = QS[sess.ids[sess.pos]].type === "multi";
  if (multi){
    if (sess.sel.has(k)) { sess.sel.delete(k); el.classList.remove("sel"); }
    else { sess.sel.add(k); el.classList.add("sel"); }
  } else {
    sess.sel = new Set([k]);
    document.querySelectorAll("#opts .opt").forEach(x => x.classList.toggle("sel", x === el));
  }
  $("#submit").disabled = sess.sel.size === 0;
}
function submitQ(){
  if (!sess || sess.locked || !sess.sel.size) return;
  sess.locked = true;
  const i = sess.ids[sess.pos], q = QS[i];
  const chosen = [...sess.sel].sort().map(k => "ABCDE"[k]).join("");
  const ok = chosen === q.answer;
  ST.res[i] = ok ? 1 : 0; persist();
  if (ok) sess.right++; else sess.wrongList.push(i);
  document.querySelectorAll("#opts .opt").forEach(el => {
    const L = "ABCDE"[Number(el.dataset.k)];
    const isAns = q.answer.includes(L), isSel = chosen.includes(L);
    el.classList.remove("sel");
    if (isAns) el.classList.add("ok");
    else if (isSel) el.classList.add("bad");
    else el.classList.add("dim");
  });
  const ansText = q.answer.split("").map(L => L + ". " + q.options["ABCDE".indexOf(L)]).join("　");
  let fb = '<div class="fb ' + (ok ? "ok" : "bad") + '">' + (ok ? "回答正确" : "回答错误") +
    '<div class="ans">正确答案：' + esc(ansText) + (q.fixed ? '<span class="fixbadge">答案已订正</span>' : '') + '</div>';
  if (q.note){
    fb += '<div class="note"><b>' + esc(q.note.title) + '</b>　' + esc(q.note.text) + '</div>';
  }
  fb += '</div>';
  $("#fb").innerHTML = fb;
  $("#submit").classList.add("hide");
  $("#next").classList.remove("hide");
  const fbEl = $("#fb");
  if (fbEl) fbEl.scrollIntoView({ block: "center", behavior: "smooth" });
}
function renderSummary(){
  const n = sess.ids.length, right = sess.right;
  const rate = Math.round(right / n * 100);
  let html = '<div class="card"><div class="stem" style="margin-bottom:6px">练习完成</div>' +
    '<div class="stat"><span>答对 <b>' + right + '</b>/' + n + '</span><span>正确率 <b>' + rate + '%</b></span></div>';
  if (sess.wrongList.length){
    html += '<div class="small muted" style="margin-top:14px">本次答错</div>';
    sess.wrongList.forEach(i => {
      html += '<div class="hotrow" style="cursor:default"><div class="rank">·</div><div style="flex:1">' +
        '<div class="htitle" style="font-weight:500;font-size:14px">' + esc(QS[i].stem.slice(0, 40)) + '</div>' +
        '<div class="hmeta">正确答案 ' + QS[i].answer + ' · ' + esc(QS[i].chapter.replace("与细胞周期", "")) + '</div></div></div>';
    });
  } else {
    html += '<div class="small muted" style="margin-top:14px">全部答对</div>';
  }
  html += '<button class="btn" id="again">再练一轮</button>' +
    '<button class="btn ghost" id="back">返回章节</button></div>';
  sess = null;
  $("#v-quiz").innerHTML = html;
  $("#again").onclick = renderQuiz;
  $("#back").onclick = renderQuiz;
}

/* ---------- 切换 ---------- */
function show(v){
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("#v-hot").classList.toggle("hide", v !== "hot");
  $("#v-all").classList.toggle("hide", v !== "all");
  $("#v-quiz").classList.toggle("hide", v !== "quiz");
  if (v === "all") renderAll();
  if (v === "quiz") renderQuiz();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));
$("#sub").textContent = "302 题 · 69 名词 · 54 简答";
renderHot();
</script>
</body>
</html>
