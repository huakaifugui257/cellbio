dx":5,"label":"胞吞作用的类型及各类型的过程。","count":1,"sets":["23 临床细胞生物学"],"topics":["胞吞的三种类型及各类型的过程"]},{"kind":"term","idx":21,"label":"细胞氧化（细胞呼吸）","count":1,"sets":["24 本硕细生"],"topics":["细胞呼吸"]},{"kind":"term","idx":42,"label":"配体","count":1,"sets":["24 本硕细生"],"topics":["配体"]},{"kind":"qa","idx":15,"label":"内质网、高尔基体、溶酶体及过氧化物酶体的标志性酶。","count":1,"sets":["24 本硕细生"],"topics":["高尔基体组成部分及功能"]},{"kind":"term","idx":34,"label":"常染色质","count":1,"sets":["24 本硕细生"],"topics":["染色体化学组成，常染色质异染色质区别"]},{"kind":"raw","idx":null,"label":"microRNA 的定义","count":1,"sets":["24 本硕细生"],"topics":["microRNA 的定义"]},{"kind":"raw","idx":null,"label":"囊泡转运有哪些类型","count":1,"sets":["24 本硕细生"],"topics":["囊泡转运有哪些类型"]},{"kind":"term","idx":59,"label":"细胞决定","count":1,"sets":["24 临床法医生物制药细胞生物"],"topics":["细胞决定"]},{"kind":"term","idx":23,"label":"电子载体","count":1,"sets":["24 临床法医生物制药细胞生物"],"topics":["电子载体"]},{"kind":"term","idx":5,"label":"主动运输","count":1,"sets":["24 影像细胞生物学"],"topics":["主动运输"]},{"kind":"term","idx":22,"label":"呼吸链","count":1,"sets":["24 影像细胞生物学"],"topics":["呼吸链"]},{"kind":"term","idx":50,"label":"联会","count":1,"sets":["24 影像细胞生物学"],"topics":["联会"]},{"kind":"term","idx":26,"label":"微管","count":1,"sets":["24 影像细胞生物学"],"topics":["微管生物学功能"]},{"kind":"qa","idx":40,"label":"简述有丝分裂的过程及意义：","count":1,"sets":["24 影像细胞生物学"],"topics":["有丝分裂时期和主要发生的过程"]},{"kind":"term","idx":31,"label":"染色质","count":1,"sets":["24 影像细胞生物学"],"topics":["染色质的组成和染色体的4 级结构模型"]},{"kind":"raw","idx":null,"label":"是矽肺","count":1,"sets":["24 影像细胞生物学"],"topics":["是矽肺"]},{"kind":"qa","idx":9,"label":"粗面内质网与滑面内质网在形态结构、功能上的区别粗面内质网形态上成板层状排列的扁囊结构，囊腔内为蛋白质物质。","count":1,"sets":["24 影像细胞生物学"],"topics":["粗面内质网的功能"]}],"questions":[{"chapter":"绪论","type":"single","stem":"最早发现细胞并将其命名为cellula的学者是：","options":["A. Leeuwenhoek","R. Hook","R. Brown","C. Darvin","W. Flemming"],"answer":"B","note":{"kind":"manual","title":"解析","text":"1665 年 R. Hook（胡克）用自制显微镜观察软木薄片，看到的是死细胞的细胞壁，把这种小室命名为 cellula（细胞）。"}},{"chapter":"绪论","type":"single","stem":"最早观察到活细胞的学者是：","options":["A. V. Leeuwenhoek","R. Hook","R. Brown","C. Darvin","W. Flemming"],"answer":"A","note":{"kind":"manual","title":"解析","text":"A. v. Leeuwenhoek（列文虎克）用自制高倍显微镜观察了精子、细菌、红细胞等活细胞，是最早看到活细胞的人。"}},{"chapter":"绪论","type":"single","stem":"细胞学说中哪一项是由R.Virchow后来补充而得：","options":["细胞是组成生命的基本单位","没有细胞生命将无法延续","一切细胞来源于细胞","细胞来源不确定","生物体细胞是由细胞组成的"],"answer":"C","note":{"kind":"manual","title":"解析","text":"R. Virchow 后来补充了「一切细胞来源于细胞」（omnis cellula e cellula），把细胞学说从「结构单位」推进到「来源」层面。"}},{"chapter":"绪论","type":"single","stem":"细胞学说最初是由哪位（些）学者提出的","options":["S. Cohen","M. J. Schleiden","T. Schwann","J. D. Robertson","M. J. Schleiden和T. Schwann"],"answer":"E","note":{"kind":"manual","title":"解析","text":"细胞学说由 Schleiden（植物）与 Schwann（动物）于 1838—1839 年共同提出，故为两人并列。"}},{"chapter":"绪论","type":"single","stem":"从生命结构层次来看，细胞生物学是介于____之间的学科","options":["整体和个体","细胞和分子","个体和个体","整体和分子","分子和个体"],"answer":"E","note":{"kind":"manual","title":"解析","text":"细胞生物学以细胞为对象，向上联系个体、向下深入分子，所以介于分子与个体之间。"}},{"chapter":"绪论","type":"single","stem":"生命体结构和功能的基本单位是","options":["原生质","细胞核","细胞","蛋白质分子","核酸分子"],"answer":"C","note":{"kind":"sec","title":"细胞的概论","text":"细胞是生物体的结构和功能的基本单位，是生命活动的基本单位。也是生物体遗传的基本单位，并具有遗传的全能性。"}},{"chapter":"绪论","type":"single","stem":"细胞是有机体 _____ 的基本单位","options":["形态","结构","机能","结构和功能","个体"],"answer":"D","note":{"kind":"sec","title":"细胞的概论","text":"细胞是生物体的结构和功能的基本单位，是生命活动的基本单位。也是生物体遗传的基本单位，并具有遗传的全能性。"}},{"chapter":"绪论","type":"single","stem":"17世纪中叶A. V. Leeuwenhoek用自制显微镜观察到了_____","options":["植物细胞的细胞壁","精子、细菌等活细胞","细胞核","高尔基复合体等细胞器","细胞的有丝分裂"],"answer":"B","note":{"kind":"manual","title":"解析","text":"17 世纪中叶 Leeuwenhoek 观察的是活的精子、细菌、原虫等，他并未看到细胞壁、核或细胞器。"}},{"chapter":"绪论","type":"single","stem":"从根本上说，细胞生物学是研究       的科学。","options":["细胞的化学组成和特性","细胞内遗传物质的结构与遗传调控","细胞的形态结构","细胞间的相互作用","细胞的生命活动规律"],"answer":"E","note":{"kind":"sec","title":"细胞的概论","text":"细胞生物学是研究细胞生命活动规律的科学，它是在显微、亚显微和分子水平三个层次上，以研究细胞之功能、结构之特点，亚细胞器组成为主，并不断向探究细胞与细胞间、细胞与细胞外界相互作用等领域拓展，向探究细胞增殖、分裂、死亡等生命活动内在规律纵深的一门科学。"}},{"chapter":"绪论","type":"single","stem":"区别原核细胞与真核细胞的核心标志是","options":["细胞膜","细胞核","细胞器","基因组","细胞壁"],"answer":"B","note":{"kind":"term","title":"原核细胞","text":"是指一类无明显细胞核结构的单细胞生物。"}},{"chapter":"绪论","type":"multi","stem":"现代细胞生物学在哪些层次上研究细胞的生命活动","options":["分子水平","亚细胞水平","细胞水平","组织水平","器官水平"],"answer":"ABC","note":{"kind":"sec","title":"细胞的概论","text":"细胞生物学是研究细胞生命活动规律的科学，它是在显微、亚显微和分子水平三个层次上，以研究细胞之功能、结构之特点，亚细胞器组成为主，并不断向探究细胞与细胞间、细胞与细胞外界相互作用等领域拓展，向探究细胞增殖、分裂、死亡等生命活动内在规律纵深的一门科学。"}},{"chapter":"绪论","type":"multi","stem":"内膜系统（endomembrane system）主要包括","options":["内质网","高尔基复合体","溶酶体","线粒体","过氧化物酶体"],"answer":"ABCE","note":{"kind":"term","title":"内膜系统","text":"指位于细胞内，在结构、功能和发生上相互关联的膜性细胞器的总称。"}},{"chapter":"绪论","type":"multi","stem":"细胞的基本生命活动包括","options":["生长发育","分裂增殖","遗传变异","细胞衰老","细胞死亡"],"answer":"ABCDE","note":{"kind":"term","title":"细胞衰老","text":"细胞在正常的环境条件下发生的细胞生理功能减退或消失、增值能力减弱以及细胞形态变化，并趋向死亡的现象。"}},{"chapter":"绪论","type":"multi","stem":"原核细胞与真核细胞均含有的结构是","options":["细胞膜","基因组","核糖体","染色体","细胞核"],"answer":"ABCD","note":{"kind":"term","title":"原核细胞","text":"是指一类无明显细胞核结构的单细胞生物。"}},{"chapter":"绪论","type":"multi","stem":"促进细胞学发展为分子细胞生物学。","options":["细胞显微结构的研究","细胞超微结构的研究","细胞工程学的发展","分子生物学的发展","干细胞研究的发展"],"answer":"BD","note":{"kind":"sec","title":"细胞的概论","text":"细胞生物学历经的四个阶段：细胞的发现及细胞学说的提出；细胞器的发现；超微结构研究；分子生物学。"}},{"chapter":"细胞膜","type":"multi","stem":"细胞学说的内容有：","options":["所有生命体都是由细胞构成的","细胞是构成生命体的基本单位","一切细胞来源于已有细胞","细胞由自发晶体形成","一切物种都是终生不变的"],"answer":"ABC","note":{"kind":"sec","title":"细胞的概论","text":"德国科学家施莱登和施旺建立了细胞学说，细胞学说的核心内容：所有生命体都是有细胞构成的；细胞是构成生命体的基本单位；所有细胞来自于已有细胞。"}},{"chapter":"细胞膜","type":"single","stem":"有关协助扩散的描述中，不正确的是","options":["需要转运蛋白参与","转运速率高","存在最大转运速度","从低浓度向高浓度转运","具有可饱和性"],"answer":"D","note":{"kind":"manual","title":"解析","text":"协助扩散是顺浓度梯度、经转运蛋白的被动运输，D 把它说成「从低浓度向高浓度」正是它的错误点。"}},{"chapter":"细胞膜","type":"single","stem":"存在于细胞膜上的钠钾泵，每消耗1分子的ATP可以","options":["泵出3个钠离子，泵进2个钾离子","泵进3个钠离子，泵出2个钾离子","泵出2个钠离子，泵进3个钾离子","泵进2个钠离子，泵出3个钾离子","泵进2个钠离子，泵出2个钾离子"],"answer":"A","note":{"kind":"manual","title":"解析","text":"钠钾泵每水解 1 分子 ATP，泵出 3 个 Na⁺、泵进 2 个 K⁺，形成外正内负的膜电位并维持低钠高钾的胞内环境。"}},{"chapter":"细胞膜","type":"single","stem":"肠腔中葡萄糖浓度低时，小肠上皮细胞吸收葡萄糖的过程属于","options":["简单扩散","同向协同运输","逆向协同运输","吞噬","通道蛋白转运"],"answer":"B","note":{"kind":"manual","title":"解析","text":"肠腔葡萄糖浓度低时，小肠上皮细胞借 Na⁺ 顺浓度梯度进入细胞所释放的能量，把葡萄糖一同带入，属同向协同运输。"}},{"chapter":"细胞膜","type":"single","stem":"细胞膜的化学成分主要有：","options":["核酸和蛋白质","糖类和蛋白质","蛋白质和脂类","糖类和核酸","脂类和核酸"],"answer":"C","note":{"kind":"sec","title":"细胞膜与物质运输","text":"5.细胞膜的化学成分："}},{"chapter":"细胞膜","type":"single","stem":"乙醇进入细胞靠下列哪种方式？","options":["简单扩散","协助扩散","主动运输","协同运输","通道扩散"],"answer":"A","note":{"kind":"term","title":"简单扩散","text":"最简单的物质跨膜转运方式，即物质由浓度高的一侧向浓度低的一侧自由运动。"}},{"chapter":"细胞膜","type":"single","stem":"下列具有抑制心肌细胞Na+-K+泵活动，加强心肌收缩的是：","options":["乌苯苷","细胞松弛素","一氧化氮","蛋白激酶","二氧化碳"],"answer":"A","note":{"kind":"manual","title":"解析","text":"乌苯苷（哇巴因）抑制 Na⁺-K⁺ 泵，使胞内 Na⁺ 升高、Na⁺-Ca²⁺ 交换增强，胞质 Ca²⁺ 增多而加强心肌收缩。"}},{"chapter":"细胞膜","type":"single","stem":"下列哪种物质难以通过无蛋白的人工膜：","options":["氨基酸","丙酮","尿素","二氧化碳","苯"],"answer":"A","note":{"kind":"manual","title":"解析","text":"无蛋白的人工膜只允许脂溶性小分子通过；氨基酸是极性带电分子，必须有转运蛋白才能过膜。"}},{"chapter":"细胞膜","type":"single","stem":"下列哪种运输方式不消耗能量：","options":["协助扩散","胞吞","胞吐","协同运输","钙泵"],"answer":"A","note":{"kind":"manual","title":"解析","text":"协助扩散靠浓度梯度驱动、经转运蛋白，不消耗 ATP；胞吞、胞吐、协同运输、钙泵都要耗能。"}},{"chapter":"细胞膜","type":"single","stem":"目前细胞生物学界广泛认同的细胞膜结构模型是","options":["片层结构模型","流动镶嵌模型","晶格镶嵌模型","板块镶嵌模型","单位膜模型"],"answer":"B","note":{"kind":"sec","title":"细胞膜与物质运输","text":"3.流动镶嵌模型的论点：膜质由双层脂分子构成；蛋白质嵌入细胞膜的方式各异；脂质与蛋白质均是流动的。"}},{"chapter":"细胞膜","type":"single","stem":"造成膜电位外正内负与以下磷脂含量有一定关系","options":["卵磷脂","磷脂乙醇胺","磷脂丝氨酸","鞘磷脂","磷脂酰肌醇"],"answer":"C","note":{"kind":"manual","title":"解析","text":"磷脂酰丝氨酸（磷脂丝氨酸）带负电且主要分布在脂双层胞质面，是造成膜电位外正内负的磷脂因素。"}},{"chapter":"细胞膜","type":"single","stem":"Tay-Sachs病患者脑组织细胞中储积了大量的","options":["脑苷脂","硫酸脑苷脂","神经节苷脂","鞘磷脂","磷脂酰胆碱"],"answer":"C","note":{"kind":"sec","title":"细胞膜与物质运输","text":"ii.糖脂（神经节苷脂过多沉积于神经细胞导致家族性黑矇性痴呆Tay－Sachs）；"}},{"chapter":"细胞膜","type":"single","stem":"用光脱色恢复技术可以证明膜的流动性，其原理是（答案太长）","options":["用紫外线淬灭质膜上一部分膜受体的荧光素","用激光束淬灭质膜上一部分膜受体的荧光素","用紫外线淬灭膜蛋白或膜脂的荧光素","用激光照射整个细胞表面，使荧光淬灭","以上答案都对"],"answer":"B","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞膜","type":"single","stem":"膜脂的基本成分是","options":["胆固醇","脑苷脂","糖脂","鞘磷脂","磷脂"],"answer":"E","note":{"kind":"manual","title":"解析","text":"膜脂中磷脂含量最高，是构成脂双层骨架的基本成分；胆固醇、糖脂只占少部分。"}},{"chapter":"细胞膜","type":"single","stem":"在细胞膜中对脂质的物理状态具有维持和调节作用的分子是","options":["胆固醇","脑苷脂","糖脂","鞘磷脂","磷脂"],"answer":"A","note":{"kind":"manual","title":"解析","text":"胆固醇以其刚性甾环插在磷脂烃链之间，高温时限制脂链运动、低温时阻止脂链紧密排列，从而双向调节膜的流动性。"}},{"chapter":"细胞膜","type":"single","stem":"承担细胞膜物质运输功能的主要物质是","options":["磷脂","糖类","蛋白质","类固醇","无机盐"],"answer":"C","note":{"kind":"manual","title":"解析","text":"膜蛋白承担物质运输、受体、酶、识别等功能，是膜功能的主要执行者；磷脂只提供骨架。"}},{"chapter":"细胞膜","type":"single","stem":"制备具有活性跨膜蛋白最常采用下列哪种试剂","options":["氯化钠","SDS","NP40","Triton X-100","水"],"answer":"D","note":{"kind":"manual","title":"解析","text":"Triton X-100 是温和的非离子去垢剂，能溶解膜脂而保留蛋白活性；SDS 会使蛋白变性，不宜用于制备活性膜蛋白。"}},{"chapter":"细胞膜","type":"single","stem":"关于膜蛋白，下列说法正确的是","options":["膜蛋白都是兼性分子","膜蛋白很难分离，均需要用去垢剂分离","脂锚定蛋白通过疏水键与脂分子结合","外周蛋白即可通过非共价键与膜脂结合，也可与膜整合蛋白结合","膜蛋白的运动方式与膜脂相同"],"answer":"D","note":{"kind":"manual","title":"解析","text":"外周蛋白靠非共价键（离子键、氢键）附着在膜脂极性头部或整合蛋白的胞质侧，故 D 正确；膜蛋白并非都需去垢剂，脂锚定蛋白靠共价键与脂结合。"}},{"chapter":"细胞膜","type":"single","stem":"膜蛋白分子的运动形式包括","options":["侧向运动和翻转运动","侧向运动和伸缩运动","侧向运动和旋转运动","侧向运动和左右摆动","侧向运动和跳跃运动"],"answer":"C","note":{"kind":"manual","title":"解析","text":"膜蛋白主要做侧向扩散和旋转运动，翻转运动极少，也不能像膜脂那样伸缩、摆动。"}},{"chapter":"细胞膜","type":"single","stem":"能增加细胞膜流动性的因素是","options":["胆固醇","长链脂肪酸","饱和脂肪酸","卵磷脂/鞘磷脂的比例高","温度降低"],"answer":"D","note":{"kind":"manual","title":"解析","text":"卵磷脂含较多不饱和脂肪酸、鞘磷脂较饱和，卵磷脂/鞘磷脂比值高时膜流动性大；胆固醇过多、饱和脂肪酸长链、降温都降低流动性。"}},{"chapter":"细胞膜","type":"single","stem":"膜脂分子的运动方式少见的类型是","options":["翻转运动","侧向运动","左右摆动","旋转运动","伸缩运动"],"answer":"A","note":{"kind":"manual","title":"解析","text":"膜脂的翻转运动（从一层翻到另一层）需要翻转酶参与、耗能，是发生最慢、最少见的一种运动方式。"}},{"chapter":"细胞膜","type":"single","stem":"在电子显微镜下，单位膜所呈现出的结构是","options":["一层深色带","一层浅色带","一层深色带和一层浅色带","二层深色带中间夹一层浅色带","二层浅色带中间夹一层深色带"],"answer":"D","note":{"kind":"manual","title":"解析","text":"单位膜在电镜下呈「暗—明—暗」三层，即两层深色带（蛋白质+磷脂极性头部）夹一层浅色带（疏水尾部）。"}},{"chapter":"细胞膜","type":"single","stem":"在简单扩散的跨膜转运中，下列物质按扩散速度由快到慢依次应为","options":["乙醇、硝酸钠、甘油、葡萄糖、色氨酸","乙醇、甘油、葡萄糖、色氨酸、硝酸钠","乙醇、硝酸钠、葡萄糖、甘油、色氨酸","甘油、乙醇、硝酸钠、色氨酸、葡萄糖","乙醇、甘油、色氨酸、葡萄糖、硝酸钠"],"answer":"E","note":{"kind":"term","title":"简单扩散","text":"最简单的物质跨膜转运方式，即物质由浓度高的一侧向浓度低的一侧自由运动。"}},{"chapter":"细胞膜","type":"single","stem":"关于细胞膜中糖类的描述不正确的是","options":["含量约占质膜重量的2%～10%","主要以糖蛋白和糖脂的形式存在","低聚糖侧链从生物膜的胞质面伸出","其糖类部分对蛋白质的性质影响很大","与细胞免疫、细胞识别及细胞癌变有密切关系"],"answer":"C","note":{"kind":"manual","title":"解析","text":"糖类的低聚糖侧链一律伸出细胞膜的外表面（胞外被膜），不朝向胞质面，故 C 错。"}},{"chapter":"细胞膜","type":"single","stem":"通过固有性分泌途径排出细胞的物质是","options":["激素","神经递质","细胞因子","分泌蛋白","消化酶"],"answer":"D","note":{"kind":"manual","title":"解析","text":"固有性（组成型）分泌途径指不受调节、持续不断地把新合成蛋白送到细胞外的途径，分泌蛋白（如胶原）走这条路；激素、递质、消化酶属调节型分泌。"}},{"chapter":"细胞膜","type":"single","stem":"植物细胞和细菌的协同运输常利用哪一种离子的浓度梯度来驱动","options":["H+","Na+","K+","Ca2+","Cl－"],"answer":"A","note":{"kind":"manual","title":"解析","text":"植物细胞和细菌质膜上多用 H⁺ 梯度驱动协同运输，动物细胞才主要用 Na⁺ 梯度。"}},{"chapter":"细胞膜","type":"single","stem":"主动运输与胞吞作用的共同点是","options":["运输大分子物质","逆浓度梯度运送","需载体蛋白帮助","有细胞膜形态和结构的改变","消耗代谢能"],"answer":"E","note":{"kind":"term","title":"主动运输","text":"是指需要消耗能量把跨膜转运的物质由低浓度的一侧向高浓度一侧的运输过程。"}},{"chapter":"细胞膜","type":"single","stem":"关于囊性纤维化描述正确的是","options":["是一种常染色体显性遗传病","主要临床表现为肺与肝脏的纤维化","由CFTR基因突变引起","其发生与阳离子通道功能障碍有关","患者可自愈"],"answer":"C","note":{"kind":"manual","title":"解析","text":"囊性纤维化是 CFTR（囊性纤维化跨膜转导调节因子）基因突变导致氯离子通道功能异常，属常染色体隐性遗传。"}},{"chapter":"细胞膜","type":"single","stem":"受体介导的胞吞作用不具有的特点是","options":["在细胞膜的特定区域进行","形成有被小窝和有被小泡","吸入大量的细胞外液","胞吞速率比液相胞吞快","选择性的浓缩运输物质"],"answer":"C","note":{"kind":"term","title":"受体介导的胞吞作用","text":"细胞通过受体的介导，高效摄取细胞外特定大分子物质的过程。"}},{"chapter":"细胞膜","type":"single","stem":"关于囊泡运输说法正确的是","options":["COP I囊泡介导蛋白质从高尔基复合体返回至内质网","COP II囊泡介导蛋白质在高尔基复合体的反向运输","网格蛋白囊泡介导蛋白质由粗面内质网到高尔基复合体方向的运输","所有的囊泡中都含有一条单肽链的ATP酶","囊泡通常含有一段特异序列可识别蛋白质运输的方向"],"answer":"A","note":{"kind":"term","title":"囊泡运输","text":"膜性囊泡以出芽的形式从供体细胞器或质膜生成后，携带着运送的物质到受体细胞器或质膜，并与之融合，此过程为囊泡运输。"}},{"chapter":"细胞膜","type":"single","stem":"关于离子通道蛋白下列描述错误的是","options":["大多数的离子通道不是持续开放的，而是有闸门控制的","物质运输的速度比载体蛋白快","各种离子均顺着其电化学梯度沿通道跨过膜","通道无选择性","常见的有电压闸门离子通道和配体闸门离子通道两种"],"answer":"D","note":{"kind":"manual","title":"解析","text":"离子通道对离子有严格选择性（由通道孔径和电荷决定），故 D 错；通道转运速率高于载体，且多受闸门控制。"}},{"chapter":"细胞膜","type":"single","stem":"孔（道）蛋白的功能是（建议换题）","options":["细胞骨架","基因活化","结构","自我识别","运输"],"answer":"E","note":{"kind":"manual","title":"解析","text":"孔道蛋白（porin）位于线粒体外膜等处，形成亲水性通道，功能是运输小分子。"}},{"chapter":"细胞膜","type":"multi","stem":"有关协助扩散的描述中，不正确的是","options":["需要ATP提供能量","需要转运蛋白参与","从高浓度向低浓度转运","从低浓度向高浓度转运","可协助离子转运"],"answer":"AD","note":{"kind":"sec","title":"细胞膜与物质运输","text":"i.ATP提供能量的离子泵运输：泵入两分子钾离子，泵出三分子钠离子。"}},{"chapter":"细胞膜","type":"multi","stem":"生物膜的特性包括：","options":["对称性","流动性","不对称性","不流动性","以上都对"],"answer":"BC","note":{"kind":"manual","title":"解析","text":"生物膜的两大特性是流动性与不对称性；对称性和不流动性都不成立。"}},{"chapter":"细胞膜","type":"multi","stem":"下列哪种分子属于由极性的头部和疏水尾部构成的两亲性分子","options":["磷脂","胆固醇","糖脂","蛋白聚糖","外周蛋白"],"answer":"ABC","note":{"kind":"manual","title":"解析","text":"磷脂、胆固醇、糖脂都是含极性头与疏水尾的两亲性分子；蛋白聚糖和外周蛋白不构成膜脂双层的两亲性骨架。"}},{"chapter":"细胞膜","type":"multi","stem":"钠-钾泵的主要特点有","options":["逆电化学梯度对向运输","消耗能量ATP","钠离子出胞","钾离子入胞","有磷酸化和去磷酸化改变"],"answer":"ABCDE","note":{"kind":"manual","title":"解析","text":"钠钾泵逆电化学梯度把 Na⁺ 泵出、K⁺ 泵入，消耗 ATP，并经历磷酸化/去磷酸化循环，五项全对。"}},{"chapter":"细胞膜","type":"multi","stem":"影响细胞膜流动性的因素包括","options":["胆固醇的含量","温度","细胞骨架","脂肪酸链的长度","饱和脂肪酸的含量"],"answer":"ABCDE","note":{"kind":"term","title":"细胞骨架","text":"是细胞内蛋白质纤维网架体系的总称，包括微丝，微管和中间丝。"}},{"chapter":"细胞膜","type":"multi","stem":"协助扩散与简单扩散相比","options":["需要特异的蛋白质的协助","需要消耗能量","转运的特异性强","转运效率高","存在最大转运速度"],"answer":"ACDE","note":{"kind":"term","title":"简单扩散","text":"最简单的物质跨膜转运方式，即物质由浓度高的一侧向浓度低的一侧自由运动。"}},{"chapter":"细胞膜","type":"multi","stem":"下列哪种物质通过受体介导的胞吞作用进入细胞","options":["低密度脂蛋白","维生素B12","流感病毒","铁离子","钠离子"],"answer":"ABCD","note":{"kind":"term","title":"受体介导的胞吞作用","text":"细胞通过受体的介导，高效摄取细胞外特定大分子物质的过程。"}},{"chapter":"细胞膜","type":"multi","stem":"必须通过载体蛋白运输的物质","options":["二氧化碳","葡萄糖","氨基酸","甘油","核苷酸"],"answer":"BCE","note":{"kind":"term","title":"载体蛋白","text":"需要同被运输的离子和分子结合,然后通过自身的构型变化或移动完成物质运输的膜蛋白。"}},{"chapter":"细胞膜","type":"multi","stem":"生物膜的不对称性表现为","options":["膜蛋白分布不对称","膜脂分布不对称","膜上糖基分布不对称","膜上无机离子分布不对称","以上答案都对"],"answer":"ABC","note":{"kind":"manual","title":"解析","text":"膜的不对称性表现为膜脂、膜蛋白、糖链三者的分布都不对称（糖链只在外表面）。"}},{"chapter":"细胞膜","type":"multi","stem":"小肠上皮吸收葡萄糖以及各种氨基酸时，通过哪种形式达到逆浓度梯度运输","options":["与K+相伴运输","载体蛋白利用ATP能量","与Ca2+相伴运输","与 Na+相伴运输","载体蛋白利用电势能"],"answer":"DE","note":{"kind":"term","title":"载体蛋白","text":"需要同被运输的离子和分子结合,然后通过自身的构型变化或移动完成物质运输的膜蛋白。"}},{"chapter":"细胞膜","type":"multi","stem":"常用于研究膜蛋白流动性的方法包括","options":["荧光抗体免疫标记","荧光能量共振转移","光脱色荧光恢复法","荧光标记细胞融合","电子自旋共振技术"],"answer":"ABCD","note":{"kind":"manual","title":"解析","text":"荧光漂白恢复（FRAP）、荧光标记细胞融合、荧光抗体免疫标记、荧光共振能量转移都用于研究膜蛋白流动性；电子自旋共振测的是膜脂运动。"}},{"chapter":"内膜系统","type":"multi","stem":"关于细胞膜与疾病，下述说法正确的是","options":["家族性高胆固醇血症由编码LDL受体的基因发生突变引起","肾性糖尿是由于载体异常而导致","胱氨酸尿症是由于膜受体异常导致","细胞癌变时，细胞表面会出现糖链短缺不全","囊性纤维化是由于阳离子通道异常而引发"],"answer":"ABC","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"内膜系统","type":"single","stem":"下列哪种细胞器不属于内膜系统","options":["高尔基复合体","过氧化物酶体","线粒体","溶酶体","内质网"],"answer":"C","note":{"kind":"term","title":"内膜系统","text":"指位于细胞内，在结构、功能和发生上相互关联的膜性细胞器的总称。"}},{"chapter":"内膜系统","type":"single","stem":"核糖体的主要化学成分为","options":["DNA和蛋白质","RNA和蛋白质","DNA","RNA","蛋白质"],"answer":"B","note":{"kind":"sec","title":"简答·细胞周期时期的划分及各时期的","text":"细胞体积增大，RNA、核糖体及大量蛋白质合成。S：进行DNA的复制、染色体组成（组蛋白和非组蛋白）的合成。中心粒复制。G2：继续合成大量RNA和蛋白质，特别是微管蛋白、有丝分裂因子。并合成有丝分裂调控的重要因子——MPFM：染色质螺旋化变为染色体，并均匀分配到两个子细胞的过程。同时伴有核的一系列变化和胞质分裂。"}},{"chapter":"内膜系统","type":"single","stem":"细胞内不含内膜系统的细胞是","options":["肝细胞","肿瘤细胞","胰腺细胞","胚胎细胞","红细胞"],"answer":"E","note":{"kind":"term","title":"内膜系统","text":"指位于细胞内，在结构、功能和发生上相互关联的膜性细胞器的总称。"}},{"chapter":"内膜系统","type":"single","stem":"当细胞匀浆化被破坏后，内质网断裂成许多封闭小泡，被称为","options":["线粒体","微粒体","溶酶体","残余小体","运输小泡"],"answer":"B","note":{"kind":"manual","title":"解析","text":"细胞匀浆后内质网断裂、自我封闭成的小泡叫微粒体，是研究内质网的常用材料。"},"fixed":true,"orig":"B"},{"chapter":"内膜系统","type":"single","stem":"下列细胞中，哪一种具有发达的粗面内质网","options":["胚胎细胞","干细胞","肿瘤细胞","胰腺细胞","骨骼肌细胞"],"answer":"D","note":{"kind":"manual","title":"解析","text":"胰腺细胞大量合成和分泌消化酶，粗面内质网最发达；胚胎细胞、干细胞、肿瘤细胞以增殖为主，粗面内质网不发达。"},"fixed":true,"orig":"D"},{"chapter":"内膜系统","type":"single","stem":"下列与新生肽链的折叠、转运有关的分子是","options":["信号肽","葡萄糖-6-磷酸酶","分子伴侣","网格蛋白","组蛋白"],"answer":"A","note":{"kind":"term","title":"信号肽","text":"有信号密码翻译出的一段约18—30个疏水氨基酸组成的肽链。"}},{"chapter":"内膜系统","type":"single","stem":"关于信号识别颗粒SRP的错误叙述是","options":["存在于细胞质基质","可占据核糖体P位","由6个多肽链和一个RNA分子组成","可与蛋白质分子中的信号肽结合","可与位于内质网膜上的SRP受体结合"],"answer":"A","note":{"kind":"term","title":"细胞质","text":"细胞的组成部分之一，包括无色透明的胶状物质和各种细胞器，在细胞核和细胞膜之间。"}},{"chapter":"内膜系统","type":"single","stem":"各种生物膜均由蛋白质和脂类构成，但含量有差异，脂类的含量由高到低的排列顺序正确的是","options":["内质网膜 > 高尔基复合体膜 > 细胞膜","细胞膜 > 高尔基复合体膜 > 内质网膜","高尔基复合体膜 > 内质网膜 > 细胞膜","高尔基复合体膜 > 细胞膜 > 内质网膜","内质网膜 > 细胞膜 > 高尔基复合体膜"],"answer":"D","note":{"kind":"sec","title":"内膜系统","text":"把细胞质中由核膜，内质网膜，高尔基复合体膜的小管、小泡、扁囊组成的系统叫做内膜系统具有流动性，镶嵌性，不对称性和蛋白质极性。"}},{"chapter":"内膜系统","type":"single","stem":"蛋白质N-连接寡糖的糖基化作用主要发生在","options":["粗面内质网腔内","高尔基复合体内","粗面内质网膜上","滑面内质网膜上","高尔基复合体膜上"],"answer":"C","note":{"kind":"sec","title":"内膜系统","text":"内质网膜的标志酶是葡萄糖-6-磷酸酶。滑面内质网的标志酶是细胞色素P-450。粗面内质网上合成的蛋白质种类：分泌蛋白，可溶性驻留蛋白，膜蛋白。"}},{"chapter":"内膜系统","type":"single","stem":"下列哪种蛋白质是在游离核糖体上合成的","options":["钠-钾离子泵","驻留蛋白","血红蛋白","酸性磷酸酶","胰岛素"],"answer":"B","note":{"kind":"sec","title":"内膜系统","text":"内质网膜的标志酶是葡萄糖-6-磷酸酶。滑面内质网的标志酶是细胞色素P-450。粗面内质网上合成的蛋白质种类：分泌蛋白，可溶性驻留蛋白，膜蛋白。"}},{"chapter":"内膜系统","type":"single","stem":"粗面内质网的标志酶是","options":["胰酶","DNA聚合酶","葡萄糖-6-磷酸酶","RNA聚合酶","糖基转移酶"],"answer":"C","note":{"kind":"sec","title":"内膜系统","text":"内质网膜的标志酶是葡萄糖-6-磷酸酶。滑面内质网的标志酶是细胞色素P-450。粗面内质网上合成的蛋白质种类：分泌蛋白，可溶性驻留蛋白，膜蛋白。"}},{"chapter":"内膜系统","type":"single","stem":"高尔基复合体的主要生物学功能是","options":["蛋白质合成","合成脂类","对蛋白质进行加工和转运","参与细胞氧化过程","折叠肽链"],"answer":"C","note":{"kind":"sec","title":"简答·简要归纳分泌蛋白的合成、加工","text":"内质网——高尔基体——囊泡——细胞膜——细胞外。分为6个阶段：（1）核糖体阶段，包括分泌型蛋白质的合成和蛋白质跨膜转运；内质网运输阶段，包括分泌蛋白腔内运输、蛋白质糖基化等粗加工和储存；细胞质基质运输阶段，分泌蛋白与小泡形成脱离糙面内质网移向高尔基复合体，与其顺面扁平囊融合；（4）高尔基复合体加工修饰阶段，分泌蛋白质在高尔基复合体的扁平囊内进行加工，然后以大"}},{"chapter":"内膜系统","type":"single","stem":"高尔基复合体的特征酶是","options":["糖基转移酶","甘露糖苷酶","酪蛋白磷酸激酶","磺基-糖基转移酶","NADP酶"],"answer":"A","note":{"kind":"sec","title":"内膜系统","text":"高尔基复合体的化学组成：蛋白质，脂类，糖脂。"}},{"chapter":"内膜系统","type":"single","stem":"肌质网属于","options":["滑面内质网","粗面内质网","高尔基复合体","溶酶体","过氧化物酶体"],"answer":"A","note":{"kind":"manual","title":"解析","text":"肌质网是骨骼肌中特化的滑面内质网，储存和释放 Ca²⁺ 以调控肌丝滑动。"}},{"chapter":"内膜系统","type":"single","stem":"属于高尔基中间膜囊功能的是","options":["接受来自于内质网的运输小泡","将内质网蛋白驻留蛋白遣返至内质网","对糖蛋白进行O-连接方式的糖基化修饰","分选来自内质网新合成的蛋白质和脂质","分泌磷酸酶"],"answer":"B","note":{"kind":"manual","title":"解析","text":"高尔基中间膜囊负责对糖蛋白做 O-连接糖基化等加工，并通过 KDEL 受体把误入的内质网驻留蛋白遣返回内质网。"}},{"chapter":"内膜系统","type":"single","stem":"在细胞的分泌活动中，分泌物质的合成、加工、运输过程的顺序为","options":["粗面内质网→高尔基复合体→细胞外","高尔基复合体→粗面内质网→分泌泡→细胞膜→细胞外","粗面内质网→高尔基复合体→分泌泡→细胞膜→细胞外","高尔基复合体小囊泡→扁平囊→大囊泡→分泌泡→细胞膜→细胞外","以上都不是"],"answer":"C","note":{"kind":"manual","title":"解析","text":"分泌蛋白的路线是：粗面内质网合成→高尔基复合体加工分选→分泌泡→细胞膜→胞外，即 C。"},"fixed":true,"orig":"C"},{"chapter":"内膜系统","type":"single","stem":"溶酶体膜蛋白的结构特点是","options":["极少有寡糖链","寡糖链朝向膜外侧","高度糖基化且糖链朝向膜内侧","无寡糖链","以上都不是"],"answer":"C","note":{"kind":"manual","title":"解析","text":"溶酶体膜蛋白高度糖基化，糖链朝向膜内侧（溶酶体腔面），可保护膜自身不被腔内水解酶消化。"}},{"chapter":"内膜系统","type":"single","stem":"溶酶体的标志酶是","options":["氧化酶","蛋白水解酶","酸性水解酶","酸性磷酸酶","氧化磷酸酶"],"answer":"D","note":{"kind":"sec","title":"内膜系统","text":"溶酶体的标志酶是酸性磷酸酶。"}},{"chapter":"内膜系统","type":"single","stem":"下列哪项不是溶酶体的功能","options":["营养、防御","器官发育","受精作用","激素的合成与分泌调节","蛋白质的合成"],"answer":"E","note":{"kind":"sec","title":"内膜系统","text":"粗面内质网的功能：与蛋白质的合成（N型糖基化），加工和运输有关。"}},{"chapter":"内膜系统","type":"single","stem":"溶酶体在细胞内作用的基本形式是","options":["膜破裂释放水解酶","膜可透出水解酶","将被消化的物质转运入溶酶体内","形成次级溶酶体进行胞内消化","溶酶体形成囊泡释放水解酶"],"answer":"C","note":{"kind":"manual","title":"解析","text":"溶酶体的基本工作方式是把待消化的物质摄入溶酶体内，形成次级溶酶体进行胞内消化；它不会随意破裂释放酶。"}},{"chapter":"内膜系统","type":"single","stem":"执行功能作用的溶酶体是","options":["初级溶酶体","大泡性溶酶体","残余小体","内体性溶酶体","吞噬性溶酶体"],"answer":"E","note":{"kind":"manual","title":"解析","text":"吞噬性溶酶体（次级溶酶体）内含已被摄入的底物和水解酶，是真正执行消化功能的形态。"}},{"chapter":"内膜系统","type":"single","stem":"下列哪种物质不能被溶酶体酶进一步分解","options":["氨基酸","多糖","脂类","多聚核苷酸","蛋白质"],"answer":"A","note":{"kind":"manual","title":"解析","text":"氨基酸是蛋白质被溶酶体酶水解后的终产物，不能再被进一步分解，需运出溶酶体供细胞再利用。"}},{"chapter":"内膜系统","type":"single","stem":"溶酶体酶进行水解作用的最适pH值是","options":["3-4","5","6","7","8"],"answer":"B","note":{"kind":"manual","title":"解析","text":"溶酶体腔内靠质子泵维持酸性，水解酶最适 pH 约 5（4.5～5）。"}},{"chapter":"内膜系统","type":"single","stem":"哺乳动物精子的头部有一种特化的结构叫顶体，它实际上相当于下列哪种结构","options":["高尔基复合体","残余小体","分泌泡","溶酶体","衰老细胞器"],"answer":"A","note":{"kind":"manual","title":"解析","text":"顶体由高尔基复合体形成，内含多种水解酶，功能上属特化的溶酶体样结构，故与高尔基复合体的发生关系最直接。"}},{"chapter":"内膜系统","type":"single","stem":"脂褐质常见于","options":["肝实质细胞","单核吞噬细胞","肺泡细胞","卵母细胞","神经细胞"],"answer":"E","note":{"kind":"manual","title":"解析","text":"脂褐质（脂褐素）是溶酶体残余体不断堆积形成的衰老色素，多见于神经细胞、心肌细胞、肝细胞等不分裂的长期存活细胞。"},"fixed":true,"orig":"E"},{"chapter":"内膜系统","type":"single","stem":"过氧化物酶体的主要功能是","options":["合成ATP","胞内消化作用","参与过氧化氢的形成及分解","合成蛋白质","分解囊泡"],"answer":"C","note":{"kind":"sec","title":"内膜系统","text":"过氧化物酶体的标志酶是过氧化氢酶。"}},{"chapter":"内膜系统","type":"single","stem":"过氧化物酶体的标志酶是","options":["过氧化氢酶","尿酸氧化酶","L-氨基酸氧化酶","L-羟基酸氧化酶","D-氨基酸氧化酶"],"answer":"A","note":{"kind":"sec","title":"内膜系统","text":"过氧化物酶体的标志酶是过氧化氢酶。"}},{"chapter":"内膜系统","type":"single","stem":"COPⅡ参与的蛋白质运输过程是","options":["内质网→高尔基体","高尔基体→内质网","细胞质基质→线粒体","质膜→内体","高尔基体→溶酶体"],"answer":"B","note":{"kind":"sec","title":"简答·囊泡的三种类型及运输方向。","text":"网格蛋白包被囊泡、COPⅠ、COPⅡ。运输方向：网格蛋白包被小泡负责蛋白质从高尔基体反面的管网结构到质膜、胞内体或溶酶体运输；同时在受体介导细胞膜内吞过程中，也负责将物质从质膜-内吞泡-包内体-溶酶体的运输。COPⅠ包被囊泡主要负责高尔基体内蛋白逆向转运，同时回收、转运内质网逃逸蛋白。COPⅡ包被囊泡运出内质网合成的蛋白到高尔基复合体。"}},{"chapter":"内膜系统","type":"single","stem":"N连接的糖基化中，寡糖链连接在哪一种氨基酸上","options":["天冬酰胺","天冬氨酸","苏氨酸","酪氨酸","丝氨酸"],"answer":"A","note":{"kind":"manual","title":"解析","text":"N-连接糖基化是把寡糖链连到 Asn（天冬酰胺）的酰胺氮上，序列为 Asn-X-Ser/Thr；天冬氨酸是 Asp，属酸性氨基酸，不参与 N-连接。"},"fixed":true,"orig":"A"},{"chapter":"内膜系统","type":"single","stem":"溶酶体酶在高尔基复合体被分选的标志是","options":["葡萄糖-6-磷酸","6-磷酸甘露糖","KDEL","网格蛋白","N-末端的信号肽序列"],"answer":"D","note":{"kind":"sec","title":"简答·囊泡的三种类型及运输方向。","text":"网格蛋白包被囊泡、COPⅠ、COPⅡ。运输方向：网格蛋白包被小泡负责蛋白质从高尔基体反面的管网结构到质膜、胞内体或溶酶体运输；同时在受体介导细胞膜内吞过程中，也负责将物质从质膜-内吞泡-包内体-溶酶体的运输。COPⅠ包被囊泡主要负责高尔基体内蛋白逆向转运，同时回收、转运内质网逃逸蛋白。COPⅡ包被囊泡运出内质网合成的蛋白到高尔基复合体。"}},{"chapter":"内膜系统","type":"single","stem":"下列具有极性的细胞器是","options":["高尔基体","核糖体","溶酶体","过氧化物酶体","内质网"],"answer":"A","note":{"kind":"term","title":"细胞器","text":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"}},{"chapter":"内膜系统","type":"single","stem":"不发生在高尔基复合体的活动是","options":["蛋白质的转运","蛋白质的糖基化修饰","蛋白质的分选","糖原的合成","蛋白质的水解加工"],"answer":"E","note":{"kind":"sec","title":"简答·简要归纳分泌蛋白的合成、加工","text":"内质网——高尔基体——囊泡——细胞膜——细胞外。分为6个阶段：（1）核糖体阶段，包括分泌型蛋白质的合成和蛋白质跨膜转运；内质网运输阶段，包括分泌蛋白腔内运输、蛋白质糖基化等粗加工和储存；细胞质基质运输阶段，分泌蛋白与小泡形成脱离糙面内质网移向高尔基复合体，与其顺面扁平囊融合；（4）高尔基复合体加工修饰阶段，分泌蛋白质在高尔基复合体的扁平囊内进行加工，然后以大"}},{"chapter":"内膜系统","type":"multi","stem":"下列蛋白质哪些是在粗面内质网上合成的","options":["分泌蛋白","溶酶体酶","跨膜蛋白","线粒体基质蛋白","糖蛋白"],"answer":"ABC","note":{"kind":"sec","title":"内膜系统","text":"内质网膜的标志酶是葡萄糖-6-磷酸酶。滑面内质网的标志酶是细胞色素P-450。粗面内质网上合成的蛋白质种类：分泌蛋白，可溶性驻留蛋白，膜蛋白。"}},{"chapter":"内膜系统","type":"multi","stem":"滑面内质网的功能有","options":["脂类的合成","膜脂的合成","糖原的合成与分解","解毒作用","胆汁的形成"],"answer":"ADE","note":{"kind":"sec","title":"内膜系统","text":"滑面内质网的功能：脂类和类固醇激素的合成；脂类代谢；糖原分解；肝细胞的解毒；肌肉收缩的调解。"}},{"chapter":"内膜系统","type":"multi","stem":"由游离核糖体合成的蛋白质是","options":["血红蛋白","跨膜蛋白","分泌蛋白","线粒体基质蛋白","驻留蛋白"],"answer":"ABCE","note":{"kind":"sec","title":"内膜系统","text":"内质网膜的标志酶是葡萄糖-6-磷酸酶。滑面内质网的标志酶是细胞色素P-450。粗面内质网上合成的蛋白质种类：分泌蛋白，可溶性驻留蛋白，膜蛋白。"}},{"chapter":"内膜系统","type":"multi","stem":"催化蛋白质糖基化形成糖蛋白的细胞器有","options":["滑面内质网","粗面内质网","核糖体","高尔基复合体","溶酶体"],"answer":"AD","note":{"kind":"term","title":"细胞器","text":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"}},{"chapter":"内膜系统","type":"multi","stem":"下列属于内膜系统的是","options":["过氧化物酶体","核膜","内质网","高尔基复合体","线粒体"],"answer":"ACD","note":{"kind":"term","title":"内膜系统","text":"指位于细胞内，在结构、功能和发生上相互关联的膜性细胞器的总称。"}},{"chapter":"内膜系统","type":"multi","stem":"关于粗面内质网，下列叙述正确的是","options":["由一层单位膜围成的扁囊状结构","在分泌细胞中较发达","化学成分主要有RNA、脂类、蛋白质","来源于滑面内质网","主要合成结构蛋白"],"answer":"ABC","note":{"kind":"sec","title":"内膜系统","text":"粗面内质网：膜表面附着核糖体；形态多为板层状排列的扁囊；多分布在分泌活动旺盛或分化较完善的细胞内，如胰腺细胞和浆细胞；可作为判断细胞分化程度和功能状态的一项重要指标。"}},{"chapter":"内膜系统","type":"multi","stem":"根据信号肽假说，核糖体附着于内质网需要的成分包括","options":["分子伴侣","信号肽","信号识别颗粒","核糖体结合蛋白","信号识别颗粒受体"],"answer":"BCDE","note":{"kind":"term","title":"信号肽","text":"有信号密码翻译出的一段约18—30个疏水氨基酸组成的肽链。"}},{"chapter":"内膜系统","type":"multi","stem":"溶酶体膜的特点","options":["相对稳定，只允许小分子物质通过","有质子泵能，维持内部的酸性环境","膜转运蛋白将消化分解的产物运出","膜蛋白高度糖基化","易破裂"],"answer":"ABCD","note":{"kind":"sec","title":"简答·溶酶体的特性、类型和形成过程","text":"特性：含多种酸性水解酶；腔内为酸性环境；膜高度稳定；膜转运蛋白丰富。类型：传统分类：初级溶酶体，次级溶酶体。根据吞噬物分类：内体性溶酶体，吞噬溶酶体根据溶酶体底物来源分类：自噬溶酶体、异噬溶酶体、残余体形成过程1）酶蛋白前体合成、初加工和转运（RER）2）进行标记、分选和转运（高尔基体）3）内体性溶酶体的形成4）溶酶体成熟"}},{"chapter":"内膜系统","type":"multi","stem":"常见的残余小体有","options":["脂褐质","含铁小体","多泡体","微粒体","髓样结构"],"answer":"ABCE","note":{"kind":"term","title":"残余小体","text":"吞噬性溶酶体到达消化分解的末期阶段时，由于水解酶的活性降低，还残留一些未被消化分解的物质，被保留在溶酶体内，形成在电镜下呈现电子密度较高的，色泽较深的残余物，这种溶酶体称为残余小体"}},{"chapter":"内膜系统","type":"multi","stem":"关于过氧化物酶体，下列叙述正确的有","options":["标志酶是过氧化氢酶","是由一层单位膜围成的球形或卵圆形小体","普遍存在于动、植物细胞中","也称为微体","其内含酸性水解酶"],"answer":"ACD","note":{"kind":"sec","title":"内膜系统","text":"过氧化物酶体的标志酶是过氧化氢酶。"}},{"chapter":"内膜系统","type":"multi","stem":"溶酶体内主要含有的酶类","options":["葡萄糖-6-磷酸酶","糖苷酶","胶原酶","蛋白酶","脂肪酶"],"answer":"BDE","note":{"kind":"manual","title":"解析","text":"溶酶体内主要是酸性水解酶：糖苷酶、蛋白酶、脂肪酶、核酸酶等；葡萄糖-6-磷酸酶是内质网标志酶，胶原酶不是溶酶体的主要酶。"}},{"chapter":"线粒体","type":"multi","stem":"溶酶体的功能有","options":["器官的发生","细胞的分泌","激素分泌的调节","受精作用","细胞的防御"],"answer":"ACDE","note":{"kind":"manual","title":"解析","text":"溶酶体参与消化防御、器官退化发生、受精（顶体反应）以及激素分泌的调节；溶酶体本身不承担细胞分泌功能。"}},{"chapter":"线粒体","type":"single","stem":"人类线粒体内核糖体的沉降系数是","options":["5S","25S","55S","70S","80S"],"answer":"C","note":{"kind":"manual","title":"解析","text":"人类线粒体核糖体为 55S（由 39S 大亚基和 28S 小亚基组成），70S 是细菌核糖体、80S 是真核胞质核糖体。"},"fixed":true,"orig":"C"},{"chapter":"线粒体","type":"single","stem":"线粒体的嵴来源于","options":["外膜","膜间腔","内膜","基质颗粒衍生","内膜外膜共同形成"],"answer":"C","note":{"kind":"manual","title":"解析","text":"线粒体嵴是内膜向基质内折叠形成的突起，扩大了内膜面积，其上分布着呼吸链和 ATP 合酶。"}},{"chapter":"线粒体","type":"single","stem":"关于存在于代谢旺盛的细胞内的线粒体，下列叙述正确的是","options":["数量增多，嵴数减少","数量减少，嵴数增多","数量和嵴数均减少","数量和嵴数均增多","数量和嵴数均不变"],"answer":"D","note":{"kind":"manual","title":"解析","text":"代谢越旺盛的细胞，线粒体数目越多、嵴也越发达（数目增多、嵴数增多），以提供更多 ATP。"}},{"chapter":"线粒体","type":"single","stem":"细胞中进行生物氧化和能量转换的主要场所是","options":["核糖体","粗面内质网","线粒体","过氧化物酶体","高尔基复合体"],"answer":"D","note":{"kind":"sec","title":"内膜系统","text":"过氧化物酶体的标志酶是过氧化氢酶。"}},{"chapter":"线粒体","type":"single","stem":"动物细胞中含有DNA并能产生ATP的细胞器是","options":["中心体","溶酶体","核糖体","线粒体","过氧化物酶体"],"answer":"E","note":{"kind":"term","title":"细胞器","text":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"}},{"chapter":"线粒体","type":"single","stem":"关于线粒体的结构，哪一种说法不正确","options":["是有单层膜包裹而成的细胞器","是有双层单位膜封闭的细胞器","线粒体嵴上有许多基粒","是含DNA的细胞器","内部分为两个膜空间"],"answer":"A","note":{"kind":"term","title":"细胞器","text":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"}},{"chapter":"线粒体","type":"single","stem":"线粒体的主要功能是","options":["蛋白质合成","为细胞提供营养和保护","给细胞提供能量","物质储存与加工","解毒"],"answer":"C","note":{"kind":"manual","title":"解析","text":"线粒体是细胞的「动力工厂」，通过三羧酸循环和氧化磷酸化把营养物质中的能量转成 ATP。"}},{"chapter":"线粒体","type":"single","stem":"线粒体膜间腔的标志酶是","options":["腺苷酸环化酶","二磷酸核苷激酶","腺苷酸激酶","亚硫酸氧化酶","琥珀酸脱氢酶"],"answer":"C","note":{"kind":"sec","title":"线粒体","text":"线粒体中酶的分布：外膜的标志酶是单胺氧化酶，内膜是琥珀酸脱氢酶，膜间隙是腺苷酸激酶，基质是苹果酸脱氢酶。"}},{"chapter":"线粒体","type":"single","stem":"线粒体内膜的标志酶是","options":["NADH-辅酶Q还原酶","细胞色素氧化酶","腺苷酸激酶","单胺氧化酶","琥珀酸脱氢酶"],"answer":"E","note":{"kind":"sec","title":"线粒体","text":"线粒体中酶的分布：外膜的标志酶是单胺氧化酶，内膜是琥珀酸脱氢酶，膜间隙是腺苷酸激酶，基质是苹果酸脱氢酶。"}},{"chapter":"线粒体","type":"single","stem":"线粒体基质中的标志酶是","options":["苹果酸脱氢酶","柠檬酸合成酶","乌头酸酶","延胡索酸酶","琥珀酸脱氢酶"],"answer":"A","note":{"kind":"sec","title":"线粒体","text":"线粒体中酶的分布：外膜的标志酶是单胺氧化酶，内膜是琥珀酸脱氢酶，膜间隙是腺苷酸激酶，基质是苹果酸脱氢酶。"}},{"chapter":"线粒体","type":"single","stem":"线粒体外膜不含有的特点是","options":["外膜含有多套运输蛋白质","由暗、明、暗一层单位膜组成","脂类与蛋白质的组成与内膜也显然不同","通常没有内陷与突起","分子量在10000以上的物质均能通透"],"answer":"E","note":{"kind":"manual","title":"解析","text":"外膜上有孔道蛋白，分子量小于约 5000 的物质可自由通过，「10000 以上均能通透」不成立，故它不是外膜的特点。"}},{"chapter":"线粒体","type":"single","stem":"线粒体DNA合成的蛋白质","options":["有的运输到细胞质","均可由核基因合成代替","全部都定位在线粒体上","数量和种类众多","为线粒体所需的大部分"],"answer":"C","note":{"kind":"sec","title":"简答·衰老细胞的变化1）核酸的改变","text":"从总体上DNA复制与转录在细胞衰老时均受抑制，但也有个别基因会异常激活，端粒DNA丢失，线粒体DNA特异性缺失，DNA氧化、断裂、缺失和交联，甲基化程度降低。RNA：mRNA和tRNA含量降低。2）蛋白质的改变：合成下降，蛋白质稳定性、抗原性，可消化性下降，酶失活。3）糖类及脂类的改变：糖减少，不饱和脂肪酸被氧化"}},{"chapter":"线粒体","type":"single","stem":"细胞有氧呼吸并进行氧化磷酸化的场所是","options":["线粒体膜间腔","线粒体内膜","线粒体基质","基粒","线粒体外膜"],"answer":"B","note":{"kind":"sec","title":"简答·以葡萄糖为例说明细胞氧化的过","text":"糖酵解（细胞质）乙酰辅酶A（线粒体基质）三磷酸循环（线粒体基质）电子传递和氧化磷酸化（线粒体内膜）"}},{"chapter":"线粒体","type":"single","stem":"有关线粒体内膜说法错误的是","options":["膜厚度约7-8nm","嵴内的空隙称为嵴内腔","哺乳动物细胞线粒体的嵴大多呈板层状","需要能量多的细胞，不仅线粒体数目多，线粒体的嵴也较多。","产生向内的板层状突起"],"answer":"A","note":{"kind":"manual","title":"解析","text":"线粒体内膜厚约 6nm（单位膜一般 7～8nm），故「膜厚度约 7-8nm」这一说法不对；其余各项均符合内膜特征。"}},{"chapter":"线粒体","type":"single","stem":"糖的有氧氧化过程中丙酮酸代谢产生CO2和H2O发生在","options":["核糖体","内质网","溶酶体","细胞质基质","线粒体"],"answer":"E","note":{"kind":"manual","title":"解析","text":"丙酮酸进入线粒体基质，经三羧酸循环和电子传递链彻底氧化，生成 CO₂ 和 H₂O 并释放能量。"}},{"chapter":"线粒体","type":"single","stem":"关于三羧酸循环，叙述正确的是","options":["脱羧产生CO2，释放出电子","脱羧产生CO2和氢原子","释放出氢原子和电子","脱羧放出ATP","脱羧产生CO2，释放出ADP"],"answer":"B","note":{"kind":"manual","title":"解析","text":"三羧酸循环中每次脱羧放出 CO₂，同时脱氢（放出氢原子，由 NAD⁺、FAD 接受），不直接产生 ATP。"}},{"chapter":"线粒体","type":"single","stem":"葡萄糖分解产生ATP的过程是","options":["糖酵解→丙酮酸脱氢→三羧酸循环→电子传递和氧化磷酸化","糖酵解→电子传递和氧化磷酸化→丙酮酸脱氢→三羧酸循环","丙酮酸脱氢→三羧酸循环→糖酵解→电子传递和氧化磷酸化","丙酮酸脱氢→三羧酸循环→电子传递和氧化磷酸化→糖酵解","以上叙述都不正确"],"answer":"A","note":{"kind":"sec","title":"线粒体","text":"细胞氧化：依靠依靠酶的催化，将细胞内各种供能物质氧化而放出能量的过程叫做细胞氧化或细胞呼吸。细胞氧化的过程：糖酵解，乙酰辅酶A的形成，三羧酸循环，电子传递偶联氧化磷酸化。"}},{"chapter":"线粒体","type":"single","stem":"1分子葡萄糖彻底氧化后可产生的能量有","options":["32个ATP","38个ATP","40个ATP","42个ATP","16个ATP"],"answer":"B","note":{"kind":"manual","title":"解析","text":"按经典教材计算，1 分子葡萄糖彻底氧化净生成 38 个 ATP（现代教材按 30～32 计）。"}},{"chapter":"线粒体","type":"single","stem":"属于呼吸链成分的是","options":["DNA","RNA","FMN","RER","SER"],"answer":"C","note":{"kind":"term","title":"呼吸链","text":"按一定顺序组成排列在线粒体内膜上的递氢和递电子酶体系。称为电子传递链。由于该体系最终是以氧作为电子受体，与细胞摄取氧有关，因此又称为呼吸链（respiratorychain)。"}},{"chapter":"线粒体","type":"single","stem":"线粒体中的基粒又称为","options":["微粒体","糖原颗粒","中心粒","ATP合酶","以上都不是"],"answer":"D","note":{"kind":"manual","title":"解析","text":"线粒体内膜上的基粒（F₁ 颗粒）就是 ATP 合酶，是氧化磷酸化生成 ATP 的部位。"}},{"chapter":"线粒体","type":"single","stem":"线粒体的寿命为1周，它通过何种方式而增殖","options":["分裂","减数分裂","核分裂","由内质网而来","重新合成"],"answer":"A","note":{"kind":"manual","title":"解析","text":"线粒体寿命约一周，靠自身分裂（二分裂）增殖，不进行减数分裂或有丝分裂。"}},{"chapter":"线粒体","type":"single","stem":"下列细胞中不含线粒体的是","options":["上皮细胞","心肌细胞","成熟红细胞","脂肪细胞","成纤维细胞"],"answer":"C","note":{"kind":"manual","title":"解析","text":"成熟红细胞在发育中排出细胞核和细胞器，没有线粒体，只靠糖酵解供能。"}},{"chapter":"线粒体","type":"single","stem":"有关氧化磷酸化的各种学说中，被普遍接受的是","options":["化学耦联假说","化学渗透假说","构象耦联假说","构象渗透假说","Keilin’s假说"],"answer":"B","note":{"kind":"manual","title":"解析","text":"化学渗透假说（Mitchell 提出）认为电子传递把 H⁺ 泵出内膜形成质子梯度，H⁺ 回流驱动 ATP 合酶，是当今普遍接受的机制。"}},{"chapter":"线粒体","type":"single","stem":"下列哪个说法描述线粒体DNA较为确切","options":["线状DNA","环状DNA","与核DNA密码略有不同线状DNA","与核DNA密码略有不同的环状DNA","包括线粒体全部蛋白质遗传信息的DNA"],"answer":"D","note":{"kind":"manual","title":"解析","text":"线粒体 DNA 是环状双链，遗传密码与核 DNA 略有不同（如 UGA 编码色氨酸），且只编码部分线粒体蛋白。"}},{"chapter":"线粒体","type":"single","stem":"线粒体蛋白质的合成场所是","options":["线粒体外膜上的筒状结构","基粒","mtDNA","基质","线粒体核糖体"],"answer":"B","note":{"kind":"manual","title":"解析","text":"线粒体蛋白质中的一部分由线粒体自身核糖体在基质中合成，多数由核基因编码、胞质核糖体合成后运入。"}},{"chapter":"线粒体","type":"single","stem":"线粒体具有选择性通透性的结构是","options":["线粒体外膜上的筒状结构","基粒","内腔","基质","内膜"],"answer":"E","note":{"kind":"manual","title":"解析","text":"线粒体内膜通透性低、有选择性转运蛋白，是决定物质能否进入基质的选择性屏障；外膜通透性高。"},"fixed":true,"orig":"E"},{"chapter":"线粒体","type":"multi","stem":"属于线粒体特征的有","options":["光镜下成线状、粒状或杆状","细胞内供能中心","具双层膜结构","分解各种物质的场所","合成蛋白质的主要场所"],"answer":"ABC","note":{"kind":"manual","title":"解析","text":"线粒体在光镜下呈线状、粒状或杆状，是细胞供能中心，具双层膜结构；分解各种物质、合成蛋白质并非其主要特征。"}},{"chapter":"线粒体","type":"multi","stem":"含有DNA的细胞器是","options":["细胞核","核糖体","线粒体","高尔基复合体","内质网"],"answer":"AC","note":{"kind":"term","title":"细胞器","text":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"}},{"chapter":"线粒体","type":"multi","stem":"线粒体DNA分子的特点是","options":["线状","环状","与组蛋白结合","不与组蛋白结合","信息量较大"],"answer":"BD","note":{"kind":"term","title":"组蛋白","text":"所有真核生物的细胞核中,与DNA结合存在的碱性蛋白质的总称。"}},{"chapter":"线粒体","type":"multi","stem":"细胞的氧化磷酸化过程中在线粒体内进行的步骤包括","options":["糖酵解","乙酰辅酶A生成","三羧酸循环","电子传递偶联氧化磷酸化","β-氧化"],"answer":"BCD","note":{"kind":"sec","title":"线粒体","text":"细胞氧化：依靠依靠酶的催化，将细胞内各种供能物质氧化而放出能量的过程叫做细胞氧化或细胞呼吸。细胞氧化的过程：糖酵解，乙酰辅酶A的形成，三羧酸循环，电子传递偶联氧化磷酸化。"}},{"chapter":"线粒体","type":"multi","stem":"线粒体的自主性体现在","options":["mtDNA具有自我复制的能力","线粒体含有核糖体","在遗传上由线粒体基因组和核基因组共同控制","mtDNA与核DNA遗传密码有所不同","mtDNA在S期到G2期合成"],"answer":"ABD","note":{"kind":"sec","title":"简答·为什么说线粒体是一个半自主性","text":"1）线粒体有自身的DNA，具有遗传上的自主性。线粒体内存在着自身的DNA（mtDNA）和完整的遗传信息传递与表达系统。能合成自身的mRNA、tRNA、rRNA，并生成自身的蛋白质，具有一定的遗传性。2）线粒体的自主性是有限的，功能的实现有赖于两套遗传系统的协调作用。线粒体的DNA只含有3种蛋白质的遗传信息，占全部蛋白质的10%，其余90%的蛋白质由核DNA编"}},{"chapter":"细胞骨架","type":"multi","stem":"目前关于氧化磷酸化耦联机制的假说主要有","options":["信号肽假说","构象耦联假说","化学耦联假说","化学渗透假说","内共生假说"],"answer":"BCD","note":{"kind":"manual","title":"解析","text":"历史上关于氧化磷酸化耦联机制的假说有化学耦联、构象耦联、化学渗透三种；化学渗透最终被证实。"}},{"chapter":"细胞骨架","type":"single","stem":"能专一性抑制微丝组装的物质是","options":["细胞松弛素","鬼笔环肽","秋水仙素","Mg2+","K+"],"answer":"A","note":{"kind":"term","title":"微丝","text":"是由肌动蛋白构成的直径约为7nm的骨架纤维，又称为肌动蛋白纤维。"}},{"chapter":"细胞骨架","type":"single","stem":"成分最复杂的中间丝蛋白是","options":["波形蛋白","神经原纤维蛋白","角蛋白","核纤层蛋白","巢蛋白"],"answer":"C","note":{"kind":"term","title":"中间丝","text":"又称为中间纤维，是动物细胞中存在的由中间丝蛋白组成的直径为10nm的一类纤维。"}},{"chapter":"细胞骨架","type":"single","stem":"构成细胞骨架的主要化学成分是","options":["磷脂","核酸","糖类","蛋白质","胆固醇"],"answer":"D","note":{"kind":"term","title":"细胞骨架","text":"是细胞内蛋白质纤维网架体系的总称，包括微丝，微管和中间丝。"}},{"chapter":"细胞骨架","type":"single","stem":"维持细胞内内质网与高尔基体形态的结构是","options":["微管","微丝","中间丝","核纤层","线粒体"],"answer":"A","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"关于微管组装，下列哪种说法是错误的","options":["微管正极的组装速度快于负极","微管的体外组装分步进行","微管的极性对于微管的增长和功能实现具有重要意义","微管可随细胞的生命活动不断的组装和去组装","微管蛋白的聚合和解聚是不可逆的自体组装过程"],"answer":"E","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"下列结构由微丝组成的是","options":["微绒毛","纤毛","中心粒","鞭毛","纺锤体"],"answer":"A","note":{"kind":"term","title":"微丝","text":"是由肌动蛋白构成的直径约为7nm的骨架纤维，又称为肌动蛋白纤维。"}},{"chapter":"细胞骨架","type":"single","stem":"在电镜下，鞭毛和纤毛基体的微管组成为","options":["由9组两联微管和两个中央微管组成","由9组两联微管组成","由9组三联微管组成","由9组三联微管和两个中央微管组成","由9组单管组成"],"answer":"C","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"组成微丝的结构蛋白是","options":["原肌球蛋白","肌动蛋白","驱动蛋白","肌钙蛋白","肌球蛋白"],"answer":"C","note":{"kind":"term","title":"微丝","text":"是由肌动蛋白构成的直径约为7nm的骨架纤维，又称为肌动蛋白纤维。"}},{"chapter":"细胞骨架","type":"single","stem":"下列哪种细胞中的微管含量最为丰富","options":["肝细胞","神经细胞","肌细胞","白细胞","肾细胞"],"answer":"B","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"肌小节粗、细肌丝滑动受下列哪项因素调节","options":["一氧化氮","温度","激素","Ca2+","Mg2+"],"answer":"D","note":{"kind":"manual","title":"解析","text":"肌丝滑行由 Ca²⁺ 触发：Ca²⁺ 与肌钙蛋白结合，使原肌球蛋白移位、暴露出肌动蛋白上的结合位点。"}},{"chapter":"细胞骨架","type":"single","stem":"微管一般由多少根原纤维组成","options":["10","13","11","9","12"],"answer":"B","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"在下列微管中对秋水仙素最敏感的是","options":["纤毛微管","中心粒微管","鞭毛微管","纺锤体微管","基体微管"],"answer":"D","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"恶性细胞转化的一个重要特征是","options":["微管解聚","微丝解聚","微丝增加","微管聚合","中间丝增加"],"answer":"A","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"-微管蛋白可结合","options":["GTP","ATP","CTP","UTP","TTP"],"answer":"A","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"具有微管组织中心（MTOC）的结构是","options":["中心体","溶酶体","核糖体","内体","线粒体"],"answer":"A","note":{"kind":"term","title":"微管组织中心","text":"指微管在生理状态及药物处理使其解聚后重新组装的启动位置。"}},{"chapter":"细胞骨架","type":"single","stem":"关于中间丝，下列叙述正确的是","options":["中间丝的稳定性较差","各类中间丝蛋白的差异在于中间的杆状区","中间丝蛋白分子量的大小主要取决于尾部的不同","中间丝的组装依靠GTP","中间丝的直径接近25 nm"],"answer":"C","note":{"kind":"term","title":"中间丝","text":"又称为中间纤维，是动物细胞中存在的由中间丝蛋白组成的直径为10nm的一类纤维。"}},{"chapter":"细胞骨架","type":"single","stem":"有丝分裂时，参与染色体分离的细胞骨架是","options":["微丝","微管","中间丝","核纤层","应力纤维"],"answer":"B","note":{"kind":"term","title":"细胞骨架","text":"是细胞内蛋白质纤维网架体系的总称，包括微丝，微管和中间丝。"}},{"chapter":"细胞骨架","type":"single","stem":"参与精子运动的蛋白质是","options":["肌动蛋白","原肌球蛋白","肌球蛋白","动力蛋白","驱动蛋白"],"answer":"D","note":{"kind":"manual","title":"解析","text":"精子尾部轴丝中相邻二联管间由动力蛋白（dynein）臂产生滑动，使鞭毛摆动推动精子运动。"}},{"chapter":"细胞骨架","type":"single","stem":"抑制微管解聚的物质是","options":["秋水仙素","细胞松弛素","紫杉醇","鬼笔环肽","Ca2+"],"answer":"C","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"下列哪种细胞骨架成分具有组织特异性","options":["微管","中间丝","微丝","微丝与中间丝","微管与中间丝"],"answer":"E","note":{"kind":"term","title":"细胞骨架","text":"是细胞内蛋白质纤维网架体系的总称，包括微丝，微管和中间丝。"}},{"chapter":"细胞骨架","type":"single","stem":"下列哪项与微管的功能无关","options":["维持细胞形态","细胞运动","细胞内物质运输","信息传递","为细胞提供机械强度支撑"],"answer":"E","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"single","stem":"下列结构中能够复制的是","options":["基体","纺锤体","中心体","微绒毛","应力纤维"],"answer":"C","note":{"kind":"manual","title":"解析","text":"中心体（中心粒）能自我复制，在 S 期完成复制并参与纺锤体形成；基体、微绒毛、应力纤维不能复制。"}},{"chapter":"细胞骨架","type":"single","stem":"有关肌球蛋白的叙述，下列错误的是","options":["肌球蛋白是一种马达蛋白","肌球蛋白只能朝向微丝的正极方向运动","肌球蛋白的头部具有ATP酶活性","肌球蛋白一般由6条多肽链组成","肌球蛋白的头部具有肌动蛋白结合位点"],"answer":"B","note":{"kind":"term","title":"微丝","text":"是由肌动蛋白构成的直径约为7nm的骨架纤维，又称为肌动蛋白纤维。"}},{"chapter":"细胞骨架","type":"single","stem":"细胞完成胞吞功能时依靠下列哪种结构与质膜相连","options":["微丝","微管","中间丝","应力纤维","肌原纤维"],"answer":"C","note":{"kind":"term","title":"中间丝","text":"又称为中间纤维，是动物细胞中存在的由中间丝蛋白组成的直径为10nm的一类纤维。"}},{"chapter":"细胞骨架","type":"multi","stem":"用细胞松弛素处理间期细胞后细胞出现的变化有","options":["细胞膜流动性增强","细胞表面起泡","细胞运动能力减弱","高尔基复合体分散存在于胞浆的四周","细胞形态树枝状化"],"answer":"ACDE","note":{"kind":"sec","title":"内膜系统","text":"把细胞质中由核膜，内质网膜，高尔基复合体膜的小管、小泡、扁囊组成的系统叫做内膜系统具有流动性，镶嵌性，不对称性和蛋白质极性。"}},{"chapter":"细胞骨架","type":"multi","stem":"微管体外组装必需的条件是","options":["GTP","高Ca2+浓度","Mg2+","动力蛋白","低温"],"answer":"AC","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞骨架","type":"multi","stem":"下列属于细胞骨架成分的是","options":["微丝","中间丝","微管","溶酶体","内质网"],"answer":"ABC","note":{"kind":"term","title":"细胞骨架","text":"是细胞内蛋白质纤维网架体系的总称，包括微丝，微管和中间丝。"}},{"chapter":"细胞骨架","type":"multi","stem":"中间丝的功能包括","options":["信号传递","mRNA运输","抵抗机械压力","参与细胞分化","细胞分裂"],"answer":"ABCDE","note":{"kind":"term","title":"细胞分化","text":"在个体发育过程中，由同一受精卵产生的细胞在形态结构、生化组成和功能等方面产生稳定差异的过程。"}},{"chapter":"细胞骨架","type":"multi","stem":"下面具有极性的结构是","options":["微管蛋白异二聚体","球状肌动蛋白","中间丝","微管","纤维状肌动蛋白"],"answer":"ACD","note":{"kind":"term","title":"中间丝","text":"又称为中间纤维，是动物细胞中存在的由中间丝蛋白组成的直径为10nm的一类纤维。"}},{"chapter":"细胞骨架","type":"multi","stem":"微丝的功能包括","options":["支持作用","运动功能","细胞内的信号转导","细胞分裂","参与细胞内物质运输"],"answer":"ABCE","note":{"kind":"term","title":"微丝","text":"是由肌动蛋白构成的直径约为7nm的骨架纤维，又称为肌动蛋白纤维。"}},{"chapter":"细胞骨架","type":"single","stem":"关于鞭毛、纤毛的运动，下列叙述正确的是","options":["鞭毛的运动依赖于鞭毛基部的某种动力装置","由于纤毛中央鞘的限制使滑动变成弯曲运动","鞭毛、纤毛运动是二联管间相对滑动的结果","A管上的动力蛋白臂是运动的动力源","二联管之间的滑动可使鞭毛的轴索产生弯曲的力"],"answer":"B","note":{"kind":"manual","title":"解析","text":"纤毛、鞭毛的运动是二联管间相互滑动的结果，但受中央鞘和辐条的约束，滑动转变为弯曲摆动，故 B 正确。"}},{"chapter":"细胞核","type":"multi","stem":"在非肌细胞中，微丝与下列哪种运动相关","options":["变形运动","变皱膜运动","细胞缢缩","吞噬运动","精子运动"],"answer":"ABCDE","note":{"kind":"term","title":"微丝","text":"是由肌动蛋白构成的直径约为7nm的骨架纤维，又称为肌动蛋白纤维。"}},{"chapter":"细胞核","type":"single","stem":"在特定DNA区段上，串联排列的rRNA基因伸展所形成的DNA袢环为","options":["次缢痕","端粒","着丝粒","异染色质","核仁组织区"],"answer":"E","note":{"kind":"term","title":"核仁组织区","text":"位于13,14,15,21,22号染色体的短臂末端与随体之间的染色质细丝上，共同构成的区域，与间期细胞核仁形成有关。"}},{"chapter":"细胞核","type":"single","stem":"RNA经核孔复合体输出至细胞质的运输方式属于","options":["被动运输","主动运输","异化扩散","共同运输","简单扩散"],"answer":"B","note":{"kind":"term","title":"主动运输","text":"是指需要消耗能量把跨膜转运的物质由低浓度的一侧向高浓度一侧的运输过程。"}},{"chapter":"细胞核","type":"single","stem":"相邻核小体间的连接DNA长度一般约为","options":["20bp","40bp","60bp","100bp","200bp"],"answer":"C","note":{"kind":"manual","title":"解析","text":"相邻核小体之间由连接 DNA 相连，长度一般约 60bp，其上结合组蛋白 H1。"}},{"chapter":"细胞核","type":"single","stem":"核纤层的化学成分是","options":["核纤层蛋白","DNA","组蛋白","核糖体和RNA","微管蛋白"],"answer":"A","note":{"kind":"term","title":"核纤层","text":"在核膜内层的内表面上，结合着一层电子密度大的物质。它是由10nm左右的核纤层纤维纵横排列，交织而成的网状纤维蛋白层。与核膜上的蛋白质相结合。核纤层由三种核纤层蛋白A,B,C组成。"}},{"chapter":"细胞核","type":"single","stem":"真核细胞中核膜最主要的作用是","options":["控制细胞核-细胞质之间的物质交流","与粗面内质网相连通","控制RNA的进出","附着核糖体","区域化作用，即把遗传物质集中在细胞内特定区域"],"answer":"E","note":{"kind":"manual","title":"解析","text":"核膜最主要的作用是区域化：把遗传物质集中在核内，使转录与翻译在时空上分开。"}},{"chapter":"细胞核","type":"single","stem":"核纤层蛋白属于","options":["微管蛋白","中间丝蛋白","微丝结合蛋白","组蛋白","非组蛋白"],"answer":"B","note":{"kind":"term","title":"中间丝","text":"又称为中间纤维，是动物细胞中存在的由中间丝蛋白组成的直径为10nm的一类纤维。"}},{"chapter":"细胞核","type":"single","stem":"费城染色体见于","options":["视网膜母细胞瘤","神经母细胞瘤","肾母细胞瘤","慢性粒细胞性白血病","淋巴瘤"],"answer":"D","note":{"kind":"manual","title":"解析","text":"费城染色体是 t(9;22) 易位形成的异常小染色体，见于慢性粒细胞白血病（形成 BCR-ABL 融合基因）。"}},{"chapter":"细胞核","type":"single","stem":"mRNA前体称为","options":["snRNA","hnRNA","mRNA","shRNA","rRNA"],"answer":"B","note":{"kind":"manual","title":"解析","text":"mRNA 的前体是 hnRNA（核内不均一 RNA），经加帽、加尾、剪接后成熟为 mRNA。"}},{"chapter":"细胞核","type":"single","stem":"真核细胞内最大的细胞器是","options":["线粒体","高尔基复合体","内质网","核糖体","细胞核"],"answer":"E","note":{"kind":"term","title":"细胞器","text":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"}},{"chapter":"细胞核","type":"single","stem":"核膜与下面哪种膜性结构密切相关","options":["高尔基复合体膜","线粒体膜","内质网膜","核糖体膜","溶酶体膜"],"answer":"C","note":{"kind":"manual","title":"解析","text":"核膜外膜与内质网膜相连续，两者在结构和功能上密切相通。"}},{"chapter":"细胞核","type":"single","stem":"关于中期染色体，下列描述正确的是","options":["每条包括两条染色单体","与染色质的化学成分有严格的区别","每条染色体都有次缢痕和随体","不是每个染色体都有着丝粒","与纺锤体的纺锤丝在端粒处相连"],"answer":"A","note":{"kind":"sec","title":"简答·简述减数分裂的过程。","text":"减数分裂Ⅰ前期Ⅰ:细线期（光镜下分辨不出两条染色单体）偶线期（同源染色体联会）粗线期（染色体进一步浓集，DNA重组活跃）双线期（联会的同源染色体开始分离，但在交叉点上还保持联系）终变期（核膜核仁消失，纺锤体形成）中期Ⅰ:同源染色体排列在赤道板两侧后期Ⅰ:同源染色体分开，分别向两极移动末期Ⅰ:染色体变为染色质，核膜核仁出现减数分裂Ⅱ前期Ⅱ:染色质凝集成染色体，"}},{"chapter":"细胞核","type":"single","stem":"在两个核小体之间起连接作用的组蛋白是","options":["H1","H2A","H2B","H3","H4"],"answer":"A","note":{"kind":"term","title":"组蛋白","text":"所有真核生物的细胞核中,与DNA结合存在的碱性蛋白质的总称。"}},{"chapter":"细胞核","type":"single","stem":"有关真核细胞核孔，下列错误的描述是","options":["是一种环状复合结构","核孔的大小是可以调控的","基因转录旺盛的细胞核孔数目较少","核孔的边缘有蛋白颗粒","核孔中央有蛋白质颗粒"],"answer":"C","note":{"kind":"manual","title":"解析","text":"基因转录越旺盛的细胞，核孔数目越多，故「转录旺盛的细胞核孔数目较少」是错误描述。"}},{"chapter":"细胞核","type":"single","stem":"常染色质是指","options":["经常存在的染色质","染色很深的染色质","不呈异固缩的染色质","呈现异固缩的染色质","转录活性低的染色质"],"answer":"C","note":{"kind":"term","title":"常染色质","text":"常染色质直径约10nm，是均一疏松、螺旋化程度小、分散度大的染色质纤维部分，不易被碱性染料着色，折光性强，在电镜下呈浅亮区，多分布于核心的中央，少量分布于核仁内，主要含有单一序列DNA和部分重复序列的DNA，代表有活性的DNA分子部分，功能活跃，一定条件下可进行复制和转录。"}},{"chapter":"细胞核","type":"single","stem":"核基质的主要组成成分是","options":["组蛋白","非组蛋白","中等纤维蛋白","肌动蛋白","微管"],"answer":"E","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞核","type":"single","stem":"在染色质组分中DNA与组蛋白的比例是","options":["1:2","2:1","1:1","1:3","1:4"],"answer":"C","note":{"kind":"term","title":"染色质","text":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"}},{"chapter":"细胞核","type":"single","stem":"关于动粒的描述，正确的选项是","options":["与着丝粒的化学组成相同","与着丝粒为同一概念","是着丝粒两侧的染色质构成的三层盘状结构","存在于染色体末端的特化部位","与纺锤体的纺锤丝相连，参与染色体运动"],"answer":"E","note":{"kind":"manual","title":"解析","text":"动粒是着丝粒两侧由蛋白质构成的三层盘状结构，与纺锤丝相连并参与染色体向两极移动。"}},{"chapter":"细胞核","type":"single","stem":"组蛋白中具有种属、组织特异性的是","options":["H1","H2A、H2B、H3、H4","H1、H2A、H2B、H4","H2A、H2B、H4","H1、H2A、H2B、H3"],"answer":"A","note":{"kind":"term","title":"组蛋白","text":"所有真核生物的细胞核中,与DNA结合存在的碱性蛋白质的总称。"}},{"chapter":"细胞核","type":"single","stem":"有丝分裂过程中，染色体最典型、结构最清晰的时期是","options":["前期","中期","后期","末期","间期"],"answer":"B","note":{"kind":"manual","title":"解析","text":"中期染色体高度螺旋化、排列在赤道板上，形态最典型、结构最清晰，是核型分析的最佳时期。"}},{"chapter":"细胞核","type":"single","stem":"染色质的主要组成成分是","options":["糖和蛋白质","脂质和蛋白质","DNA和RNA","DNA和蛋白质","RNA和蛋白质"],"answer":"D","note":{"kind":"term","title":"染色质","text":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"}},{"chapter":"细胞核","type":"single","stem":"电镜下间期细胞核内电子密度最高的是","options":["RNA","组蛋白","DNA","异染色质","核仁"],"answer":"D","note":{"kind":"manual","title":"解析","text":"间期核内异染色质高度螺旋化、电子密度最高，在电镜下呈深染的块状分布。"},"fixed":true,"orig":"D"},{"chapter":"细胞核","type":"single","stem":"在分子组成上，染色体和染色质的区别是","options":["有无组蛋白","非组蛋白的种类不同","是否有稀有碱基","碱基数量不同","没有区别"],"answer":"E","note":{"kind":"term","title":"染色质","text":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"}},{"chapter":"细胞核","type":"single","stem":"纺锤体微管与真核细胞染色体结合的蛋白质结构部分称为","options":["端粒","动粒","中心体","着丝粒","中心粒"],"answer":"B","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞核","type":"single","stem":"巴氏小体是","options":["端粒","动粒","随体","凝集的X染色体","卫星DNA"],"answer":"D","note":{"kind":"manual","title":"解析","text":"巴氏小体是女性体细胞中一条失活、高度凝集的 X 染色体，属兼性异染色质。"}},{"chapter":"细胞核","type":"single","stem":"核仁的大小取决于","options":["核仁组织区的多少","DNA含量","细胞核大小","细胞内蛋白质的合成量","细胞处于哪一周期时相"],"answer":"D","note":{"kind":"sec","title":"简答·简要归纳分泌蛋白的合成、加工","text":"内质网——高尔基体——囊泡——细胞膜——细胞外。分为6个阶段：（1）核糖体阶段，包括分泌型蛋白质的合成和蛋白质跨膜转运；内质网运输阶段，包括分泌蛋白腔内运输、蛋白质糖基化等粗加工和储存；细胞质基质运输阶段，分泌蛋白与小泡形成脱离糙面内质网移向高尔基复合体，与其顺面扁平囊融合；（4）高尔基复合体加工修饰阶段，分泌蛋白质在高尔基复合体的扁平囊内进行加工，然后以大"}},{"chapter":"细胞核","type":"single","stem":"DNA在组蛋白八聚体外表缠绕的圈数为","options":["1","1.25","1.5","1.75","2"],"answer":"D","note":{"kind":"term","title":"组蛋白","text":"所有真核生物的细胞核中,与DNA结合存在的碱性蛋白质的总称。"}},{"chapter":"细胞核","type":"single","stem":"染色质上非组蛋白的主要功能是","options":["组装核小体","调控基因表达","协助DNA折叠","组成异染色质","组装螺旋体"],"answer":"B","note":{"kind":"term","title":"非组蛋白","text":"细胞核中组蛋白以外的酸性蛋白质，主要指与特异DNA蛋白结合的蛋白质"}},{"chapter":"细胞核","type":"multi","stem":"真核细胞的细胞核是","options":["细胞遗传物质储存场所","最大的细胞器","DNA复制场所","转录场所","蛋白质合成场所"],"answer":"ABCD","note":{"kind":"term","title":"细胞器","text":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"}},{"chapter":"细胞核","type":"multi","stem":"下列哪几项生命活动是在细胞核中进行的","options":["DNA复制","RNA转录","蛋白质合成","核糖体大小亚基组装","组蛋白合成"],"answer":"ABD","note":{"kind":"manual","title":"解析","text":"细胞核内完成 DNA 复制和核糖体大小亚基的组装（核仁）；RNA 转录也在核内，而蛋白质合成在胞质。"},"fixed":true,"orig":"ABD"},{"chapter":"细胞核","type":"multi","stem":"通过核孔复合体进入细胞核的物质有","options":["hnRNA","DNA聚合酶","RNA聚合酶","核糖体","组蛋白"],"answer":"BCE","note":{"kind":"term","title":"组蛋白","text":"所有真核生物的细胞核中,与DNA结合存在的碱性蛋白质的总称。"}},{"chapter":"细胞核","type":"multi","stem":"关于中期染色体，下列描述正确的是","options":["每条包括两条染色单体","与染色质的化学成分是一致的","每条染色体都有次缢痕和随体","每个染色体都有着丝粒","与纺锤体的纺锤丝在端粒处相连"],"answer":"AB","note":{"kind":"term","title":"染色质","text":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"}},{"chapter":"细胞核","type":"multi","stem":"核膜的特点包括","options":["双层膜","与粗面内质网相延续","分布有多个核孔","有核纤层支持","内外膜间有核周池"],"answer":"ABCDE","note":{"kind":"term","title":"核纤层","text":"在核膜内层的内表面上，结合着一层电子密度大的物质。它是由10nm左右的核纤层纤维纵横排列，交织而成的网状纤维蛋白层。与核膜上的蛋白质相结合。核纤层由三种核纤层蛋白A,B,C组成。"}},{"chapter":"细胞核","type":"multi","stem":"核骨架的功能包括","options":["为DNA复制提供空间支架","与基因表达有关","参与染色体构建","与核糖体前体的装配有关","与RNA转录、加工有关"],"answer":"ABCDE","note":{"kind":"sec","title":"细胞核","text":"核纤层的功能：核纤层维持核膜的完整与稳定，为核膜提供支架，与核膜的行为密切相关；核纤层与染色质直接结合，即核纤层为DNA与核膜在结构上的连接点。"}},{"chapter":"细胞核","type":"multi","stem":"组成染色质的物质有","options":["核纤层蛋白","组蛋白","非组蛋白","DNA","RNA"],"answer":"BCDE","note":{"kind":"term","title":"非组蛋白","text":"细胞核中组蛋白以外的酸性蛋白质，主要指与特异DNA蛋白结合的蛋白质"}},{"chapter":"细胞核","type":"multi","stem":"关于核仁的描述正确的是","options":["合成tRNA","在细胞分裂周期中无变化","装配核糖体的大、小亚基","由纤维中心，致密纤维成分和颗粒成分构成","随着细胞周期而变化"],"answer":"ACDE","note":{"kind":"term","title":"细胞周期","text":"连续分裂的细胞，由细胞分裂结束到下一次细胞分裂结束所经历的过程。"}},{"chapter":"细胞核","type":"multi","stem":"关于常染色质的描述正确的是","options":["结构松散","螺旋化程度低，着色较浅","转录不活跃","一般位于核中央","多在S期的早、中期复制"],"answer":"ABDE","note":{"kind":"term","title":"常染色质","text":"常染色质直径约10nm，是均一疏松、螺旋化程度小、分散度大的染色质纤维部分，不易被碱性染料着色，折光性强，在电镜下呈浅亮区，多分布于核心的中央，少量分布于核仁内，主要含有单一序列DNA和部分重复序列的DNA，代表有活性的DNA分子部分，功能活跃，一定条件下可进行复制和转录。"}},{"chapter":"细胞信号转导","type":"multi","stem":"关于异染色质的描述正确的是","options":["结构紧密","着色较深，螺旋化程度高","是有功能的，可活跃地进行复制和转录","位于核的边缘，部分与核仁结合","多在S期的晚期复制"],"answer":"ABDE","note":{"kind":"term","title":"异染色质","text":"是指在细胞间期及早前期时仍以凝集状态存在，染色深的块状结构。异染色质丝折叠紧密，散布在整个核内，部分与核仁结合。异染色质的DNA分子与组蛋白等紧密结合，螺旋缠绕紧密，很少转录，功能上处于静止状态，是低活性的染色质。"}},{"chapter":"细胞信号转导","type":"single","stem":"关于信号转导，下列叙述正确的是","options":["具有兴奋性的细胞，如神经细胞的兴奋传递过程。","动作电位编码的信息在突触间的传导。","外界刺激在任何感受器细胞上的传导。","任何外界信息经传递和转换，进入细胞内引起细胞反应的过程。","任何细胞经分泌或细胞运动等活动，将信号传递给其它细胞的过程。"],"answer":"D","note":{"kind":"sec","title":"细胞信号转导","text":"通过信号分子与受体的相互作用，将信号导入细胞并进行传递，引发细胞内特异生物学效应的过程，称为细胞信号转导。"}},{"chapter":"细胞信号转导","type":"single","stem":"细胞间的信号转导步骤涉及的环节不包括：","options":["信号分子必须能被靶细胞膜表面的受体（或胞内受体）特异性识别","信号由细胞外传递到细胞内","信号分子作用于胞内的第二信使，直接启动细胞应答反应","信号分子作用于胞内的信号转导分子，启动细胞应答反应","随信号分子的失活和降解或胞外刺激强度的消退，上述反应即告停止"],"answer":"C","note":{"kind":"term","title":"信号分子","text":"参与细胞信号转导的化学分子，如激素，神经递质，生长因子等。"}},{"chapter":"细胞信号转导","type":"single","stem":"在信号转导中，能引起蛋白质构象变化的两类酶是","options":["蛋白激酶和磷酸酶","酪氨酸蛋白激酶和酪氨酸酶","蛋白激酶A和蛋白激酶C","MAPK和MAPKK","磷酸化酶激酶和丝/苏氨酸蛋白激酶"],"answer":"A","note":{"kind":"manual","title":"解析","text":"蛋白激酶催化磷酸化、磷酸酶催化去磷酸化，两者通过改变磷酸化状态引起蛋白质构象变化，是信号转导的共用开关。"}},{"chapter":"细胞信号转导","type":"single","stem":"下列哪项不是受体的基本特点","options":["特异性","亲合性","饱和性","保真性","可逆性"],"answer":"D","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞信号转导","type":"single","stem":"信号转导的特征一般不包括","options":["信号转导的一过性和记忆性","信号转导的暂时性和可逆性","信号转导通路的连贯性","信号转导的特异性和遗传性","信号转导的专一性和网络化信号转导的放大效应"],"answer":"D","note":{"kind":"manual","title":"解析","text":"信号转导的典型特征是一过性与记忆性、暂时性与可逆性、通路的连贯性、专一性与网络化放大；「遗传性」不是其一般特征。"},"fixed":true,"orig":"D"},{"chapter":"细胞信号转导","type":"single","stem":"与配体结合后直接行使酶催化功能的受体是","options":["生长因子受体","离子通道受体","G蛋白耦联受体","核受体","以上都不是"],"answer":"A","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞信号转导","type":"single","stem":"以简单扩散方式从一个细胞输送到另一个细胞的信息分子为","options":["cAMP","IP3","NO","Ca2+","DAG"],"answer":"C","note":{"kind":"term","title":"简单扩散","text":"最简单的物质跨膜转运方式，即物质由浓度高的一侧向浓度低的一侧自由运动。"}},{"chapter":"细胞信号转导","type":"single","stem":"动员Ca2+释放的第二信使分子是","options":["第一信使","第二信使","IP3","DAG","间隙连接"],"answer":"C","note":{"kind":"term","title":"第二信使","text":"是第一信使与细胞表面受体结合后，在细胞内产生或释放到细胞内的小分子活性物质。主要有：cAMP、cGMP、IP3、DG、Ca2+。"}},{"chapter":"细胞信号转导","type":"single","stem":"具有GTP酶活性的蛋白是","options":["G蛋白耦联受体","G蛋白","鸟苷酸环化酶","蛋白激酶A","受体酪氨酸激酶"],"answer":"B","note":{"kind":"manual","title":"解析","text":"G 蛋白（α 亚基）具有 GTP 酶活性，结合 GTP 时活化、水解 GDP 后失活，是分子开关。"}},{"chapter":"细胞信号转导","type":"single","stem":"PKA、PKC、PKG、CaMK、MAPK催化下列哪项磷酸化","options":["Tyr残基","蛋白激酶C","GTP","蛋白激酶A","Ser/Thr残基"],"answer":"E","note":{"kind":"manual","title":"解析","text":"PKA、PKC、PKG、CaMK、MAPK 都属于丝氨酸/苏氨酸蛋白激酶，催化 Ser/Thr 残基磷酸化。"},"fixed":true,"orig":"E"},{"chapter":"细胞信号转导","type":"single","stem":"与细胞内的第二信使 cAMP、DAG、IP3 产生有关的是","options":["跨膜糖蛋白","G蛋白","酪氨酸受体蛋白","甾类激素","磷脂酶C"],"answer":"B","note":{"kind":"term","title":"第二信使","text":"是第一信使与细胞表面受体结合后，在细胞内产生或释放到细胞内的小分子活性物质。主要有：cAMP、cGMP、IP3、DG、Ca2+。"}},{"chapter":"细胞信号转导","type":"single","stem":"蛋白激酶C的激活依赖于","options":["DAG","IP3+Ca2+","NO","Ca2+","cAMP"],"answer":"A","note":{"kind":"manual","title":"解析","text":"PKC 的激活依赖 DAG：DAG 与 Ca²⁺ 共同把 PKC 招募到膜上并使其活化（IP₃ 负责释放 Ca²⁺）。"}},{"chapter":"细胞信号转导","type":"single","stem":"引发滑面内质网释放Ca2+的第二信使分子是","options":["IP3","cAMP","NO","Ca2+","DAG"],"answer":"A","note":{"kind":"term","title":"第二信使","text":"是第一信使与细胞表面受体结合后，在细胞内产生或释放到细胞内的小分子活性物质。主要有：cAMP、cGMP、IP3、DG、Ca2+。"}},{"chapter":"细胞信号转导","type":"single","stem":"以下哪种分子不属于G蛋白","options":["GTP-结合蛋白","鸟苷酸结合蛋白","Ras","G-肌动蛋白","Gi(抑制性G蛋白)"],"answer":"D","note":{"kind":"manual","title":"解析","text":"G-肌动蛋白是细胞骨架蛋白（肌动蛋白单体），虽名字带 G，但不是 GTP 结合蛋白家族的 G 蛋白。"}},{"chapter":"细胞信号转导","type":"single","stem":"关于RTK结构的描述正确的是","options":["由和两个亚单位组成的异二聚体","其胞外区氨基酸组成高度保守","为单次跨膜蛋白","为多次跨膜蛋白","具有丝/苏氨酸蛋白激酶活性"],"answer":"C","note":{"kind":"manual","title":"解析","text":"受体酪氨酸激酶（RTK）是单次跨膜蛋白，胞外区结合配体、胞内区具酪氨酸激酶活性。"}},{"chapter":"细胞信号转导","type":"single","stem":"以下哪一种分子不属于第二信使","options":["IP3","SOS","DAG","cAMP","cGMP"],"answer":"B","note":{"kind":"term","title":"第二信使","text":"是第一信使与细胞表面受体结合后，在细胞内产生或释放到细胞内的小分子活性物质。主要有：cAMP、cGMP、IP3、DG、Ca2+。"}},{"chapter":"细胞信号转导","type":"single","stem":"cAMP与PKA相互作用使","options":["PKA的催化亚单位与调节亚单位解离","PKA的催化亚单位与调节亚单位结合","PKA的调节亚单位活化","cAMP水解成AMP","下游靶分子蛋白去磷酸化"],"answer":"A","note":{"kind":"manual","title":"解析","text":"cAMP 与 PKA 的调节亚基结合，使调节亚基与催化亚基解离，游离的催化亚基被激活而磷酸化下游靶蛋白。"}},{"chapter":"细胞信号转导","type":"single","stem":"DAG的效应分子是","options":["蛋白激酶A","蛋白激酶G","磷脂酶C","蛋白激酶C","腺苷酸环化酶"],"answer":"D","note":{"kind":"manual","title":"解析","text":"DAG 留在膜上激活蛋白激酶 C（PKC），是 IP₃/DAG 双信使通路中的关键一步。"}},{"chapter":"细胞信号转导","type":"single","stem":"cAMP依赖的蛋白激酶是","options":["Tyr残基","蛋白激酶C","GTP","蛋白激酶A","Ser/Thr残基"],"answer":"D","note":{"kind":"manual","title":"解析","text":"cAMP 依赖的蛋白激酶就是蛋白激酶 A（PKA），由 cAMP 激活。"}},{"chapter":"细胞信号转导","type":"single","stem":"能够透过细胞膜与细胞内受体结合发挥作用的是","options":["跨膜糖蛋白","G蛋白","酪氨酸受体蛋白","甾类激素","磷脂酶C"],"answer":"D","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞信号转导","type":"multi","stem":"下列哪些是G蛋白的效应蛋白","options":["离子通道","一氧化氮合酶","磷脂酶A","磷脂酶C","神经递质"],"answer":"ACDE","note":{"kind":"manual","title":"解析","text":"G 蛋白的效应蛋白包括离子通道、腺苷酸环化酶、磷脂酶 C、磷脂酶 A₂、一氧化氮合酶等；神经递质是信号分子而非效应蛋白。"}},{"chapter":"细胞信号转导","type":"multi","stem":"能激活PLC，促使PIP2分解的第一信使有","options":["生长因子","血管紧张素","5-羟色胺","血小板生长因子","乙酰胆碱"],"answer":"ADE","note":{"kind":"term","title":"第一信使","text":"通过与细胞膜（或胞内）受体结合，触发细胞内下游信号序贯传递，并最终能引发细胞生物学反应的首个化学分子。"}},{"chapter":"细胞信号转导","type":"multi","stem":"细胞内与G蛋白作用密切相关的第二信使有","options":["cAMP","IP3","DAG","cGMP","NO"],"answer":"ABCD","note":{"kind":"term","title":"第二信使","text":"是第一信使与细胞表面受体结合后，在细胞内产生或释放到细胞内的小分子活性物质。主要有：cAMP、cGMP、IP3、DG、Ca2+。"}},{"chapter":"细胞信号转导","type":"multi","stem":"下列属于细胞膜受体的是","options":["生长因子受体","神经递质受体","甾体激素受体","G蛋白耦联受体","配体闸门受体"],"answer":"ABDE","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞信号转导","type":"multi","stem":"下列选项中不属于酪氨酸蛋白激酶受体配体的是","options":["胰岛素","肾上腺素","乙酰胆碱","血小板生长因子","阿片肽"],"answer":"DE","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞信号转导","type":"multi","stem":"PKC激活后可引发的细胞反应有","options":["糖原分解","脂肪合成","胰岛素分泌","多巴胺释放","组胺释放"],"answer":"ABDE","note":{"kind":"manual","title":"解析","text":"PKC 激活后可促进糖原分解、脂肪合成，并参与胰岛素分泌、多巴胺和组胺释放等多种细胞反应。"}},{"chapter":"细胞信号转导","type":"multi","stem":"以下属于第二信使的是","options":["cAMP","cGMP","DAG","PIP2","IP3"],"answer":"ABCE","note":{"kind":"term","title":"第二信使","text":"是第一信使与细胞表面受体结合后，在细胞内产生或释放到细胞内的小分子活性物质。主要有：cAMP、cGMP、IP3、DG、Ca2+。"}},{"chapter":"细胞信号转导","type":"multi","stem":"关于G蛋白耦联受体的结构，叙述正确的是","options":["必须与G蛋白结合才能产生信号传导效应","通常含7段疏水性跨膜序列","主要是结合生长因子的受体","N端位于胞内，而C端暴露在胞外","具有酪氨酸激酶活性"],"answer":"ACDE","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞信号转导","type":"multi","stem":"下列哪些物质可以作为配体","options":["肾上腺素","乙酰胆碱","光子","NO","DAG"],"answer":"ABCD","note":{"kind":"term","title":"配体","text":"能与受体特异性识别并结合的分子称为配体。"}},{"chapter":"细胞信号转导","type":"multi","stem":"关于G蛋白描述正确的是","options":["与GTP或GDP结合","具有蛋白激酶活性","G蛋白的种类由其亚单位决定","有、、三个亚基组成","通常含有7段疏水性跨膜序列"],"answer":"ACD","note":{"kind":"manual","title":"解析","text":"G 蛋白由 α、β、γ 三个亚基组成，能与 GTP/GDP 结合，其种类主要由 α 亚基决定；七次跨膜是 G 蛋白耦联受体的特征，不是 G 蛋白本身。"},"fixed":true,"orig":"ACD"},{"chapter":"细胞信号转导","type":"multi","stem":"G蛋白家族的共同特征有","options":["有α、β、γ三个亚基组成","通常含7段疏水性跨膜序列","具有结合GTP(GDP)的能力","具有GTP酶活性","通过构象改变能激活效应蛋白"],"answer":"ACDE","note":{"kind":"manual","title":"解析","text":"G 蛋白家族的共同特征是三聚体结构、结合 GTP/GDP、具 GTP 酶活性、通过构象改变激活效应蛋白；七次跨膜序列属受体。"},"fixed":true,"orig":"ACDE"},{"chapter":"细胞信号转导","type":"multi","stem":"信号转导蛋白通常具有活性和非活性两种形式，控制信号转导蛋白活性方式有","options":["通过配体调节","通过G蛋白调节","通过受体调节","通过衔接蛋白调节","通过可逆磷酸化调节"],"answer":"ABCE","note":{"kind":"term","title":"受体","text":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"}},{"chapter":"细胞增殖与细胞周期","type":"multi","stem":"下列关于钙调蛋白（CaM）的说法正确的是","options":["在Ca2+信号系统中起重要作用","必须与Ca2+结合才能发挥作用","由cAMP激活","与Ca2+结合后构型发生改变","激酶是它的靶酶之一"],"answer":"ABDE","note":{"kind":"manual","title":"解析","text":"CaM 是 Ca²⁺ 受体蛋白，与 Ca²⁺ 结合后构象改变而活化，可激活 CaM 依赖性蛋白激酶等靶酶；它不由 cAMP 激活。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"减数分裂I中发生分离的是","options":["姐妹染色单体","非姐妹染色单体","同源染色体","非等位基因","非同源染色体"],"answer":"C","note":{"kind":"term","title":"同源染色体","text":"形态、大小及结构相同，但在DNA序列上并不一致的一对染色体，它们一条来自父方，一条来自母方。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"下列哪一项不是减数分裂的特征","options":["是生殖细胞的一种特殊分裂方式","DNA复制只发生在前减数分裂间期","DNA复制一次，细胞分裂二次","减数分裂期可合成少量DNA","减数分裂为一种特殊的有丝分裂"],"answer":"B","note":{"kind":"term","title":"减数分裂","text":"真核细胞中一种特殊的细胞分裂，出现在有性生殖生物的原始生殖细胞中。染色体只复制一次而细胞分两次。结果是成熟生殖细胞中的染色体数目比原始生殖细胞中的减少一半。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"关于G1期，下列哪种说法不正确","options":["指DNA合成前期","不同细胞停留在G1期的时间相同","cAMP的含量可作为G1期的控制点","G1期细胞可发育为终末细胞","主要进行RNA及蛋白质的合成"],"answer":"B","note":{"kind":"manual","title":"解析","text":"不同细胞停留在 G1 期的时间差别很大（有的数小时、有的数年甚至终生停滞），故 B 错。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"人体肝实质细胞属于","options":["分裂细胞","暂不增殖细胞","G1期细胞","终末分化细胞","干细胞"],"answer":"B","note":{"kind":"manual","title":"解析","text":"肝实质细胞平时停滞在 G0 期，受损伤刺激后能重新进入细胞周期分裂，属暂不增殖细胞。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"下列哪一项不是有丝分裂前期的变化","options":["形成纺锤体","每条染色体由两条染色单体组成","核膜消失","染色质凝集成为染色体且达到凝集极限","核仁消失"],"answer":"D","note":{"kind":"term","title":"染色质","text":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"有丝分裂的哪个时期染色体最为粗大、清晰","options":["前期","中期","后期","末期","间期"],"answer":"B","note":{"kind":"manual","title":"解析","text":"中期染色体高度螺旋化并排列在赤道板上，形态最粗大清晰，是观察染色体的最佳时期。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"哺乳动物细胞周期各时期中，哪一时相所占时间最长","options":["DNA合成前期","DNA合成期","DNA合成后期","有丝分裂前期","有丝分裂中期"],"answer":"A","note":{"kind":"term","title":"细胞周期","text":"连续分裂的细胞，由细胞分裂结束到下一次细胞分裂结束所经历的过程。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"有丝分裂过程中将染色质平均分配到子细胞中是通过下列哪项的重排的结果","options":["微管","微丝","核纤层","中间丝","核仁"],"answer":"A","note":{"kind":"term","title":"染色质","text":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"有丝分裂器的作用是","options":["染色体支架","保证细胞质均分","DNA复制的支架","代替解体的细胞核","保证染色体均分"],"answer":"E","note":{"kind":"manual","title":"解析","text":"有丝分裂器（纺锤体+星体+动粒微管）的作用是把复制后的染色体精确均分到两个子细胞。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"有丝分裂过程中，姐妹染色单体着丝粒的分开发生在","options":["前期","中期","后期","末期","间期"],"answer":"C","note":{"kind":"manual","title":"解析","text":"姐妹染色单体的着丝粒在后期分开，分别被纺锤丝拉向两极。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"如果将一个S期的细胞与一个G1期的细胞进行融合，那么","options":["G1期细胞核将进入S期","S期细胞核将进入G1期","两个核均进入G2期","两个核均被抑制","两个核均进入M期"],"answer":"A","note":{"kind":"manual","title":"解析","text":"S 期细胞含促进 DNA 复制的因子，与 G1 期细胞融合后可诱导 G1 核提前进入 S 期复制（细胞融合实验证明 S 期有起始因子）。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"微管蛋白的合成高峰在","options":["G1期","S期","G2期","M期","G0期"],"answer":"C","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"有丝分裂的后期，拉动染色体朝细胞两极移动的是","options":["星体微管","极间微管","动粒微管","稳定微管","中心体微管"],"answer":"C","note":{"kind":"term","title":"微管","text":"是位于细胞质内由微管蛋白组成的中空的管状结构。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"中心粒复制的完成发生在","options":["G1期","S期","G2期","M期","G0期"],"answer":"B","note":{"kind":"manual","title":"解析","text":"中心粒的复制始于 G1 期，在 S 期完成，G2 期继续成熟，M 期分离到两极。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"高等真核生物细胞分裂的主要方式是","options":["裂殖","有丝分裂","减数分裂","无丝分裂","出芽"],"answer":"B","note":{"kind":"manual","title":"解析","text":"高等真核生物体细胞增殖的主要方式是有丝分裂，减数分裂只发生在生殖细胞形成过程中。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"在G1期细胞发生的变化是","options":["DNA含量变化","染色质浓缩","RNA含量变化","中心体合成","核膨胀"],"answer":"C","note":{"kind":"manual","title":"解析","text":"G1 期主要合成 RNA 和蛋白质（为 S 期做准备），DNA 含量不变，中心体在 S 期复制。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"细胞周期中，决定一个细胞是否继续增殖的检验点位于","options":["S期末","G2期末","G1期末","M期末","G0期"],"answer":"C","note":{"kind":"term","title":"细胞周期","text":"连续分裂的细胞，由细胞分裂结束到下一次细胞分裂结束所经历的过程。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"细胞周期中时间变化最大的时期是","options":["G1期","S期","G2期","M期","后期"],"answer":"A","note":{"kind":"term","title":"细胞周期","text":"连续分裂的细胞，由细胞分裂结束到下一次细胞分裂结束所经历的过程。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"在细胞增殖周期中，一般情况下持续时间最短的是","options":["G1期","S期","G2期","M期","G0期"],"answer":"D","note":{"kind":"term","title":"细胞增殖","text":"细胞通过生长和分裂而产生子代细胞，增加细胞数目，并使子细胞获得与母细胞相同或几乎完全相同的遗传特性的过程。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"有丝分裂最主要的特点是","options":["DNA复制","染色体DNA均分","细胞质均分","有丝分裂器的形成","赤道板的形成"],"answer":"D","note":{"kind":"manual","title":"解析","text":"有丝分裂区别于无丝分裂、减数分裂的最主要特点是有丝分裂器（纺锤体）的形成并牵引染色体均分。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"关于无丝分裂正确的描述","options":["迅速且能量消耗低","仅见于细菌等低等生物","常见于肿瘤细胞","具有染色体结构变化","核仁、核膜都消失"],"answer":"A","note":{"kind":"manual","title":"解析","text":"无丝分裂是核直接缢裂、过程迅速且能量消耗低，但有染色体复制；它并非仅见于细菌，也见于某些动植物细胞。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"下列哪种因素可决定细胞分裂极的形成","options":["纺锤丝形成方向","染色体移动方向","星体微管方向","细胞形态","中心粒分离方向"],"answer":"E","note":{"kind":"manual","title":"解析","text":"分裂极由中心粒分离的方向决定，中心粒移向细胞两极的位置决定了纺锤体的轴向。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"在有丝分裂中，高等植物细胞与动物细胞的区别在于","options":["无中心粒","无纺锤丝","无染色体组装","无核膜解体","无染色体聚集分组"],"answer":"A","note":{"kind":"manual","title":"解析","text":"高等植物细胞没有中心粒，纺锤体由细胞质中的微管自行组装（无星纺锤体），这是与动物细胞的主要区别。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"减数分裂过程中，同源染色体的片段交换和重组发生在","options":["细线期","偶线期","粗线期","双线期","终变期"],"answer":"C","note":{"kind":"term","title":"同源染色体","text":"形态、大小及结构相同，但在DNA序列上并不一致的一对染色体，它们一条来自父方，一条来自母方。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"人体的红细胞属于","options":["周期性细胞","暂不增殖细胞","G1期细胞","终末分化细胞","干细胞"],"answer":"D","note":{"kind":"manual","title":"解析","text":"成熟红细胞已丧失分裂能力，属终末分化细胞。"}},{"chapter":"细胞增殖与细胞周期","type":"single","stem":"生殖细胞减数分裂过程中，细胞内同源染色体分离。向两极移动发生在","options":["减数分裂前期Ⅰ","减数分裂前期Ⅱ","减数分裂中期Ⅰ","减数分裂后期Ⅰ","减数分裂末期Ⅰ"],"answer":"D","note":{"kind":"term","title":"同源染色体","text":"形态、大小及结构相同，但在DNA序列上并不一致的一对染色体，它们一条来自父方，一条来自母方。"}},{"chapter":"细胞增殖与细胞周期","type":"multi","stem":"细胞在有丝分裂间期进行的重要生化活动是","options":["染色质的凝集","细胞质内的物质合成","核内DNA的复制","核纤层蛋白质的去磷酸化","触发蛋白浓度的降低"],"answer":"ABC","note":{"kind":"term","title":"细胞质","text":"细胞的组成部分之一，包括无色透明的胶状物质和各种细胞器，在细胞核和细胞膜之间。"}},{"chapter":"细胞增殖与细胞周期","type":"multi","stem":"在G2期细胞合成的是","options":["一定的蛋白质","RNA","可溶性的蛋白激酶","染色体凝集因子","构成纺锤丝的微管蛋白"],"answer":"ABC","note":{"kind":"manual","title":"解析","text":"G2 期继续合成 RNA 和一定量的蛋白质（如可溶性蛋白激酶、染色体凝集因子），为 M 期做准备；微管蛋白主要在 S 期合成。"}},{"chapter":"细胞增殖与细胞周期","type":"multi","stem":"每次细胞周期都必须完成的事件有","options":["准确的复制DNA","合成细胞结构和功能性物质","建立有关细胞分裂的结构","建立有关细胞信息传递机制","胞核和胞质的分离"],"answer":"ABCD","note":{"kind":"term","title":"细胞周期","text":"连续分裂的细胞，由细胞分裂结束到下一次细胞分裂结束所经历的过程。"}},{"chapter":"细胞增殖与细胞周期","type":"multi","stem":"无丝分裂是低等生物细胞增殖的主要方式，在人体组织中只发生在","options":["卵裂期","某些迅速分裂的组织","创伤修复","病理性代偿","囊胚形成期"],"answer":"BCD","note":{"kind":"term","title":"细胞增殖","text":"细胞通过生长和分裂而产生子代细胞，增加细胞数目，并使子细胞获得与母细胞相同或几乎完全相同的遗传特性的过程。"}},{"chapter":"细胞增殖与细胞周期","type":"multi","stem":"以下哪些属于无丝分裂的特征","options":["直接分裂","间接分裂","没有染色体组装","没有纺锤体形成","高等生物主要的分裂方式"],"answer":"ACD","note":{"kind":"manual","title":"解析","text":"无丝分裂是直接分裂，没有染色体组装和纺锤体形成，不是高等生物的主要分裂方式。"}},{"chapter":"细胞增殖与细胞周期","type":"multi","stem":"G1期的主要特征是","options":["合成大量的RNA和蛋白质","正常细胞的G1期存在R点","合成 MPF","染色质开始凝集","大量合成微管蛋白"],"answer":"AB","note":{"kind":"term","title":"R点","text":"细胞周期过程中，G1期特有的检测点，是控制细胞由静止状态的G1期进入DNA合成期的关键点。"}},{"chapter":"细胞分化","type":"multi","stem":"有丝分裂前期的主要形态学变化为","options":["中心粒复制","染色质凝集成染色体","核膜破裂","核仁消失","DNA复制"],"answer":"BCD","note":{"kind":"term","title":"染色质","text":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"}},{"chapter":"细胞分化","type":"single","stem":"下列细胞中不具有分化潜能的是","options":["胚胎细胞","受精卵","骨髓干细胞","淋巴母细胞","心肌细胞"],"answer":"E","note":{"kind":"manual","title":"解析","text":"心肌细胞已终末分化，基本失去分裂和分化潜能；胚胎细胞、受精卵、干细胞、淋巴母细胞都保有分化能力。"}},{"chapter":"细胞分化","type":"single","stem":"对细胞分化进行远距离调控的物质是","options":["激素","DNA","RNA","糖分子","神经递质"],"answer":"A","note":{"kind":"term","title":"细胞分化","text":"在个体发育过程中，由同一受精卵产生的细胞在形态结构、生化组成和功能等方面产生稳定差异的过程。"}},{"chapter":"细胞分化","type":"single","stem":"红细胞合成的特异蛋白是","options":["收缩蛋白","血红蛋白","角蛋白","卵清蛋白","胶原蛋白"],"answer":"B","note":{"kind":"manual","title":"解析","text":"红细胞在分化中合成大量血红蛋白作为其特异功能蛋白，属奢侈基因表达产物。"}},{"chapter":"细胞分化","type":"single","stem":"不经诱导就可以分化的组织器官是","options":["羽毛","腺体","血液","肾","不存在的"],"answer":"E","note":{"kind":"manual","title":"解析","text":"组织器官的分化都需要诱导（胚胎诱导、激素诱导等），不存在不经诱导就能分化的组织器官。"}},{"chapter":"细胞分化","type":"single","stem":"在表达过程中不受时间限制的基因是","options":["线粒体蛋白基因","胰岛素基因","免疫球蛋白基因","血红蛋白基因","胰蛋白酶基因"],"answer":"A","note":{"kind":"manual","title":"解析","text":"管家基因在所有细胞、所有时间都表达，不受时间限制；线粒体蛋白基因属管家基因类，其余均为奢侈基因。"}},{"chapter":"细胞分化","type":"single","stem":"仅在特定细胞中表达的基因是","options":["结构基因","调控基因","奢侈基因","管家基因","组蛋白基因"],"answer":"C","note":{"kind":"manual","title":"解析","text":"奢侈基因只在特定类型细胞中表达（如血红蛋白基因只在红细胞），赋予细胞特异性功能。"}},{"chapter":"细胞分化","type":"single","stem":"关于奢侈基因，说法正确的是 编码线粒体蛋白质 只在分裂细胞中表达 决定细胞分化特征的基因 只在转录环节受到严格控制 为细胞生命必需的基因 影响细胞分化最主要的因素是","options":["染色体的选择性丢失","基因选择性丢失","基因重排","基因扩增","基因的差异表达"],"answer":"E","note":{"kind":"term","title":"细胞分化","text":"在个体发育过程中，由同一受精卵产生的细胞在形态结构、生化组成和功能等方面产生稳定差异的过程。"}},{"chapter":"细胞分化","type":"single","stem":"克隆羊“多莉”的诞生，验证了下列哪种说法","options":["已分化细胞可发生去分化","已分化细胞可发生转分化","细胞核的全能性","细胞分化的稳定性","细胞分化的可逆性"],"answer":"C","note":{"kind":"manual","title":"解析","text":"多莉羊是把体细胞核移入去核卵母细胞后发育而成，证明已分化细胞的核仍具全能性。"}},{"chapter":"细胞分化","type":"single","stem":"从一个受精卵到生物个体的形成，主要是细胞的哪种行为在起作用","options":["细胞分裂","细胞分化","细胞成熟","细胞增殖和细胞分化","细胞增殖和凋亡有序更迭"],"answer":"D","note":{"kind":"term","title":"细胞增殖","text":"细胞通过生长和分裂而产生子代细胞，增加细胞数目，并使子细胞获得与母细胞相同或几乎完全相同的遗传特性的过程。"}},{"chapter":"细胞分化","type":"single","stem":"全能性最高的细胞是","options":["早期胚胎细胞","卵母细胞","精子","受精卵","精原细胞"],"answer":"D","note":{"kind":"manual","title":"解析","text":"受精卵（合子）的全能性最高，可发育为完整个体；卵母细胞、精子和早期胚胎细胞的全能性都次于它。"}},{"chapter":"细胞分化","type":"single","stem":"下列具有分化能力的细胞是","options":["心肌细胞","红细胞","肠上皮细胞","神经干细胞","中性粒细胞"],"answer":"D","note":{"kind":"manual","title":"解析","text":"神经干细胞仍保留自我更新和多向分化能力；心肌细胞、红细胞、肠上皮细胞、中性粒细胞都已终末分化。"}},{"chapter":"细胞分化","type":"single","stem":"高度分化的植物细胞在实验室培养条件下重新进入未分化状态，成为全能性细胞，这一过程称为","options":["去分化","转分化","异常分化","体细胞重编程","核移植"],"answer":"A","note":{"kind":"sec","title":"细胞分化、衰老、凋亡与死亡","text":"有同一受精卵产生的细胞，在形态结构、生化组成和功能等方面均产生明显的差异。这种在个体发育中形成稳定性差异的过程称为细胞分化。细胞分化的特点：原则上高度稳定；但某种特殊情况下也会发生去分化或转分化；具有时空性。"}},{"chapter":"细胞分化","type":"single","stem":"细胞分化的实质是","options":["基因组的改变","基因的差异表达（或选择性表达）","原癌基因的激活","细胞亚显微结构的变化","结构蛋白质的合成"],"answer":"B","note":{"kind":"term","title":"细胞分化","text":"在个体发育过程中，由同一受精卵产生的细胞在形态结构、生化组成和功能等方面产生稳定差异的过程。"}},{"chapter":"细胞分化","type":"single","stem":"与其来源的细胞相比，细胞分化产生的子代细胞的最显著特征是","options":["数量少","形态、结构不同","生理功能不同","形态结构、生理功能均发生了稳定性变化","功能变化不大"],"answer":"D","note":{"kind":"term","title":"细胞分化","text":"在个体发育过程中，由同一受精卵产生的细胞在形态结构、生化组成和功能等方面产生稳定差异的过程。"}},{"chapter":"细胞分化","type":"single","stem":"将雌黑鼠乳腺细胞的胞核移入白鼠去核卵细胞内，待发育成早期胚胎后再移植入褐鼠的子宫内，所生小鼠的体色和性别分别是","options":["黑、雌","褐、雌","白、雌","黑、雄","白、雄"],"answer":"A","note":{"kind":"manual","title":"解析","text":"小鼠的体色和性别都由细胞核的基因组决定，核来自雌黑鼠，故子代为黑色雌鼠。"}},{"chapter":"细胞分化","type":"multi","stem":"下列蛋白质哪些为所有细胞的生命活动所必需？","options":["受体蛋白","核糖体蛋白","线粒体蛋白","分泌蛋白","组蛋白"],"answer":"ABCE","note":{"kind":"term","title":"组蛋白","text":"所有真核生物的细胞核中,与DNA结合存在的碱性蛋白质的总称。"}},{"chapter":"细胞衰老与死亡","type":"multi","stem":"以下蛋白质哪些是奢侈基因表达的产物","options":["组蛋白","卵清蛋白","核糖体蛋白","胰岛素","血红蛋白"],"answer":"BDE","note":{"kind":"manual","title":"解析","text":"卵清蛋白、胰岛素、血红蛋白分别只在输卵管细胞、胰岛 B 细胞、红细胞中表达，属奢侈基因表达产物；组蛋白、核糖体蛋白是管家基因产物。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"下列各项中，不属于细胞凋亡的是 皮肤和消化道上皮每天都会有大量细胞死亡脱落 骨折时造成的细胞死亡 蝌蚪变态发育过程中尾部消失 人的红细胞在经历120天左右的寿命后死亡 人指间隙的形成 下列哪项不属细胞衰老的特征？ 原生质减少，细胞形状改变 细胞膜磷脂含量下降，胆固醇含量上升 线粒体数目减少，核膜内折形成皱襞 脂褐素减少，细胞代谢能力下降 核明显变化为核固缩，常染色体减少 下列那一种不是程序性死亡的特征？ 核DNA在核小体连接处断裂成核小体片段 核纤层断裂消失 细胞通过发芽、起泡等方式形成一些球形的突起 细胞破裂，释放出内容物 不引起炎症 机体中寿命最长的细胞是","options":["红细胞","表皮细胞","白细胞","神经元","肝实质细胞"],"answer":"D","note":{"kind":"term","title":"细胞衰老","text":"细胞在正常的环境条件下发生的细胞生理功能减退或消失、增值能力减弱以及细胞形态变化，并趋向死亡的现象。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"寿命接近于动物的整体寿命的细胞是 神经元、脂肪细胞、肌细胞 肝实质细胞、胃壁细胞 表皮细胞、红细胞和白细胞 肾皮质细胞、骨细胞、角膜上皮细胞 淋巴细胞、肾细胞、神经细胞 衰老细胞的特征之一是常出现哪种结构的固缩？ 核仁    B. 染色质   C. 细胞膜   D. 脂褐质   E. 线粒体 细胞凋亡与细胞死亡最主要的区别是 细胞核肿胀    B. 内质网扩张    C. 细胞变形    D. 受基因调控 E. 细胞质变形 迅速判断细胞是否死亡的方法是","options":["形态学改变","功能状态检测","增殖能力测定","活性染色法","内部结构观察"],"answer":"A","note":{"kind":"term","title":"细胞死亡","text":"是细胞生命现象不可逆的停止及细胞生命的结束。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"下列不属于细胞衰老结构变化的是","options":["细胞核随着分裂次数的增加而增大","内质网呈弥散状","线粒体的数目随分裂次数的增加而减少","线粒体体积随分裂次数的增加而减小","细胞内水分减少"],"answer":"E","note":{"kind":"term","title":"细胞衰老","text":"细胞在正常的环境条件下发生的细胞生理功能减退或消失、增值能力减弱以及细胞形态变化，并趋向死亡的现象。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"与凋亡细胞形态无关的描述是","options":["细胞膜完整","出现凋亡小体","核染色体呈新月状","细胞体积减小","溶酶体破坏"],"answer":"E","note":{"kind":"manual","title":"解析","text":"凋亡过程中细胞膜保持完整、形成凋亡小体、染色质凝集呈新月状、细胞体积缩小；溶酶体破裂是坏死的特征，与凋亡形态无关。"},"fixed":true,"orig":"E"},{"chapter":"细胞衰老与死亡","type":"single","stem":"自由基可以使质膜上的     氧化","options":["饱和脂肪酸","不饱和脂肪酸","水","胆固醇","葡萄糖"],"answer":"B","note":{"kind":"manual","title":"解析","text":"自由基主要攻击质膜上的不饱和脂肪酸，引发脂质过氧化，损伤膜结构。"},"fixed":true,"orig":"B"},{"chapter":"细胞衰老与死亡","type":"single","stem":"有机体的生命活动能够正常进行是由于","options":["新细胞不断增殖","衰老细胞不断死亡","衰老细胞全部死亡","新细胞无限增殖","新老细胞不断交替"],"answer":"E","note":{"kind":"manual","title":"解析","text":"机体靠新细胞不断增殖、衰老细胞不断死亡（新旧交替）维持正常生命活动，单靠增殖或单靠死亡都不成立。"},"fixed":true,"orig":"E"},{"chapter":"细胞衰老与死亡","type":"single","stem":"凋亡细胞的分子特征是","options":["溶酶体膜破裂","DNA降解，凝胶电泳图谱呈梯状","细胞器溶解","引起炎症","细胞变大"],"answer":"B","note":{"kind":"manual","title":"解析","text":"凋亡的分子特征是 DNA 被核酸内切酶在核小体间切割成 180～200bp 片段，电泳呈梯状条带。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"由溶酶体转变而来,含有不溶性脂蛋白颗粒的细胞内小体通常称为","options":["核仁","细胞核","染色体","脂褐质","线粒体"],"answer":"D","note":{"kind":"manual","title":"解析","text":"脂褐质是溶酶体残余体堆积形成的不溶性脂蛋白颗粒，随年龄增长在细胞中累积。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"线粒体与衰老的关系主要表现在 其数量随着年龄的增大而增多 其体积随着年龄的增大而增大 mtDNA突变随年龄的增大而减少 与衰老相关的mtDNA突变主要是串联重复突变 以上说法均正确 关于细胞凋亡进程中正确的是 与凋亡相关基因表达有关 有一些细胞内容物会外溢 是细胞被动接受的过程 没有新的蛋白合成 不属于生理性死亡过程 31. 自由基是","options":["在外层轨道有不成对电子的分子或原子","正常细胞内无自由基","分子中可以自由活动的原子基团","SOD是体内唯一的抗氧化酶","自由基与其他分子发生反应时失去电子"],"answer":"C","note":{"kind":"sec","title":"简答·为什么说线粒体是一个半自主性","text":"1）线粒体有自身的DNA，具有遗传上的自主性。线粒体内存在着自身的DNA（mtDNA）和完整的遗传信息传递与表达系统。能合成自身的mRNA、tRNA、rRNA，并生成自身的蛋白质，具有一定的遗传性。2）线粒体的自主性是有限的，功能的实现有赖于两套遗传系统的协调作用。线粒体的DNA只含有3种蛋白质的遗传信息，占全部蛋白质的10%，其余90%的蛋白质由核DNA编"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"与衰老无关的是","options":["自由基","端粒","代谢废物沉积","抑癌基因","DNA随机降解"],"answer":"D","note":{"kind":"manual","title":"解析","text":"衰老的相关因素有自由基损伤、端粒缩短、代谢废物（脂褐质）沉积、DNA 随机降解等；抑癌基因主要与肿瘤发生相关。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"与凋亡无关的是","options":["核酸内切酶被激活","细胞器的肿胀、破裂","细胞膜表面的微绒毛减少","染色质凝聚，边缘化","新基因表达和蛋白合成"],"answer":"B","note":{"kind":"manual","title":"解析","text":"凋亡是受基因调控的程序性死亡，需要新基因表达和蛋白合成；细胞器肿胀破裂是坏死的表现，与凋亡无关。"},"fixed":true,"orig":"B"},{"chapter":"细胞衰老与死亡","type":"multi","stem":"细胞凋亡的特征是","options":["细胞以出芽方式形成凋亡小体","DNA降解，凝胶电泳图谱呈梯状","细胞器溶解","细胞膜流动性降低","细胞膜破碎"],"answer":"ABCD","note":{"kind":"term","title":"凋亡小体","text":"凋亡细胞经细胞核核碎裂和染色质凝缩形成染色质块，然后整个细胞通过发芽、起泡等方式形成一个球形的突起，并在其根部绞窄而脱落形成一些大小不等，内含胞质、细胞器及核碎片的小体称为凋亡小体。"}},{"chapter":"细胞衰老与死亡","type":"multi","stem":"细胞衰老时出现的变化包括","options":["细胞内水分减少","老年色素沉积","细胞核固缩","膜刚性增强","蛋白质合成速率下降"],"answer":"ABCDE","note":{"kind":"term","title":"细胞衰老","text":"细胞在正常的环境条件下发生的细胞生理功能减退或消失、增值能力减弱以及细胞形态变化，并趋向死亡的现象。"}},{"chapter":"细胞衰老与死亡","type":"single","stem":"细胞寿命按长短排列的顺序正确的是","options":["肝实质细胞、心肌细胞、红细胞","神经元、肾皮质细胞、白细胞","脂肪细胞、胃上皮细胞、皮肤表皮细胞","肌细胞、胰岛细胞、肝实质细胞","肝实质细胞、脂肪细胞、皮肤表皮细胞"],"answer":"B","note":{"kind":"manual","title":"解析","text":"按寿命由长到短：神经元、肾皮质细胞、白细胞依次递减，故 B 的顺序正确。"},"fixed":true,"orig":"B"},{"chapter":"细胞衰老与死亡","type":"multi","stem":"凋亡小体的形态学特征是","options":["具有完整的膜结构","胞膜表面微绒毛消失","胞内容物外漏","包含染色质的片段","包含结构尚完整的细胞器"],"answer":"ABDE","note":{"kind":"term","title":"凋亡小体","text":"凋亡细胞经细胞核核碎裂和染色质凝缩形成染色质块，然后整个细胞通过发芽、起泡等方式形成一个球形的突起，并在其根部绞窄而脱落形成一些大小不等，内含胞质、细胞器及核碎片的小体称为凋亡小体。"}}],"chapStats":[["内膜系统",44],["细胞膜",43],["细胞核",37],["细胞信号转导",33],["细胞增殖与细胞周期",33],["线粒体",32],["细胞骨架",32],["细胞分化",17],["细胞衰老与死亡",16],["绪论",15]]};
