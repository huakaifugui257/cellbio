<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>细胞生物学 · 复习</title>
<style>
:root{
  --fg:#14181f; --mut:#7a828e; --line:#e8eaee; --bg:#ffffff; --soft:#f5f6f8;
  --acc:#2b62e8; --ok:#15803d; --okbg:#eefaf1; --bad:#d1242f; --badbg:#fdf0f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
     padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:calc(14px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:#fff;z-index:9}
h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
h1 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:6px}
nav{display:flex;gap:6px;position:sticky;top:calc(48px + env(safe-area-inset-top));background:#fff;z-index:9;padding:2px 0 8px;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:var(--soft);color:var(--mut);padding:9px 0;border-radius:9px;font-size:14px;font-weight:500}
nav button.on{background:var(--fg);color:#fff}
main{padding-top:14px}
.hide{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.hotrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hotrow:last-child{border-bottom:0}
.rank{width:24px;flex:0 0 24px;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;padding-top:1px}
.htitle{font-weight:600;font-size:15.5px}
.hmeta{color:var(--mut);font-size:12.5px;margin-top:3px}
.hdetail{margin-top:8px;color:#333;font-size:14px;background:var(--soft);border-radius:8px;padding:9px 11px;display:none;white-space:pre-wrap}
.hotrow.open .hdetail{display:block}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;color:var(--mut);padding:8px 0;border-radius:9px;font-size:13.5px}
.seg button.on{border-color:var(--fg);color:var(--fg);font-weight:600}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;color:var(--fg)}
input[type=search]:focus{border-color:#c9d3e8;background:#fff}
details{border-bottom:1px solid var(--line);padding:2px 0}
details:last-of-type{border-bottom:0}
summary{list-style:none;cursor:pointer;padding:11px 0;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
summary:before{content:"+";color:var(--mut);font-size:15px;line-height:1.5;width:10px;flex:0 0 10px}
details[open] summary:before{content:"−"}
summary b{font-weight:600}
summary .star{color:#c8811a;font-size:12px;margin-left:2px}
.body{color:#2c323c;font-size:14px;padding:0 0 12px 18px;white-space:pre-wrap}
.body table{border-collapse:collapse;font-size:12.5px;width:100%}
.body td,.body th{border:1px solid var(--line);padding:5px 6px;vertical-align:top}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);background:#fff}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.chip small{opacity:.65;margin-left:4px;font-size:11.5px}
.btn{display:block;width:100%;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:600;background:var(--fg);color:#fff;margin-top:10px}
.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.4}
.qhead{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin:2px 0 8px}
.bar{height:3px;background:var(--soft);border-radius:2px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .2s}
.stem{font-size:16.5px;line-height:1.62;font-weight:500;margin-bottom:14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;font-size:14.5px;line-height:1.5;background:#fff}
.opt .L{color:var(--mut);font-weight:600;flex:0 0 14px}
.opt.sel{border-color:var(--acc);background:#f4f7ff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.55}
.fb{border-radius:11px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.6}
.fb.ok{background:var(--okbg);color:#116b33}
.fb.bad{background:var(--badbg);color:#a51722}
.fb .ans{font-weight:600;margin-top:2px}
.fixbadge{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:6px;font-weight:500;font-size:12px;background:rgba(0,0,0,.07);color:#4a5361;vertical-align:1px}
.note{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(0,0,0,.12);color:#3a424e;font-size:13.5px;white-space:pre-wrap}
.note b{color:#111}
.stat{display:flex;gap:18px;color:var(--mut);font-size:13px;margin-top:4px}
.stat b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);text-align:center;padding:40px 0;font-size:14px}
footer{color:var(--mut);font-size:11.5px;text-align:center;padding:22px 0 6px}
.tag{display:inline-block;background:var(--soft);color:var(--mut);border-radius:6px;padding:1px 7px;font-size:11.5px;margin-left:6px}
</style>
</head>

  <header>
    <h1>细胞生物学<small id="sub"></small></h1>
    <nav>
      <button data-v="hot" class="on">高频考点</button>
      <button data-v="all">全部知识点</button>
      <button data-v="quiz">做题</button>
    </nav>

  <main>

  <footer>数据来自教材整理资料与 5 套历年真题 · 单文件离线可用</footer>

<script>
const DATA = {"terms":[{"term":"细胞器","def":"凡是在光镜和电镜下能分辨出的具有一定形态结构特点、被单层或双层膜包绕、执行某些特定功能的结构。"},{"term":"细胞质","def":"细胞的组成部分之一，包括无色透明的胶状物质和各种细胞器，在细胞核和细胞膜之间。"},{"term":"拟核","def":"存在于原核生物，是没有由核膜包被的细胞核，也没有染色体，只有一个位于形状不规则且边界不明显区域的环形DNA分子，内含遗传物质"},{"term":"原核细胞","def":"是指一类无明显细胞核结构的单细胞生物。"},{"term":"被动运输","def":"是指所要转运的物质顺细胞膜两侧的浓度梯度或电化学梯度，由高浓度一侧向低浓度一侧进行的跨膜转运过程。"},{"term":"主动运输","def":"是指需要消耗能量把跨膜转运的物质由低浓度的一侧向高浓度一侧的运输过程。"},{"term":"简单扩散","def":"最简单的物质跨膜转运方式，即物质由浓度高的一侧向浓度低的一侧自由运动。"},{"term":"易化扩散","def":"依赖于膜转运蛋白帮助才能完成的物质运输过程，称为易化扩散。"},{"term":"载体蛋白","def":"需要同被运输的离子和分子结合,然后通过自身的构型变化或移动完成物质运输的膜蛋白。"},{"term":"吞噬作用","def":"细胞内吞较大的固体颗粒或多分子复合物等物质进入细胞的过程。"},{"term":"胞饮作用","def":"细胞摄入细胞外液及可溶性物质的过程。"},{"term":"胞吐作用","def":"细胞将自身合成的物质运出细胞，或将细胞内代谢的废物释放到细胞外的过程。"},{"term":"胞吞作用","def":"是细胞膜内陷，包围细胞外大分子和颗粒物质形成胞吞泡，脱离细胞膜进入细胞内的转运过程。"},{"term":"受体介导的胞吞作用","def":"细胞通过受体的介导，高效摄取细胞外特定大分子物质的过程。"},{"term":"内膜系统","def":"指位于细胞内，在结构、功能和发生上相互关联的膜性细胞器的总称。"},{"term":"信号肽","def":"有信号密码翻译出的一段约18—30个疏水氨基酸组成的肽链。"},{"term":"自噬性溶酶体","def":"细胞内源性物质先被细胞本身的膜所包围形成自噬体，然后自噬体再与内体性溶酶体融合形成自噬性溶酶体。"},{"term":"异噬性溶酶体","def":"细胞先以内吞方式将外源物质摄入细胞内，形成吞噬体或吞饮体，再与内体性溶酶体融合形成异噬性溶酶体。"},{"term":"残余小体","def":"吞噬性溶酶体到达消化分解的末期阶段时，由于水解酶的活性降低，还残留一些未被消化分解的物质，被保留在溶酶体内，形成在电镜下呈现电子密度较高的，色泽较深的残余物，这种溶酶体称为残余小体"},{"term":"蛋白质分选","def":"指生物体根据蛋白质自身的信号序列系统，在细胞不同部位合成蛋白质，然后进一步分类运输到细胞的指定部位，并装配成具有一定结构和功能的复合体参与细胞生命活动的过程。"},{"term":"囊泡运输","def":"膜性囊泡以出芽的形式从供体细胞器或质膜生成后，携带着运送的物质到受体细胞器或质膜，并与之融合，此过程为囊泡运输。"},{"term":"细胞氧化（细胞呼吸）","def":"依靠酶的催化，将细胞内各种供能物质氧化而释放能量的过程称为细胞氧化。由于细胞氧化过程中，要消耗O2和H2O，所以又称为细胞呼吸。"},{"term":"呼吸链","def":"按一定顺序组成排列在线粒体内膜上的递氢和递电子酶体系。称为电子传递链。由于该体系最终是以氧作为电子受体，与细胞摄取氧有关，因此又称为呼吸链（respiratorychain)。"},{"term":"电子载体","def":"在电子传递过程中，与释放的电子结合并将电子传递下去的物质。"},{"term":"细胞骨架","def":"是细胞内蛋白质纤维网架体系的总称，包括微丝，微管和中间丝。"},{"term":"微管组织中心","def":"指微管在生理状态及药物处理使其解聚后重新组装的启动位置。"},{"term":"微管","def":"是位于细胞质内由微管蛋白组成的中空的管状结构。"},{"term":"微丝","def":"是由肌动蛋白构成的直径约为7nm的骨架纤维，又称为肌动蛋白纤维。"},{"term":"马达蛋白","def":"指能利用ATP水解产生的能量驱动自身携带运输物沿着微管或微丝运动的蛋白质，可分为三个不同的家族：肌球蛋白家族，驱动蛋白家族和动力蛋白家族。"},{"term":"中间丝","def":"又称为中间纤维，是动物细胞中存在的由中间丝蛋白组成的直径为10nm的一类纤维。"},{"term":"核纤层","def":"在核膜内层的内表面上，结合着一层电子密度大的物质。它是由10nm左右的核纤层纤维纵横排列，交织而成的网状纤维蛋白层。与核膜上的蛋白质相结合。核纤层由三种核纤层蛋白A,B,C组成。"},{"term":"染色质","def":"是间期细胞核内能被碱性染料染色的物质，是由DNA，组蛋白，非组蛋白及少量RNA组成的线性复合结构，是遗传物质存在的形式。分为常染色质和异染色质。"},{"term":"组蛋白","def":"所有真核生物的细胞核中,与DNA结合存在的碱性蛋白质的总称。"},{"term":"非组蛋白","def":"细胞核中组蛋白以外的酸性蛋白质，主要指与特异DNA蛋白结合的蛋白质"},{"term":"常染色质","def":"常染色质直径约10nm，是均一疏松、螺旋化程度小、分散度大的染色质纤维部分，不易被碱性染料着色，折光性强，在电镜下呈浅亮区，多分布于核心的中央，少量分布于核仁内，主要含有单一序列DNA和部分重复序列的DNA，代表有活性的DNA分子部分，功能活跃，一定条件下可进行复制和转录。"},{"term":"异染色质","def":"是指在细胞间期及早前期时仍以凝集状态存在，染色深的块状结构。异染色质丝折叠紧密，散布在整个核内，部分与核仁结合。异染色质的DNA分子与组蛋白等紧密结合，螺旋缠绕紧密，很少转录，功能上处于静止状态，是低活性的染色质。"},{"term":"结构异染色质","def":"指的是各种类型细胞在整个细胞周期内处于凝集状态的染色质，多定位于着丝粒区域，端粒和染色体臂的凹入部位，多在S期的晚期复制。"},{"term":"兼性异染色质","def":"在一定的细胞类型中或者在一定的发育阶段凝集，由常染色体转变而来的异染色质。"},{"term":"核仁组织区","def":"位于13,14,15,21,22号染色体的短臂末端与随体之间的染色质细丝上，共同构成的区域，与间期细胞核仁形成有关。"},{"term":"细胞信号转导","def":"指外界信号（如光、电、化学分子）作用于细胞表面受体，引起胞内信使的浓度变化，进而导致细胞应答反应的一系列过程。"},{"term":"信号分子","def":"参与细胞信号转导的化学分子，如激素，神经递质，生长因子等。"},{"term":"受体","def":"能够识别和选择性结合某种配体（信号分子）的大分子物质，多为糖蛋白。"},{"term":"配体","def":"能与受体特异性识别并结合的分子称为配体。"},{"term":"信号通路","def":"是指信息沿某一特定方向传递的路径。由一系列不同的蛋白组成的，执行着不同的生理生化功能。"},{"term":"第一信使","def":"通过与细胞膜（或胞内）受体结合，触发细胞内下游信号序贯传递，并最终能引发细胞生物学反应的首个化学分子。"},{"term":"第二信使","def":"是第一信使与细胞表面受体结合后，在细胞内产生或释放到细胞内的小分子活性物质。主要有：cAMP、cGMP、IP3、DG、Ca2+。"},{"term":"细胞增殖","def":"细胞通过生长和分裂而产生子代细胞，增加细胞数目，并使子细胞获得与母细胞相同或几乎完全相同的遗传特性的过程。"},{"term":"细胞周期","def":"连续分裂的细胞，由细胞分裂结束到下一次细胞分裂结束所经历的过程。"},{"term":"减数分裂","def":"真核细胞中一种特殊的细胞分裂，出现在有性生殖生物的原始生殖细胞中。染色体只复制一次而细胞分两次。结果是成熟生殖细胞中的染色体数目比原始生殖细胞中的减少一半。"},{"term":"同源染色体","def":"形态、大小及结构相同，但在DNA序列上并不一致的一对染色体，它们一条来自父方，一条来自母方。"},{"term":"联会","def":"减数分裂偶线期，同源染色体通过联会复合体两两配对的现象。"},{"term":"二价体","def":"偶线期在光镜下可以看到两条结合在一起的一对染色体，称为二价体。"},{"term":"四分体","def":"每一对同源染色体都经过了复制，含四个染色单体，所以又称为四分体。"},{"term":"交换","def":"减数分裂前期Ⅰ的粗线期，联会的同源染色体中的两条非姐妹染色单体之间发生某些片段的互换，形成新的基因组合。"},{"term":"细胞周期蛋白","def":"是一类随细胞周期的变化呈周期性出现和消失的蛋白质，在细胞周期的不同阶段相继表达。可与Cdk结合并调控Cdk的活性，参与细胞周期活动的调节。"},{"term":"细胞周期蛋白依赖性激酶","def":"是调节细胞周期的激酶，通过磷酸化靶蛋白直接调节细胞周期。其活性受到cyclin的调节，cyclin水平的周期变化导致cdk的周期性的激活，并以此触发细胞周期事件。"},{"term":"细胞周期蛋白依赖激酶抑制因子（CKI）","def":"通过直接与Cdk或Cdk-cyclin复合物结合，抑制Cdk的激酶活性，阻断或延迟细胞周期的进行。这样一类蛋白称为细胞周期蛋白依赖激酶抑制因子（CKI）。"},{"term":"R点","def":"细胞周期过程中，G1期特有的检测点，是控制细胞由静止状态的G1期进入DNA合成期的关键点。"},{"term":"细胞分化","def":"在个体发育过程中，由同一受精卵产生的细胞在形态结构、生化组成和功能等方面产生稳定差异的过程。"},{"term":"细胞决定","def":"细胞在发生可识别的形态变化之前就已受到约束而向着特定方向分化，这时细胞的内部已发生变化，确定了未来发育命运，此后，分化的方向一般不会中途改变。"},{"term":"去分化（dedifferentiation）","def":"分化细胞在一定条件下失去分化特性，重新进入未分化状态。"},{"term":"转分化（transdifferentiation）","def":"已经分化细胞的在一定条件下失去其原有的形态与功能特征，转变成为其他类型的细胞，称为转分化。"},{"term":"细胞衰老","def":"细胞在正常的环境条件下发生的细胞生理功能减退或消失、增值能力减弱以及细胞形态变化，并趋向死亡的现象。"},{"term":"Hayflick界限","def":"动物体细胞在体外可传代的次数，与物种的寿命有关；细胞的分裂能力与个体的年龄有关，体外培养细胞的寿命是有一定界限的，故称为Hayflick界限。"},{"term":"细胞死亡","def":"是细胞生命现象不可逆的停止及细胞生命的结束。"},{"term":"细胞坏死","def":"细胞坏死是指因病理原因而产生的细胞被动死亡，如物理性、化学性的损害因子及缺氧与营养不良等均可导致细胞坏死。"},{"term":"程序性细胞死亡","def":"程序性细胞死亡是指为维持内环境稳定，由基因控制的细胞自主的有序性的死亡，它涉及一系列基因的激活、表达以及调控等的作用，因而是具有生理性和选择性的。"},{"term":"凋亡小体","def":"凋亡细胞经细胞核核碎裂和染色质凝缩形成染色质块，然后整个细胞通过发芽、起泡等方式形成一个球形的突起，并在其根部绞窄而脱落形成一些大小不等，内含胞质、细胞器及核碎片的小体称为凋亡小体。"},{"term":"细胞自噬","def":"通过溶酶体与双层膜包裹的细胞自身物质融合，从而降解细胞自身物质的过程。"}],"qa":[{"q":"真核细胞与原核细胞基本特征的比较","a":"","star":false},{"q":"细胞膜的生物学特性有哪些？","a":"具有一定的流动性；膜的不对称性。","star":false},{"q":"小分子物质跨膜运输的方式有哪些？","a":"被动运输（简单扩散，易化扩散）主动运输（ATP提供能量的离子泵运输，协同运输）","star":false},{"q":"离子通道的特点：","a":"①通道是双向的。②离子通道对被转运离子的大小和所带电荷都有高度的选择性。③转运速率高。④离子通道不是持续开放的。","star":false},{"q":"大分子与颗粒物质跨膜运输的方式有哪些？","a":"胞吞作用：吞噬作用，胞饮作用和受体介导的胞吞作用；胞吐作用","star":false},{"q":"胞吞作用的类型及各类型的过程。","a":"吞噬作用，胞饮作用，受体介导的胞吞作用吞噬作用：被吞噬颗粒吸附在细胞表面-质膜内陷形成伪足包裹固体颗粒-吞噬泡胞饮作用：液体或极小颗粒吸附在细胞表面-质膜内陷包裹-胞饮泡。配体受体识别--质膜凹陷—-“有被小窝”--有被小泡--无被小泡--与膜内体结合--受体泡+配体泡--受体再循环--配体被消化","star":true},{"q":"简述受体介导的LDL胞吞作用过程。","a":"LDL与细胞膜上的LDL受体结合，网格蛋白聚集，形成有被小窝，再形成有被小泡。有被小泡脱衣被变成无被小泡并与内体融合，LDL颗粒与受体分离，受体返回质膜重新利用。LDL颗粒在溶酶体酶作用下，分解为游离的胆固醇进入细胞质，用于合成新的细胞膜。","star":false},{"q":"内膜系统的意义①有效地增加了细胞内膜的表面积，并在细胞内形成了一个个相互独立的膜性房室。","a":"②内膜系统各成员间，通过形成转运囊泡进行彼此的物质和信息交流，使细胞内一系列生命活动能够有序地稳定进行。③内膜系统各成员之间及细胞膜的膜成分也得到了不断的更新重组。④沟通了细胞与外环境的相互联系。","star":false},{"q":"信号肽假说：","a":"1）信号肽的生成2）SRP识别并结合信号肽3）SRP识别并结合ER膜上的SRP受体4）核糖体、新生肽与内质网膜上的易位子结合。5）SRP解离，肽链继续合成，6）肽链合成完成后，内质网中的信号肽酶将信号肽切除。","star":false},{"q":"粗面内质网与滑面内质网在形态结构、功能上的区别粗面内质网形态上成板层状排列的扁囊结构，囊腔内为蛋白质物质。","a":"主要功能是蛋白质的转运，修饰和加工。滑面内质网表面光滑，常有分支小体或圆形小泡构成三维立体网状结构。主要功能为肝的解毒功能以及一些脂类分子的合成和代谢，还参与糖原的合成与分解。","star":true},{"q":"高尔基复合体的超微结构：","a":"电镜下，位于核附近，由大泡、小泡、扁平囊组成的囊泡状膜性细胞器。功能：1：是细胞内蛋白质运输和分泌的中转站。2：使蛋白质加工的重要场所。3：是细胞内蛋白质分选和囊泡运输的枢纽。","star":true},{"q":"高尔基复合体上加工过的各种蛋白质经分拣包装成分泌小泡后，主要的三条运输途径？","a":"①溶酶体酶以有被囊泡的方式转运到溶酶体；②分泌蛋白以有被囊泡的方式到达细胞膜，与细胞膜融合后分泌到细胞外；③分泌蛋白以有被囊泡的方式暂时贮存在细胞质，再择机分泌到细胞外。","star":false},{"q":"质膜、内质网、高尔基复合体化学组成的比较。","a":"质膜：脂质（50%）、蛋白质（10%）、糖（1-10%）。内质网：脂质（30-40%）、蛋白质（60-70%）。高尔基复合体：脂质（40%）、蛋白质（60%）。（主要突出脂类、蛋白质的比例上的区别）","star":false},{"q":"溶酶体的特性、类型和形成过程。","a":"特性：含多种酸性水解酶；腔内为酸性环境；膜高度稳定；膜转运蛋白丰富。类型：传统分类：初级溶酶体，次级溶酶体。根据吞噬物分类：内体性溶酶体，吞噬溶酶体根据溶酶体底物来源分类：自噬溶酶体、异噬溶酶体、残余体形成过程1）酶蛋白前体合成、初加工和转运（RER）2）进行标记、分选和转运（高尔基体）3）内体性溶酶体的形成4）溶酶体成熟","star":false},{"q":"溶酶体的功能。","a":"参与细胞防御;参与细胞结构成分的更新;消化和营养作用;参与机体的组织器官变态和退化;参与生物个体发生、发育过程;参与激素合成及激素水平的调节;参与某些腺体细胞分泌过程的调节。","star":false},{"q":"内质网、高尔基体、溶酶体及过氧化物酶体的标志性酶。","a":"内质网：葡萄糖-6-磷酸酶。高尔基体：糖基转移酶。溶酶体：酸性磷酸酶。过氧化物酶体：过氧化氢酶。","star":false},{"q":"胞内蛋白质运输的三种方式","a":"囊泡运输、门孔运输和跨膜运输","star":false},{"q":"囊泡的三种类型及运输方向。","a":"网格蛋白包被囊泡、COPⅠ、COPⅡ。运输方向：网格蛋白包被小泡负责蛋白质从高尔基体反面的管网结构到质膜、胞内体或溶酶体运输；同时在受体介导细胞膜内吞过程中，也负责将物质从质膜-内吞泡-包内体-溶酶体的运输。COPⅠ包被囊泡主要负责高尔基体内蛋白逆向转运，同时回收、转运内质网逃逸蛋白。COPⅡ包被囊泡运出内质网合成的蛋白到高尔基复合体。","star":true},{"q":"简要归纳分泌蛋白的合成、加工、运输及分泌过程。","a":"内质网——高尔基体——囊泡——细胞膜——细胞外。分为6个阶段：（1）核糖体阶段，包括分泌型蛋白质的合成和蛋白质跨膜转运；内质网运输阶段，包括分泌蛋白腔内运输、蛋白质糖基化等粗加工和储存；细胞质基质运输阶段，分泌蛋白与小泡形成脱离糙面内质网移向高尔基复合体，与其顺面扁平囊融合；（4）高尔基复合体加工修饰阶段，分泌蛋白质在高尔基复合体的扁平囊内进行加工，然后以大囊泡的形式进入细胞质基质。（5）细胞内储存阶段，大囊泡进一步浓缩、发育成分泌泡，向质膜移动，等待释放（6）胞吐阶段，分泌泡与质膜融合，将分泌蛋白释放到胞外。","star":false},{"q":"线粒体的超微结构。","a":"在电镜下观察，线粒体是由两层单位膜套叠而成的封闭的囊状结构。主要由外膜、内膜、膜间腔和基质组成。","star":false},{"q":"线粒体的化学组分和各部分的标志酶。","a":"化学组分：蛋白质、DNA、脂质。外膜：单胺氧化酶。内膜：细胞色素氧化酶。膜间腔：腺苷酸激酶。基质：苹果酸脱氢酶。","star":false},{"q":"以葡萄糖为例说明细胞氧化的过程及发生部位。","a":"糖酵解（细胞质）乙酰辅酶A（线粒体基质）三磷酸循环（线粒体基质）电子传递和氧化磷酸化（线粒体内膜）","star":false},{"q":"两条电子传递链（呼吸链）的组成。","a":"复合体Ⅰ、Ⅲ、Ⅳ组成呼吸链的主要传递途径，复合体Ⅱ、Ⅲ、Ⅳ组成另一条传递途径","star":false},{"q":"为什么说线粒体是一个半自主性细胞器？","a":"1）线粒体有自身的DNA，具有遗传上的自主性。线粒体内存在着自身的DNA（mtDNA）和完整的遗传信息传递与表达系统。能合成自身的mRNA、tRNA、rRNA，并生成自身的蛋白质，具有一定的遗传性。2）线粒体的自主性是有限的，功能的实现有赖于两套遗传系统的协调作用。线粒体的DNA只含有3种蛋白质的遗传信息，占全部蛋白质的10%，其余90%的蛋白质由核DNA编码；线粒体的DNA转录和翻译所需的酶由核DNA编码；线粒体的生物发生是核DNA和mtDNA分别受控的过程。","star":false},{"q":"简述微丝、微管的组成成分及组装。","a":"组成成分组装微丝肌动蛋白成核期：G-actin单体缓慢聚合寡聚体（核）延长期：寡聚体快速延长F-actin多聚体平衡期：G-actin和F-actin的浓度处于动态平衡微管微管是由微管蛋白组成的中空管状结构，微管蛋白主要包括α微管蛋白和β微管蛋白。成核期：先由α和β微管蛋白聚合成一个短的寡聚体结构，即核心形成；聚合期：微管蛋白聚合速度大于解聚速度，微管延长；稳定期：游离微管蛋白浓度下降，达到临界浓度，微管的组装与去组装速度相等，微管长度相对恒定；","star":false},{"q":"微管在细胞内的三种存在方式及分布单管，构成纺锤丝的微管；二联管、三联管，构成纤毛、鞭毛和中心体的微管。","a":"","star":false},{"q":"简述微丝、微管、中间丝的主要功能。","a":"微管：支架作用维持细胞形态；参与细胞呢物质运输；维持细胞器的定位和分布；组成纤毛和鞭毛运动的原件；参与纺锤体的形成和染色体的运动。微丝：细胞内运动；胞吞作用；肌肉收缩；细胞运动；维持细胞形态；参与细胞分裂；信号传递）中间丝：支持（撑）作用、胞内物质运输、信息（号）传递、在相邻细胞、细胞与基膜之间形成连接结构、参与细胞分化。","star":true},{"q":"微管马达蛋白的类型及运输方向。","a":"分为驱动蛋白家族（微管负极到正极，背向中心体）；动力蛋白家族（微管正极到负极，朝向中心体）。运输方向：驱动蛋白向微管正极移动;动力蛋白向微管负极移动。","star":true},{"q":"微丝体外装配过程。","a":"成核期：G-actin单体缓慢聚合寡聚体（核）。延长期：寡聚体快速延长F-actin多聚体。平衡期：G-actin和F-actin的浓度处于动态平衡。","star":false},{"q":"列表比较三种细胞骨架成分的单体形状、组成成分、分布、结构、极性、组织特异性、功能、特异性药物。","a":"","star":false},{"q":"简述间期细胞核的结构","a":"核膜，核仁，染色质，核基质","star":false},{"q":"简述核孔复合体结构、功能。","a":"捕鱼笼式核孔复合体模型：胞质环位于核孔边缘的胞质面，环上有8条纤维伸向胞质面；核质环位于核孔边缘的核质面，环上有8条纤维伸向核质面；辐是由核孔边缘伸向中心，呈辐射状8重对称，中央栓位于核孔中心。核孔复合体的功能：介导细胞核与细胞质间的物质运输，其运输方式可分为被动运输和主动运输。","star":false},{"q":"简述核孔复合体主动运输的特点1核孔直径可随运输物质的大小自我调节。","a":"2是一个信号识别与载体介导的过程，需要消耗ATP来提供能量。3具有双向性和高度选择性。","star":false},{"q":"简述核纤层的组成、位置、功能组成：","a":"核纤层蛋白LaminA、LaminB1，B2、LaminC核纤层相关蛋白位置：紧靠细胞核内膜）功能:1核仁的完整与稳定。2、为染色质提供锚定位点。3、核纤层与染色质的凝集和染色体的解聚密切相关）","star":false},{"q":"简述染色质的化学组成、结构。","a":"染色质的化学组成：DNA、组蛋白、非组蛋白、少量RNA。结构：（1）染色质的一级结构——核小体：（2）染色质的二级结构——30nm纤维：。（3）染色质的三级结构——超螺线管。（4）染色质的四级结构——再次折叠而成染色单体比较组蛋白和非组蛋白的特点。比较常染色质和异染色质的特点。。","star":true},{"q":"简述核仁的化学组成、结构、功能。","a":"化学组成：蛋白质、DNA、RNA、水和少量脂类结构：（1）纤维中心（2）致密纤维组分。（3）颗粒组分。（4）其他结构：核仁除了上述3种基本结构外，还有核仁基质。或核仁骨架。核仁的功能：1）合成rRNA；2）装配核糖体的大、小亚基。","star":true},{"q":".细胞通讯的类型","a":"细胞间隙连接通讯;膜表面分子接触通讯；化学信号分子介导通讯","star":false},{"q":"化学信号分子的种类和作用方式有哪些?","a":"种类：蛋白质或小分子有机化合物作用方式：内分泌，旁分泌，自分泌，突触分泌","star":false},{"q":"受体的概念及类型：","a":"概念：是细胞膜或细胞内能够被外源化学信号分子特异性识别并与之结合的一类特异性蛋白质。类型：细胞膜受体（G蛋白耦联型受体，酶偶联型受体，离子通道型受体）细胞内受体","star":false},{"q":"配体和受体结合的特点特异性;高亲和性；饱和性；可逆性；可调节性；特定的作用","a":"模式","star":false},{"q":"简述有丝分裂的过程及意义：","a":"前期（染色质凝集成染色体，纺锤体出现，分裂极确定，核仁消失，核膜解体）中期（染色体整齐地排列在赤道面上；晚中期时着丝点纵裂，二分体称为单分体）后期（染色体移向两极，细胞拉长，膜下出现微丝收缩环）末期（染色体解螺旋；纺锤丝，星射线解体，核仁，核膜再现）意义：将染色质DNA精确地分配至两个子代细胞，从而保证了遗传性状的继承和稳定。","star":true},{"q":"简述减数分裂的过程。","a":"减数分裂Ⅰ前期Ⅰ:细线期（光镜下分辨不出两条染色单体）偶线期（同源染色体联会）粗线期（染色体进一步浓集，DNA重组活跃）双线期（联会的同源染色体开始分离，但在交叉点上还保持联系）终变期（核膜核仁消失，纺锤体形成）中期Ⅰ:同源染色体排列在赤道板两侧后期Ⅰ:同源染色体分开，分别向两极移动末期Ⅰ:染色体变为染色质，核膜核仁出现减数分裂Ⅱ前期Ⅱ:染色质凝集成染色体，纺锤体出现，核膜核仁消失中期Ⅱ:染色体的动粒排列到细胞中央赤道板上（没有同源染色体）后期Ⅱ:每条染色体的动粒分离，两条姐妹染色单体也随之分开，成为为两条染色体，在纺锤丝的牵引下移向细胞的两极。未期Ⅱ:达到两极的染色体，分别进入两个子细胞，重现核膜、核仁，胞质分裂，减数第二次分裂结束，形成了4个子细胞。","star":false},{"q":"简述减数分裂的意义：","a":"维持物种世代间染色体数目的相对恒定，即遗传的相对稳定性。是生物种内生殖细胞遗传基础多样性、变异性的一种机制，即遗传的变异性。","star":false},{"q":"细胞周期时期的划分及各时期的主要事件细胞周期分为G1，S，G2，M期G1：","a":"细胞体积增大，RNA、核糖体及大量蛋白质合成。S：进行DNA的复制、染色体组成（组蛋白和非组蛋白）的合成。中心粒复制。G2：继续合成大量RNA和蛋白质，特别是微管蛋白、有丝分裂因子。并合成有丝分裂调控的重要因子——MPFM：染色质螺旋化变为染色体，并均匀分配到两个子细胞的过程。同时伴有核的一系列变化和胞质分裂。","star":true},{"q":"细胞周期调控蛋白的组成特点及功能细胞周期蛋白的一大特点是能与细胞周期蛋白依赖激酶特异性结合，使Cdk活化。","a":"各类细胞周期蛋白均含有一段约100个氨基酸的保守序列，称为周期蛋白框。","star":false},{"q":"细胞周期的主要检测点有哪些？","a":"主要检测的内容是什么？（1）G1/S检验点：在酵母中称start点，在哺乳动物中称R点，检验DNA是否损伤、细胞外环境是否适宜、细胞体积是否足够大。（2）S期检验点：检验DNA复制是否完成。（3）G2/M检验点：检验DNA是否损伤、细胞体积是否足够大。（4）中-后期检验点：纺锤体组装检验点，检测染色体上所有的动粒是否与动粒微管相连。","star":true},{"q":"细胞分化潜能，细胞分化的特点细胞的分化潜能指的是一个细胞分化成多少种细胞的能力。","a":"特点:1.细胞分化具有稳定性，即分化一般是单方向进行，一旦形成决定，细胞将很难再回到从前的状态。但在一些特殊的条件下，分化有一定的可逆性。","star":false},{"q":"细胞分化还具有时空性，即细胞因其所处发育阶段和空间位置的不同，出现形态上的差异和功能上的特化。","a":"","star":false},{"q":"细胞分化与细胞决定的关系细胞决定先于细胞分化，并制约着分化的方向，决定之后，分化的方向一般不会中途改变，而细胞分化是细胞决定稳定发展的结果。","a":"","star":false},{"q":"细胞分化的内在因素","a":"细胞核对细胞分化的影响细胞质对细胞分化的影响","star":false},{"q":"衰老细胞的变化1）核酸的改变DNA：","a":"从总体上DNA复制与转录在细胞衰老时均受抑制，但也有个别基因会异常激活，端粒DNA丢失，线粒体DNA特异性缺失，DNA氧化、断裂、缺失和交联，甲基化程度降低。RNA：mRNA和tRNA含量降低。2）蛋白质的改变：合成下降，蛋白质稳定性、抗原性，可消化性下降，酶失活。3）糖类及脂类的改变：糖减少，不饱和脂肪酸被氧化","star":false},{"q":"细胞凋亡的主要变化有哪些？","a":"凋亡细胞的形态学特征1）细胞核的变化：染色质凝集、边缘化、核碎裂2）细胞器变化：线粒体增大，空泡化；内质网膨胀，不断扩张。细胞骨架致密、紊乱。3）细胞膜变化：膜电位降低，莫流动性降低、磷脂酰丝氨酸外翻。4）凋亡小体的形成和清除凋亡细胞的生化改变：染色质DNA的特征性片段化断裂（DNAladder）Caspase蛋白酶降解以胞质Ca2+为代表的离子改变细胞凋亡与细胞坏死的主要区别。","star":true},{"q":"细胞凋亡的意义。","a":"参与发育过程的调节；参与免疫细胞活化过程的调节；参与衰老受损细胞的清除。","star":false},{"q":"根据细胞的增殖能力，体内的细胞分为哪三种类型？","a":"从增殖的角度来看，可将高等动物的细胞分为三类：①连续分裂细胞：在细胞周期中连续运转因而又称为周期细胞，如表皮生发层细胞、部分骨髓细胞。②休眠细胞暂不分裂，但在适当的刺激下可重新进入细胞周期，称G0期细胞，如淋巴细胞、肝、肾细胞等。③不分裂细胞，指不可逆地脱离细胞周期，不再分裂的细胞，又称终端细胞，如神经、肌肉等。","star":true}],"saomang":[{"title":"细胞的概论","items":[{"type":"p","text":"细胞是生物体的结构和功能的基本单位，是生命活动的基本单位。也是生物体遗传的基本单位，并具有遗传的全能性。"},{"type":"p","text":"细胞生物学是研究细胞生命活动规律的科学，它是在显微、亚显微和分子水平三个层次上，以研究细胞之功能、结构之特点，亚细胞器组成为主，并不断向探究细胞与细胞间、细胞与细胞外界相互作用等领域拓展，向探究细胞增殖、分裂、死亡等生命活动内在规律纵深的一门科学。"},{"type":"p","text":"细胞生物学历经的四个阶段：细胞的发现及细胞学说的提出；细胞器的发现；超微结构研究；分子生物学。"},{"type":"p","text":"英国科学家罗伯特·胡克发现软木细胞（死细胞），被称作\"细胞发现之父\"。"},{"type":"p","text":"荷兰列文虎克发现原生动物和细菌（活细胞）。"},{"type":"p","text":"德国科学家施莱登和施旺建立了细胞学说，细胞学说的核心内容：所有生命体都是有细胞构成的；细胞是构成生命体的基本单位；所有细胞来自于已有细胞。"},{"type":"p","text":"细胞化学成分的的基本结构：膜状、线状和颗粒状。"},{"type":"p","text":"细胞体积守恒定律：器官的大小主要取决于细胞数量的多少，而与细胞的大小无关。影响因素：核质比Np=Vn／（Vc－Vn）；比面值：I＝S／V＝3／R。"},{"type":"p","text":"细胞的基本共性："},{"type":"p","text":"结构上：选择性的膜结构，在细胞内外起屏障作用，在细胞内构筑区室；具有遗传物质；具有核糖体。"},{"type":"p","text":"功能上：拥有独特的遗传密码及使用方式；自我复制；自我调节；需要能量供应；新陈代谢；运动；应激反应。"},{"type":"p","text":"细菌形状：球菌、杆菌和螺旋菌。"},{"type":"p","text":"原核细胞的特点：无核膜；无特定分化的复杂结构及内膜系统；遗传信息量较小。"},{"type":"p","text":"真核细胞区别于原核细胞的三个特点：生物膜系统；遗传信息表达系统；细胞骨架系统。"},{"type":"p","text":"真核细胞与原核细胞的本质之差：真核细胞具有核和核膜；真核细胞具有丰富的细胞器；真核细胞具有骨架；真核细胞具有丰富的遗传信息。"}]},{"title":"细胞膜与物质运输","items":[{"type":"p","text":"1.内膜系统指位于细胞质内，在结构、功能以及发生上具有一定联系的膜性结构的总称。"},{"type":"p","text":"2.细胞膜的研究历史：单位膜；流动镶嵌模型；晶格镶嵌模型；板块镶嵌模型；脂筏模型。"},{"type":"p","text":"3.流动镶嵌模型的论点：膜质由双层脂分子构成；蛋白质嵌入细胞膜的方式各异；脂质与蛋白质均是流动的。"},{"type":"p","text":"4.生物膜包括内膜与细胞膜，主要由脂质和蛋白质构成。"},{"type":"p","text":"5.细胞膜的化学成分："},{"type":"p","text":"a)膜脂质"},{"type":"p","text":"i.磷脂（亲水性头部，疏水性尾部）；"},{"type":"p","text":"ii.糖脂（神经节苷脂过多沉积于神经细胞导致家族性黑矇性痴呆Tay－Sachs）；"},{"type":"p","text":"iii.胆固醇（提高了哺乳动物细胞膜的稳定性）"},{"type":"p","text":"b)膜蛋白"},{"type":"p","text":"i.跨膜蛋白（单次、多次、多亚基），特点是在跨膜区一般含有15～20个疏水性氨基酸，形成α－螺旋；"},{"type":"p","text":"ii.外周蛋白是指以弱的静电键结合与脂质分子头部极性区或跨膜蛋白膜区域的蛋白，特点是水溶性，可用离子溶液分离提取；"},{"type":"p","text":"iii.脂质锚定蛋白，特点是位于膜的两侧，必须使用去垢剂和有机溶液除去。"},{"type":"p","text":"c)膜糖"},{"type":"p","text":"i.功能：保护、润滑细胞；细胞间的识别与粘附；决定血型。"},{"type":"p","text":"ii.细胞被是指糖蛋白、蛋白聚糖和糖脂的糖分子侧链位于细胞膜外侧，交织在一起，覆盖在细胞表面，称为糖萼，又称多糖包被。"},{"type":"p","text":"6.小分子物质的跨膜运输"},{"type":"p","text":"a)被动运输（不消耗能量，顺浓度梯度）"},{"type":"p","text":"i.简单扩散是最简单的物质跨膜运输方式，即物质由浓度高的一侧向浓度低的一侧自由运动，例如：氧气、氮气、二氧化碳、水、乙醇、苯、尿素、甘油。"},{"type":"p","text":"ii.协助扩散（离子通道／载体蛋白），例如：非脂溶性物质、葡萄糖、氨基酸、核苷酸、金属离子。"},{"type":"p","text":"b)主动运输（消耗能量，逆浓度梯度）"},{"type":"p","text":"i.ATP提供能量的离子泵运输：泵入两分子钾离子，泵出三分子钠离子。"},{"type":"p","text":"ii.协同／耦联运输"},{"type":"p","text":"7.大分子颗粒物质的跨膜运输"},{"type":"p","text":"a)胞吞作用"},{"type":"p","text":"i.吞噬作用：通过\"大囊泡\"吞吃\"大颗粒物质\"。"},{"type":"p","text":"ii.胞饮作用：通过\"小囊泡\"吞吃\"液体、小分子物质\"。"},{"type":"p","text":"受体介导的胞吞作用：胆固醇的摄取和吸收、LDL低密度脂蛋白的内吞。"},{"type":"p","text":"b)胞吐作用"},{"type":"p","text":"i.固有性胞吐：所有真核生物的运输囊泡以出芽形式自反式高尔基体溢出而与质膜融合，这是一个持续不断的动态过程。"},{"type":"p","text":"ii.调节性胞吐"}]},{"title":"内膜系统","items":[{"type":"p","text":"把细胞质中由核膜，内质网膜，高尔基复合体膜的小管、小泡、扁囊组成的系统叫做内膜系统具有流动性，镶嵌性，不对称性和蛋白质极性。"},{"type":"p","text":"内质网是由单位膜围绕形成的膜性结构，形态呈泡状，管状，扁囊状。"},{"type":"p","text":"粗面内质网：膜表面附着核糖体；形态多为板层状排列的扁囊；多分布在分泌活动旺盛或分化较完善的细胞内，如胰腺细胞和浆细胞；可作为判断细胞分化程度和功能状态的一项重要指标。"},{"type":"p","text":"滑面内质网：膜表面无核糖体附着；形态多为分枝小管或小泡；多分布在一些特化的细胞中。"},{"type":"p","text":"内质网膜的标志酶是葡萄糖-6-磷酸酶。滑面内质网的标志酶是细胞色素P-450。粗面内质网上合成的蛋白质种类：分泌蛋白，可溶性驻留蛋白，膜蛋白。"},{"type":"p","text":"信号假说：蛋白质合成是在mRNA的指导下完成的。信号肽的作用：将核糖体引导到内质网膜，并继续进行蛋白质的合成。  SPR是信号识别颗粒。"},{"type":"p","text":"粗面内质网的功能：与蛋白质的合成（N型糖基化），加工和运输有关。"},{"type":"p","text":"滑面内质网的功能：脂类和类固醇激素的合成；脂类代谢；糖原分解；肝细胞的解毒；肌肉收缩的调解。"},{"type":"p","text":"高尔基复合体是由扁平膜囊和大、小囊泡构成的，扁平膜囊是其主要部分，分为顺面高尔基网（嗜锇反应阳性），高尔基体中间膜囊（NADP酶阳性），反面高尔基网（TTP酶阳性）。"},{"type":"p","text":"高尔基复合体的化学组成：蛋白质，脂类，糖脂。"},{"type":"p","text":"高尔基复合体的功能：参与细胞分泌活动；参与蛋白质的糖基化和酰基化修饰（O型糖基化）；参与蛋白质结构的再加工；参与蛋白质的分拣与运输；参与膜流与膜的转化。"},{"type":"p","text":"囊泡的类型：网格蛋白囊泡，COPⅠ型，COPⅡ型。"},{"type":"p","text":"溶酶体的标志酶是酸性磷酸酶。"},{"type":"p","text":"溶酶体类型：自噬溶酶体，是细胞内细胞器和其他结构自然减少和更新的正常途径。异噬溶酶体，进行异噬作用，即对细胞外源物质的消化过程。"},{"type":"p","text":"溶酶体的功能：消化、营养和防御作用；与器官发育有关；在细胞外的消化作用；与激素的合成与分泌调节有关。"},{"type":"p","text":"过氧化物酶体的标志酶是过氧化氢酶。"}]},{"title":"线粒体","items":[{"type":"p","text":"线粒体的起源：内共生假说认为线粒体来源于细菌。非内共生假说认为是质膜内陷的结果。"},{"type":"p","text":"线粒体的超微结构：外膜、内膜、膜间隙、基质"},{"type":"p","text":"内膜向内折叠形成嵴，增大了内膜的表面积。"},{"type":"p","text":"在内膜和嵴的表面上有很多带柄的球状小颗粒，称为基粒，实际是ATP合酶。"},{"type":"p","text":"基粒的组成：头部、柄部、基片。头部有可溶性ATP酶，具有ATP合酶活性，催化ATP的合成；有ATP酶复合体抑制多肽，可能具有调节酶活性的作用。柄部有对寡霉素敏感的蛋白，作用是调控质子通道。基片为疏水蛋白，能传递质子，有质子通道的作用。"},{"type":"p","text":"线粒体的化学组成：蛋白质、脂类、水。"},{"type":"p","text":"线粒体中酶的分布：外膜的标志酶是单胺氧化酶，内膜是琥珀酸脱氢酶，膜间隙是腺苷酸激酶，基质是苹果酸脱氢酶。"},{"type":"p","text":"线粒体的功能：对各种能源物质的氧化和能量转换，是贮能和供能的场所。"},{"type":"p","text":"细胞氧化：依靠依靠酶的催化，将细胞内各种供能物质氧化而放出能量的过程叫做细胞氧化或细胞呼吸。细胞氧化的过程：糖酵解，乙酰辅酶A的形成，三羧酸循环，电子传递偶联氧化磷酸化。"},{"type":"p","text":"电子载体在线粒体内膜上与其他蛋白质结合形成复合物，这些复合物有序地镶嵌在内膜上，组成了传递电子和质子的酶体系，称为电子传递链。"},{"type":"p","text":"线粒体的半自主性：线粒体具有自己的DNA并能进行表达，这是其自主性的一面。而实现线粒体基因组复制与表达的许多酶又是由核基因组编码的，所以线粒体是一个半自主细胞器。"},{"type":"p","text":"线粒体的增殖：间壁分离，收缩分离，出芽分裂。"}]},{"title":"细胞骨架","items":[{"type":"table","rows":[["","微管","微丝","中间丝"],["概念","由微管蛋白装配成的具有一定刚性的中空管状结构","由肌动蛋白构成的骨架纤维",""],["位置","细胞核周围","细胞膜内侧","分布在整个细胞中"],["蛋白质种类","α-微管蛋白，β-微管蛋白","球状肌动蛋白，纤维状肌动蛋白","中间丝蛋白"],["特异性药物","秋水仙碱，紫杉醇","鬼笔环肽，细胞松弛素",""],["功能","具有支架作用，维持细胞形态；维持细胞器的定位与分布；参与细胞内物质运输；组成纤毛和鞭毛运动的元件；参与纺锤体的形成和染色体的运动","具有支架作用，维持细胞形态；肌肉收缩；细胞运动；与信号传递有关；与细胞分裂有关","具有支架作用，维持细胞形态；与信号传递有关；与细胞分化有关；参与细胞内物质运输；在相邻细胞，细胞与基质间形成连接结构"]]}]},{"title":"细胞核","items":[{"type":"p","text":"间期细胞核主要由核被膜、染色质、核仁和核基质组成。"},{"type":"p","text":"细胞的大小以核质比（Np）表示。Np＝Vn／（Vc－Vn），核质比与生物种类、细胞类型、发育时期、生理状态及染色体倍数等有关。"},{"type":"p","text":"核膜由两层单位膜构成，分为内核膜和外核膜。外核膜表面附着大量的核糖体颗粒，有些部分与内质网相连。内核膜含有一些与核纤层相关的特异性蛋白质，如核纤层蛋白B的受体等，通过这些蛋白质，核纤层可紧密结合在内膜上。"},{"type":"p","text":"核内外膜之间形成的腔隙为核周池。核周池与粗面内质网有临时通道，腔内充满液态不定形物质，含有多种蛋白质和酶。"},{"type":"p","text":"核孔复合体的结构呈八重辐射对称的捕鱼笼状，包括：胞质环、核质环、辐和中心颗粒。"},{"type":"p","text":"核孔复合体的功能：是细胞核与细胞质之间进行物质交换的通道。"},{"type":"p","text":"核纤层是紧靠细胞核内膜处存在的一层由纤维组成的网络结构，由三种中间丝的多肽组成，分别是核纤层蛋白A、B、C。"},{"type":"p","text":"核纤层的功能：核纤层维持核膜的完整与稳定，为核膜提供支架，与核膜的行为密切相关；核纤层与染色质直接结合，即核纤层为DNA与核膜在结构上的连接点。"},{"type":"p","text":"染色质指间期细胞核内能被碱性染料染色的物质。"},{"type":"p","text":"染色质的化学组成：DNA、蛋白质（组蛋白、非组蛋白）、少量RNA。"},{"type":"p","text":"染色质的结构：一级结构——核小体、二级结构——30nm纤维、三级结构——超螺线管、四级结构——染色单体。"},{"type":"p","text":"核仁的主要成分是染色质蛋白质，为组蛋白和非组蛋白，其次是核糖体蛋白质，两种蛋白质占核仁干重的80％。此外，在核仁中存在多种酶系，如碱性磷酸酶、ATP酶等。面核仁也含RNA，约占核仁干重的10％，RNA转录及蛋白质合成旺盛的细胞，其核仁的RNA含量较高。DNA只占核仁的8％，主要是相随染色质中的DNA。核仁中几乎不含脂类物质。"},{"type":"p","text":"核仁的超微结构：裸露无膜由纤维丝构成的海棉状结构，包括纤维中心、致密纤维组分、颗粒组分、核仁基质。"},{"type":"p","text":"核仁的主要功能是合成rRNA和装配核糖体亚单位。"},{"type":"table","rows":[["","真核细胞","原核细胞"],["核糖体","80s","70s"],["大亚基","60s rRNA（5s、5.8s、28s） 50种蛋白","50s rRNA（5s、23s） 30多种蛋白"],["小亚基","40s rRNA（18s） 30多种蛋白","30s rRNA（16s） 20多种蛋白"]]}]},{"title":"细胞信号转导","items":[{"type":"p","text":"通过信号分子与受体的相互作用，将信号导入细胞并进行传递，引发细胞内特异生物学效应的过程，称为细胞信号转导。"},{"type":"p","text":"信号分子：作用到接受信号的细胞表面受体（或胞内受体），引发一系列细胞应答反应。"},{"type":"p","text":"信号分子根据其化学成分可分为激素、神经递质和局部介质。"},{"type":"p","text":"受体是指能与细胞外信号分子特异性结合并引发细胞后续反应的一类蛋白质，其特点是：特异性、亲合力、饱和性和可逆性。"},{"type":"p","text":"受体分为膜受体和胞内受体，其中膜受体又包括离子通道受体、G蛋白耦联受体和酶耦联受体三种。"},{"type":"p","text":"信号通路是指信息沿着某一特定方向传递的路径。"},{"type":"p","text":"G蛋白耦联受体信号通路："},{"type":"p","text":"G蛋白：全称为GTP结合蛋白，在细胞信号通路中起信号转换器或分子开关作用。"},{"type":"p","text":"G蛋白耦联受体：含有7个跨膜区，N－端在细胞外，C－端在细胞内。"},{"type":"p","text":"G蛋白耦联受体的活化步骤：受体－配体结合使G蛋白发生活化；G蛋白活化信号的传递；G蛋白的失活"},{"type":"p","text":"习惯上将把激素等胞外信号分子（或称配体）比作信息传递的第一信使，将由第一信使引发胞内释放的信号分子叫做第二信使。"}]},{"title":"细胞增殖与细胞分裂","items":[{"type":"p","text":"细胞分裂大致分为三种：无丝分裂、有丝分裂和减数分裂。"},{"type":"p","text":"无丝分裂是最简单的分裂方式，分裂迅速、能量消耗少，分裂中细胞仍可执行其功能。"},{"type":"p","text":"细胞有丝分裂："},{"type":"p","text":"前期：染色质凝集成染色体；核膜破裂和核仁解体；分裂极确立与纺锤体开始形成。"},{"type":"p","text":"中期：由核膜解体到染色体排列至赤道面的阶段。"},{"type":"p","text":"后期：指姐妹染色单体分开并移向两极的时期。"},{"type":"p","text":"末期：子核的形成；胞质分裂。"},{"type":"p","text":"纺锤体微管：星体微管、极间微管和动粒微管。有丝分裂染色体和纺锤体构成有丝分裂器，保证复制和包装后的染色单体能均匀地分配到子代细胞中。"},{"type":"p","text":"胞质分裂时形成收缩环，收缩环是由大量平行排列的肌动蛋白和结合在上面的Ⅱ型肌球蛋白等成分组成的动态结构。"},{"type":"p","text":"减数分裂是真核细胞中一类特殊类型的细胞分裂，主要发生在有性生殖生物的生殖细胞中。"},{"type":"p","text":"减数分裂的前期Ⅰ包括细线期、偶线期、粗线期、双线期和终变期。"},{"type":"p","text":"偶线期是同源染色体配对的时期，这种配对称为联会。在联会的同源染色体之间，沿纵轴方向存在一种特殊结构，即联会复合体。联会复合体形成于偶线期，成熟于粗线期，存在数天，消失于双线期。"},{"type":"p","text":"终变期二价体的形态表现出多样性，如V型、O型、8型等。"},{"type":"p","text":"减数分裂的意义：使亲代与子代之间的染色体数目保持恒定，保证了物种的相对稳定性。"},{"type":"p","text":"细胞周期指由本次细胞分裂结束到下一次细胞分裂结束所经历的过程，可分为G1期、S期、G2期和M期。"},{"type":"p","text":"从细胞增殖的角度，可将高等动物细胞分为：连续分裂细胞、休眠细胞和不分裂细胞。"},{"type":"p","text":"细胞同步化是指在自然过程中发生或认为处理造成的使细胞群体处于同一细胞周期时相的过程。"},{"type":"p","text":"细胞周期各时相的特点"},{"type":"p","text":"G1期：进行活跃的RNA及蛋白质合成，细胞体积迅速增大，RNA聚合酶活性升高，结果mRNA、tRNA和rRNA不断产生，蛋白质含量也由此增加。"},{"type":"p","text":"S期：DNA复制需要S期活化因子的启动信号，必须处于感受状态的染色质DNA才能开始复制。"},{"type":"p","text":"G2期：继续大量合成RNA和蛋白质，特别是微管蛋白、有丝分裂因子、促细胞成熟因子等。"},{"type":"p","text":"M期：细胞形态、结构发生显著变化，染色体凝集及分离，核膜、核仁解体及重建，纺锤体、收缩环在胞质形成，细胞核分裂成两个子核，细胞质一分为二。"},{"type":"p","text":"细胞周期调控蛋白有细胞周期蛋白（cyclin）、细胞周期蛋白依赖性激酶（Cdk）和细胞周期蛋白依赖性激酶抑制因子（CKI）。"}]},{"title":"细胞分化、衰老、凋亡与死亡","items":[{"type":"p","text":"有同一受精卵产生的细胞，在形态结构、生化组成和功能等方面均产生明显的差异。这种在个体发育中形成稳定性差异的过程称为细胞分化。细胞分化的特点：原则上高度稳定；但某种特殊情况下也会发生去分化或转分化；具有时空性。"},{"type":"p","text":"已分化成熟的动物细胞可以从一种分化状态转变成另一种分化状态，这种现象称为转分化。"},{"type":"p","text":"拥有全能性的细胞称为全能细胞。受精卵及哺乳动物桑葚胚的8个细胞期之前，每个细胞均能分化成个体生物所有类型的细胞，并能发育成完整个体。细胞的这种发育潜能称为全能性。"},{"type":"p","text":"个体发育过程中，细胞在发生可识别的分化特征之前就确定了自己未来的发育命运，并向特定方向分化。细胞预先作出的发育选择，称之为细胞决定。细胞决定先于细胞分化，并制约着分化的方向，决定之后，分化的方向一般不会中途改变，而细胞分化是细胞决定稳定发展的结果。"},{"type":"p","text":"细胞衰老是指细胞在正常环境条件下发生的细胞生理功能和增殖能力减弱以及细胞形态发生变化，并趋向死亡的过程。"},{"type":"p","text":"Hayflick界限：细胞的分裂能力与个体年龄有关，体外培养的细胞的寿命是有一定界限的。"},{"type":"p","text":"凋亡细胞的形态改变：细胞核变化，核质浓缩、染色质浓缩并聚集成块；细胞器变化，多数细胞器保持完整，随后结构发生改变；细胞膜变化，细胞膜表面微绒毛和细胞间连接消失，细胞膜皱缩内陷，细胞体积缩小，细胞质浓缩；凋亡小体形成与清除。"},{"type":"p","text":"凋亡细胞的生化改变：以核酸内切酶为代表的核酸酶改变；以Caspase为代表的胞质酶改变；胞质钙离子为代表的离子改变。"},{"type":"p","text":"细胞凋亡的生物学意义：参与发育过程的调节；参与免疫细胞活化过程的调节；参与衰老、受损细胞的清除。"},{"type":"p","text":"细胞凋亡与细胞坏死的区别"}]}],"sets":[{"name":"23 本硕细胞生物","items":[{"cat":"名解","text":"细胞衰老"},{"cat":"名解","text":"内膜系统亲核蛋白"},{"cat":"名解","text":"受体"},{"cat":"简答","text":"马达蛋白的概念，微管中马达蛋白运输的方向"},{"cat":"简答","text":"胞吞作用的类型及过程"},{"cat":"简答","text":"核仁的化学组成，超微结构及主要功能"},{"cat":"综合","text":"细胞周期的概念，以及细胞周期检测点有哪些"},{"cat":"综合","text":"细胞凋亡的概念，及其特征性变化"},{"cat":"综合","text":"根据细胞的增殖能力，可将细胞分为哪些类"}]},{"name":"23 临床细胞生物学","items":[{"cat":"名解","text":"受体"},{"cat":"名解","text":"囊泡运输"},{"cat":"名解","text":"马达蛋白"},{"cat":"名解","text":"细胞分化"},{"cat":"简答","text":"胞吞的三种类型及各类型的过程"},{"cat":"简答","text":"核仁的化学组成，超微结构和功能"},{"cat":"简答","text":"高尔基复合体的超微结构和功能"},{"cat":"综合","text":"细胞周期的概念和主要检测点有哪些"},{"cat":"综合","text":"按照细胞的增殖能力，将体内细胞分为哪三种"},{"cat":"综合","text":"细胞凋亡，主要特征性变化有哪些"}]},{"name":"24 本硕细生","items":[{"cat":"名解","text":"易化扩散"},{"cat":"名解","text":"细胞呼吸"},{"cat":"名解","text":"配体"},{"cat":"名解","text":"马达蛋白"},{"cat":"简答","text":"微丝功能"},{"cat":"简答","text":"高尔基体组成部分及功能"},{"cat":"简答","text":"细胞周期分为哪几个时期及主要事件"},{"cat":"综合","text":"染色体化学组成，常染色质异染色质区别"},{"cat":"综合","text":"microRNA 的定义"},{"cat":"综合","text":"囊泡转运有哪些类型"}]},{"name":"24 临床法医生物制药细胞生物","items":[{"cat":"名解","text":"细胞决定"},{"cat":"名解","text":"易化扩散"},{"cat":"名解","text":"电子载体"},{"cat":"名解","text":"受体"},{"cat":"简答","text":"微丝的功能"},{"cat":"简答","text":"高尔基复合体各结构及其功能"}]},{"name":"24 影像细胞生物学","items":[{"cat":"名解","text":"主动运输"},{"cat":"名解","text":"呼吸链"},{"cat":"名解","text":"联会"},{"cat":"名解","text":"受体"},{"cat":"简答","text":"微管生物学功能"},{"cat":"简答","text":"有丝分裂时期和主要发生的过程"},{"cat":"简答
